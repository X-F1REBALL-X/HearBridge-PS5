<script>
var STR={"en":{"intro":"HearBridge PS5 is a payload (ELF) that streams the console's audio over the PS5's own Bluetooth to regular Bluetooth headphones or speakers. You control it from a web page served by the console. It doesn't touch games, the firmware or the jailbreak.","limHp":"Tested with Sony WF-1000XM6, OnePlus Buds Ace 2 and Xbox Wireless Headset.","req1":"A jailbroken PS5 with an ELF loader listening on port **9021** (elfldr).","req2":"Bluetooth headphones or a speaker with **A2DP** (SBC).","testedNote":"Tested on PS5 CFI-10xx (Marvell/NXP) and PS5 Slim CFI-2008 (MediaTek). Reports from other models are welcome.","log1":"Send an FTP server payload (for example [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) with the same loader you use for HearBridge.","log2":"Connect with FileZilla to the console's IP on the port the server shows (ftpsrv usually uses **2121**).","log3":"Download `/data/hearbridge/hearbridge.log` and `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` is also at `http://<console-ip>:8090/api/diag`.","notesData":"Settings, saved devices and the log are in `/data/hearbridge/` (`hearbridge.log` records every step).","r1":"the console model (CFI number, e.g. CFI-1016A)","r2":"the firmware version","r3":"the loader you used","r4":"whether the starting notification appeared","r5":"whether the page opens, and what **Chip** shows in **Details**","r6":"the log files (`hearbridge.log`, `diag.txt`)","language":"Language","navFeatures":"Features","navCompat":"Compatibility","navInstall":"Install","navHelp":"Troubleshooting","btnDownload":"Download latest release","btnDownloadShort":"Download","btnGithub":"View on GitHub","btnReport":"Report a problem","btnHowto":"How to install","h1a":"Bluetooth headphones for a jailbroken PS5","h1b":"Game and system audio, no dongle.","heroCap":"The control page on a TV.","limTitle":"Limits","lim1":"SBC only (no AAC, aptX or LDAC), one headset at a time, no microphone.","lim2":"The TV keeps playing sound too.","lim3":"Run only one payload that uses Bluetooth at a time. The DualSense keeps working.","compatTitle":"Compatibility","reqTitle":"Requirements","installTitle":"Install and run","s1T":"Download the ELF","s1D":"Download **HearBridge-PS5-1.3.0.elf** from the [latest release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Send it to the loader on port 9021","s2D":"Send the file to the console's loader, for example:","s3T":"Open the control page","s3D":"Open this address in the PS5 browser, on a phone or on a PC, or open the **HearBridge** tile that is added to the home screen on first run:","s4T":"Pair the headphones","s5T":"Update or stop","s5D":"Closing the page leaves HearBridge running. Sending the ELF again replaces the running copy. **Stop HearBridge** ends it.","copy":"Copy","copied":"Copied","shotsTitle":"Screenshots","shotPhone":"On a phone","helpTitle":"Troubleshooting","q1":"No HearBridge icon on the home screen","a1":"The icon is added again on every run, so run the ELF once more. The page also works without it at `http://<console-ip>:8090`.","q2":"The page does not open","a2":"Use the console's IP address and port 8090, from a device on the same network.","q3":"Headphones are not found when you press Scan","a3":"Hold the pair button until the light flashes fast, then press **Scan for devices** again.","q4":"No sound although the headphones are connected","a4":"Check that **Mute** is off and try **Test tone** in **Sound & games**. If there is still no sound, get the log and open an issue.","q5":"Nothing happens when I send the ELF","a5":"You should see the **\"HearBridge 1.3.0: starting\"** notification. If not, the loader did not run it.","logTitle":"Get the log","reportTitle":"Report a problem","reportIntro":"Open a GitHub issue and include:","footRel":"Releases","footIss":"Issues","footLic":"License","footSrc":"Source code","chipNote":"One file works on both Bluetooth chips. HearBridge finds the chip by itself and shows it under **Details**.","s4D":"Open **Settings**, then **Headsets**. Put the headphones in pairing mode, press **Scan for devices** (about 12 s), then **Connect**.","shotSet":"Settings: Sound & games","wnTitle":"What's new in 1.3.0","wnG1":"Game profiles (new)","wn1_1":"HearBridge detects the running game by itself and shows its name and cover art.","wn1_2":"Each game can have its own sound: EQ, preset, boost, volume and night mode.","wn1_3":"The game's profile loads by itself when the game starts, and your usual sound comes back when it closes.","wn1_4":"Each headset keeps its own profile for the same game. For example, the same game can have heavy bass on one headset and a balanced sound on another, and each one loads its own when it connects.","wn1_5":"Save up to 32 games, with up to 4 headsets per game.","wn1_6":"If the connected headset has no profile for the game yet, the game's latest profile from another headset is used, without overwriting it.","wn1_7":"Update Game Profile button: it stays grey and lights up as soon as you change anything in the sound. Press it to save the change for that game and that headset.","wn1_8":"In Settings, under Sound & games, every saved game shows the headsets saved for it. You can apply or delete the profile of a specific headset.","wnG2":"Headsets","wn2_1":"Real battery percentage on headsets that report it, plus a low battery alert.","wn2_2":"Volume from the earbuds: next/previous on earbuds with a case changes the volume, and the slider follows. You can turn this off in Settings.","wn2_3":"Quick switch between saved headsets in one tap. Up to 8 headsets can be saved.","wn2_4":"Better reconnect: headsets come back by themselves after rest mode or a lost link.","wn2_5":"Sound stops cleanly when the console goes into rest mode and comes back when it wakes up.","wnG3":"Sound","wn3_1":"Night mode: quieter explosions, clearer voices.","wn3_2":"Latency slider with a live estimate of the delay to your ears.","wn3_3":"More stable connection: sound quality recovers by itself after a short dropout.","wnG4":"Design","wn4_1":"New home screen, bigger and cleaner, with four sections: Headset, Sound, Connection and Log.","wn4_2":"Settings in a full screen side menu: Home, Headsets, Sound & games, Details, Backup & restore.","wn4_3":"New, more readable font and a new icon, also on the PS5 home screen tile.","wnG5":"Backup and restore","wn5_1":"Save and restore all your settings to USB, the internal drive, or as a browser download."},"ar":{"intro":"HearBridge PS5 حمولة (ELF) تنقل صوت الجهاز عبر بلوتوث PS5 المدمج إلى سماعات أو مكبرات بلوتوث عادية. تتحكم بها من صفحة ويب يقدمها الجهاز. لا تغيّر الألعاب ولا البرنامج الثابت ولا كسر الحماية.","limHp":"تم الاختبار مع Sony WF-1000XM6 وOnePlus Buds Ace 2 وXbox Wireless Headset.","req1":"جهاز PS5 مكسور الحماية مع محمّل ELF يستمع على المنفذ **9021** (elfldr).","req2":"سماعات أو مكبر صوت بلوتوث يدعم **A2DP** (SBC).","testedNote":"جُرّب على PS5 CFI-10xx (Marvell/NXP) وPS5 Slim CFI-2008 (MediaTek). نرحب بتقارير الطرازات الأخرى.","log1":"أرسل حمولة خادم FTP (مثل [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) عبر المحمّل نفسه الذي تستخدمه لـ HearBridge.","log2":"اتصل باستخدام FileZilla بعنوان IP الخاص بالجهاز على المنفذ الذي يعرضه الخادم (يستخدم ftpsrv عادةً المنفذ **2121**).","log3":"نزّل `/data/hearbridge/hearbridge.log` و`/data/hearbridge/diag.txt`.","logDiag":"يتوفر `diag.txt` أيضًا على `http://<console-ip>:8090/api/diag`.","notesData":"الإعدادات والأجهزة المحفوظة والسجل موجودة في `/data/hearbridge/` (يسجّل `hearbridge.log` كل خطوة).","r1":"طراز الجهاز (رقم CFI، مثل CFI-1016A)","r2":"إصدار النظام","r3":"المحمّل الذي استخدمته","r4":"هل ظهر إشعار البدء","r5":"هل تفتح الصفحة، وماذا تعرض **الشريحة** في **التفاصيل**","r6":"ملفات السجل (`hearbridge.log` و`diag.txt`)","language":"اللغة","navFeatures":"الميزات","navCompat":"التوافق","navInstall":"التثبيت","navHelp":"حل المشكلات","btnDownload":"تنزيل أحدث إصدار","btnDownloadShort":"تنزيل","btnGithub":"عرض على GitHub","btnReport":"الإبلاغ عن مشكلة","btnHowto":"طريقة التثبيت","h1a":"سماعات بلوتوث لجهاز PS5 مكسور الحماية","h1b":"صوت الألعاب والنظام، بدون دونجل.","heroCap":"صفحة التحكم على التلفاز.","limTitle":"القيود","lim1":"SBC فقط (بلا AAC أو aptX أو LDAC)، سماعة واحدة في كل مرة، بلا ميكروفون.","lim2":"يستمر التلفاز أيضًا في تشغيل الصوت.","lim3":"شغّل حمولة واحدة فقط تستخدم البلوتوث في كل مرة. ويستمر DualSense في العمل.","compatTitle":"التوافق","reqTitle":"المتطلبات","installTitle":"التثبيت والتشغيل","s1T":"نزّل ملف ELF","s1D":"نزّل **HearBridge-PS5-1.3.0.elf** من [أحدث إصدار](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"أرسله إلى المحمّل على المنفذ 9021","s2D":"أرسل الملف إلى محمّل الجهاز، مثلًا:","s3T":"افتح صفحة التحكم","s3D":"افتح هذا العنوان في متصفح PS5 أو على هاتف أو حاسوب، أو افتح مربع **HearBridge** الذي يُضاف إلى الشاشة الرئيسية عند التشغيل الأول:","s4T":"أقرن السماعات","s5T":"التحديث أو الإيقاف","s5D":"إغلاق الصفحة يُبقي HearBridge يعمل. إرسال ملف ELF مرة أخرى يستبدل النسخة العاملة. **إيقاف HearBridge** يُنهيه.","copy":"نسخ","copied":"تم النسخ","shotsTitle":"لقطات الشاشة","shotPhone":"على الهاتف","helpTitle":"حل المشكلات","q1":"لا تظهر أيقونة HearBridge في الشاشة الرئيسية","a1":"تُضاف الأيقونة من جديد في كل تشغيل، لذا شغّل ملف ELF مرة أخرى. الصفحة تعمل أيضًا بدونها على `http://<console-ip>:8090`.","q2":"الصفحة لا تفتح","a2":"استخدم عنوان IP للجهاز والمنفذ 8090، من جهاز على الشبكة نفسها.","q3":"لا يتم العثور على السماعات عند الضغط على البحث","a3":"اضغط مطولا على زر الاقتران حتى يومض الضوء بسرعة، ثم اضغط **البحث عن أجهزة** مرة أخرى.","q4":"لا يوجد صوت مع أن السماعات متصلة","a4":"تأكد أن **كتم** متوقف وجرّب **نغمة اختبار** في **الصوت والألعاب**. إذا بقي الصوت غائبا، نزّل السجل وافتح بلاغا.","q5":"لا يحدث شيء عند إرسال ملف ELF","a5":"يجب أن يظهر إشعار **\"HearBridge 1.3.0: starting\"**. إن لم يظهر، فالمحمّل لم يشغّلها.","logTitle":"الحصول على السجل","reportTitle":"الإبلاغ عن مشكلة","reportIntro":"افتح بلاغًا (issue) على GitHub وأرفق:","footRel":"الإصدارات","footIss":"البلاغات","footLic":"الترخيص","footSrc":"الشيفرة المصدرية","chipNote":"ملف واحد يعمل مع شريحتي البلوتوث. يتعرف HearBridge على الشريحة وحده ويعرضها في **التفاصيل**.","s4D":"افتح **الإعدادات** ثم **السماعات**. ضع السماعات في وضع الاقتران، واضغط **البحث عن أجهزة** (حوالي 12 ثانية)، ثم **اتصال**.","shotSet":"الإعدادات: الصوت والألعاب","wnTitle":"الجديد في 1.3.0","wnG1":"ملفات الألعاب (جديد)","wn1_1":"يتعرف HearBridge وحده على اللعبة التي تعمل ويعرض اسمها وغلافها.","wn1_2":"يمكن أن يكون لكل لعبة صوتها الخاص: المعادل والإعداد الجاهز والتعزيز ومستوى الصوت والوضع الليلي.","wn1_3":"يُحمَّل ملف اللعبة وحده عند بدء اللعبة، ويعود صوتك المعتاد عند إغلاقها.","wn1_4":"تحتفظ كل سماعة بملفها الخاص للعبة نفسها. مثلا، يمكن أن تكون اللعبة نفسها بجهير قوي على سماعة وبصوت متوازن على أخرى، وتحمّل كل سماعة ملفها عند اتصالها.","wn1_5":"احفظ حتى 32 لعبة، وحتى 4 سماعات لكل لعبة.","wn1_6":"إذا لم يكن للسماعة المتصلة ملف لهذه اللعبة بعد، يُستخدم أحدث ملف للعبة من سماعة أخرى، دون الكتابة فوقه.","wn1_7":"زر تحديث ملف اللعبة: يبقى رماديا ويضيء فور تغيير أي شيء في الصوت. اضغطه لحفظ التغيير لهذه اللعبة وهذه السماعة.","wn1_8":"في الإعدادات، ضمن الصوت والألعاب، تعرض كل لعبة محفوظة السماعات المحفوظة لها. يمكنك تطبيق ملف سماعة معينة أو حذفه.","wnG2":"السماعات","wn2_1":"نسبة بطارية حقيقية في السماعات التي تبلغ عنها، مع تنبيه عند انخفاض البطارية.","wn2_2":"الصوت من السماعات: التالي/السابق في السماعات ذات العلبة يغيّر مستوى الصوت، والشريط يتبعه. يمكنك إيقاف ذلك في الإعدادات.","wn2_3":"تبديل سريع بين السماعات المحفوظة بلمسة واحدة. يمكن حفظ حتى 8 سماعات.","wn2_4":"إعادة اتصال أفضل: تعود السماعات وحدها بعد وضع الراحة أو انقطاع الاتصال.","wn2_5":"يتوقف الصوت بشكل نظيف عند دخول الجهاز وضع الراحة ويعود عند استيقاظه.","wnG3":"الصوت","wn3_1":"الوضع الليلي: انفجارات أهدأ وأصوات أوضح.","wn3_2":"شريط زمن الاستجابة مع تقدير مباشر للتأخير حتى أذنيك.","wn3_3":"اتصال أكثر ثباتا: تتعافى جودة الصوت وحدها بعد انقطاع قصير.","wnG4":"التصميم","wn4_1":"شاشة رئيسية جديدة، أكبر وأنظف، بأربعة أقسام: السماعة والصوت والاتصال والسجل.","wn4_2":"الإعدادات في قائمة جانبية بملء الشاشة: الرئيسية، السماعات، الصوت والألعاب، التفاصيل، النسخ الاحتياطي والاستعادة.","wn4_3":"خط جديد أسهل في القراءة وأيقونة جديدة، تظهر أيضا على مربع الشاشة الرئيسية في PS5.","wnG5":"النسخ الاحتياطي والاستعادة","wn5_1":"احفظ كل إعداداتك واستعدها على USB أو التخزين الداخلي أو كتنزيل من المتصفح."},"es":{"intro":"HearBridge PS5 es un payload (ELF) que envía el audio de la consola por el Bluetooth propio de la PS5 a auriculares o altavoces Bluetooth normales. Se controla desde una página web que sirve la consola. No toca los juegos, el firmware ni el jailbreak.","limHp":"Probado con Sony WF-1000XM6, OnePlus Buds Ace 2 y Xbox Wireless Headset.","req1":"Una PS5 con jailbreak y un cargador de ELF escuchando en el puerto **9021** (elfldr).","req2":"Auriculares o un altavoz Bluetooth con **A2DP** (SBC).","testedNote":"Probado en PS5 CFI-10xx (Marvell/NXP) y PS5 Slim CFI-2008 (MediaTek). Se agradecen informes de otros modelos.","log1":"Envía un payload de servidor FTP (por ejemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con el mismo cargador que usas para HearBridge.","log2":"Conéctate con FileZilla a la IP de la consola en el puerto que muestra el servidor (ftpsrv suele usar el **2121**).","log3":"Descarga `/data/hearbridge/hearbridge.log` y `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` también está en `http://<console-ip>:8090/api/diag`.","notesData":"Los ajustes, los dispositivos guardados y el registro están en `/data/hearbridge/` (`hearbridge.log` registra cada paso).","r1":"el modelo de la consola (número CFI, p. ej. CFI-1016A)","r2":"la versión del firmware","r3":"el cargador que usaste","r4":"si apareció la notificación de inicio","r5":"si la página abre y qué muestra **Chip** en **Detalles**","r6":"los archivos de registro (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Funciones","navCompat":"Compatibilidad","navInstall":"Instalación","navHelp":"Solución de problemas","btnDownload":"Descargar la última versión","btnDownloadShort":"Descargar","btnGithub":"Ver en GitHub","btnReport":"Informar de un problema","btnHowto":"Cómo instalarlo","h1a":"Auriculares Bluetooth para una PS5 con jailbreak","h1b":"Audio de juegos y del sistema, sin adaptador.","heroCap":"La página de control en una TV.","limTitle":"Limitaciones","lim1":"Solo SBC (sin AAC, aptX ni LDAC), un auricular a la vez, sin micrófono.","lim2":"El televisor también sigue sonando.","lim3":"Ejecuta solo un payload que use Bluetooth a la vez. El DualSense sigue funcionando.","compatTitle":"Compatibilidad","reqTitle":"Requisitos","installTitle":"Instalación y ejecución","s1T":"Descarga el ELF","s1D":"Descarga **HearBridge-PS5-1.3.0.elf** de la [última versión](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envíalo al cargador en el puerto 9021","s2D":"Envía el archivo al cargador de la consola, por ejemplo:","s3T":"Abre la página de control","s3D":"Abre esta dirección en el navegador de la PS5, en un móvil o en un PC, o abre el icono **HearBridge** que se añade a la pantalla de inicio la primera vez:","s4T":"Empareja los auriculares","s5T":"Actualizar o detener","s5D":"Cerrar la página deja HearBridge funcionando. Enviar el ELF de nuevo reemplaza la copia en marcha. **Detener HearBridge** lo termina.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas","shotPhone":"En un móvil","helpTitle":"Solución de problemas","q1":"No aparece el icono de HearBridge en la pantalla de inicio","a1":"El icono se vuelve a añadir en cada ejecución, así que ejecuta el ELF otra vez. La página también funciona sin él en `http://<console-ip>:8090`.","q2":"La página no se abre","a2":"Usa la IP de la consola y el puerto 8090, desde un dispositivo en la misma red.","q3":"No se encuentran los auriculares al pulsar Buscar","a3":"Mantén pulsado el botón de emparejamiento hasta que la luz parpadee rápido y vuelve a pulsar **Buscar dispositivos**.","q4":"No hay sonido aunque los auriculares están conectados","a4":"Comprueba que **Silenciar** está desactivado y prueba **Tono de prueba** en **Sonido y juegos**. Si sigue sin sonar, consigue el log y abre un issue.","q5":"No pasa nada al enviar el ELF","a5":"Deberías ver la notificación **\"HearBridge 1.3.0: starting\"**. Si no, el cargador no lo ejecutó.","logTitle":"Obtener el registro","reportTitle":"Informar de un problema","reportIntro":"Abre una incidencia en GitHub e incluye:","footRel":"Versiones","footIss":"Incidencias","footLic":"Licencia","footSrc":"Código fuente","chipNote":"Un solo archivo funciona con los dos chips Bluetooth. HearBridge detecta el chip solo y lo muestra en **Detalles**.","s4D":"Abre **Ajustes** y luego **Auriculares**. Pon los auriculares en modo de emparejamiento, pulsa **Buscar dispositivos** (unos 12 s) y después **Conectar**.","shotSet":"Ajustes: Sonido y juegos","wnTitle":"Novedades de la 1.3.0","wnG1":"Perfiles de juego (nuevo)","wn1_1":"HearBridge detecta solo el juego en marcha y muestra su nombre y su portada.","wn1_2":"Cada juego puede tener su propio sonido: EQ, preajuste, refuerzo, volumen y modo nocturno.","wn1_3":"El perfil del juego se carga solo cuando empieza el juego, y tu sonido habitual vuelve cuando se cierra.","wn1_4":"Cada auricular guarda su propio perfil para el mismo juego. Por ejemplo, el mismo juego puede tener muchos graves en unos auriculares y un sonido equilibrado en otros, y cada uno carga el suyo al conectarse.","wn1_5":"Guarda hasta 32 juegos, con hasta 4 auriculares por juego.","wn1_6":"Si los auriculares conectados aún no tienen perfil para el juego, se usa el perfil más reciente del juego de otros auriculares, sin sobrescribirlo.","wn1_7":"Botón Actualizar perfil del juego: se queda gris y se enciende en cuanto cambias algo del sonido. Púlsalo para guardar el cambio para ese juego y esos auriculares.","wn1_8":"En Ajustes, dentro de Sonido y juegos, cada juego guardado muestra los auriculares guardados para él. Puedes aplicar o borrar el perfil de unos auriculares concretos.","wnG2":"Auriculares","wn2_1":"Porcentaje de batería real en los auriculares que lo informan, más un aviso de batería baja.","wn2_2":"Volumen desde los auriculares: siguiente/anterior en auriculares con estuche cambia el volumen, y el control lo sigue. Puedes desactivarlo en Ajustes.","wn2_3":"Cambio rápido entre auriculares guardados con un toque. Se pueden guardar hasta 8 auriculares.","wn2_4":"Mejor reconexión: los auriculares vuelven solos tras el modo de reposo o una pérdida de enlace.","wn2_5":"El sonido se detiene limpiamente cuando la consola entra en modo de reposo y vuelve al despertar.","wnG3":"Sonido","wn3_1":"Modo nocturno: explosiones más suaves, voces más claras.","wn3_2":"Control de latencia con una estimación en vivo del retardo hasta tus oídos.","wn3_3":"Conexión más estable: la calidad del sonido se recupera sola tras un corte breve.","wnG4":"Diseño","wn4_1":"Nueva pantalla principal, más grande y limpia, con cuatro secciones: Auriculares, Sonido, Conexión y Registro.","wn4_2":"Ajustes en un menú lateral a pantalla completa: Inicio, Auriculares, Sonido y juegos, Detalles, Copia y restauración.","wn4_3":"Nueva fuente más legible y un icono nuevo, también en el mosaico de la pantalla de inicio de la PS5.","wnG5":"Copia y restauración","wn5_1":"Guarda y restaura todos tus ajustes en USB, en el disco interno o como descarga del navegador."},"fr":{"intro":"HearBridge PS5 est un payload (ELF) qui envoie le son de la console par le Bluetooth intégré de la PS5 vers un casque ou une enceinte Bluetooth ordinaire. On le contrôle depuis une page web servie par la console. Il ne touche ni aux jeux, ni au firmware, ni au jailbreak.","limHp":"Testé avec Sony WF-1000XM6, OnePlus Buds Ace 2 et Xbox Wireless Headset.","req1":"Une PS5 jailbreakée avec un chargeur ELF à l'écoute sur le port **9021** (elfldr).","req2":"Un casque ou une enceinte Bluetooth compatible **A2DP** (SBC).","testedNote":"Testé sur PS5 CFI-10xx (Marvell/NXP) et PS5 Slim CFI-2008 (MediaTek). Les retours sur d'autres modèles sont les bienvenus.","log1":"Envoyez un payload de serveur FTP (par exemple [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) avec le même chargeur que pour HearBridge.","log2":"Connectez-vous avec FileZilla à l'IP de la console, sur le port affiché par le serveur (ftpsrv utilise généralement **2121**).","log3":"Téléchargez `/data/hearbridge/hearbridge.log` et `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` est aussi sur `http://<console-ip>:8090/api/diag`.","notesData":"Les réglages, les appareils enregistrés et le journal se trouvent dans `/data/hearbridge/` (`hearbridge.log` enregistre chaque étape).","r1":"le modèle de la console (numéro CFI, par ex. CFI-1016A)","r2":"la version du firmware","r3":"le chargeur utilisé","r4":"si la notification de démarrage est apparue","r5":"si la page s'ouvre, et ce qu'affiche **Puce** dans **Détails**","r6":"les fichiers journaux (`hearbridge.log`, `diag.txt`)","language":"Langue","navFeatures":"Fonctions","navCompat":"Compatibilité","navInstall":"Installation","navHelp":"Dépannage","btnDownload":"Télécharger la dernière version","btnDownloadShort":"Télécharger","btnGithub":"Voir sur GitHub","btnReport":"Signaler un problème","btnHowto":"Comment l'installer","h1a":"Un casque Bluetooth pour une PS5 jailbreakée","h1b":"Le son des jeux et du système, sans dongle.","heroCap":"La page de contrôle sur une TV.","limTitle":"Limites","lim1":"SBC uniquement (pas d'AAC, d'aptX ni de LDAC), un casque à la fois, pas de micro.","lim2":"La télévision continue aussi à émettre le son.","lim3":"N'exécutez qu'un seul payload utilisant le Bluetooth à la fois. La DualSense continue de fonctionner.","compatTitle":"Compatibilité","reqTitle":"Prérequis","installTitle":"Installation et lancement","s1T":"Téléchargez l'ELF","s1D":"Télécharge **HearBridge-PS5-1.3.0.elf** depuis la [dernière version](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envoyez-le au chargeur sur le port 9021","s2D":"Envoyez le fichier au chargeur de la console, par exemple :","s3T":"Ouvrez la page de contrôle","s3D":"Ouvrez cette adresse dans le navigateur de la PS5, sur un téléphone ou sur un PC, ou ouvrez la vignette **HearBridge** ajoutée à l'écran d'accueil au premier lancement :","s4T":"Appairez le casque","s5T":"Mettre à jour ou arrêter","s5D":"Fermer la page laisse HearBridge tourner. Renvoyer l'ELF remplace la copie en cours. **Arrêter HearBridge** le termine.","copy":"Copier","copied":"Copié","shotsTitle":"Captures d'écran","shotPhone":"Sur un téléphone","helpTitle":"Dépannage","q1":"Pas d'icône HearBridge sur l'écran d'accueil","a1":"L'icône est ajoutée à chaque lancement, relancez donc l'ELF. La page marche aussi sans elle sur `http://<console-ip>:8090`.","q2":"La page ne s'ouvre pas","a2":"Utilise l'adresse IP de la console et le port 8090, depuis un appareil sur le même réseau.","q3":"Le casque n'est pas trouvé lors de la recherche","a3":"Maintiens le bouton d'appairage jusqu'à ce que le voyant clignote vite, puis appuie de nouveau sur **Rechercher des appareils**.","q4":"Pas de son alors que le casque est connecté","a4":"Vérifie que **Couper le son** est désactivé et essaie **Son de test** dans **Son et jeux**. S'il n'y a toujours rien, récupère le log et ouvre une issue.","q5":"Rien ne se passe quand j'envoie l'ELF","a5":"Tu dois voir la notification **\"HearBridge 1.3.0: starting\"**. Sinon, le chargeur ne l'a pas lancé.","logTitle":"Récupérer le journal","reportTitle":"Signaler un problème","reportIntro":"Ouvrez un ticket GitHub en indiquant :","footRel":"Versions","footIss":"Tickets","footLic":"Licence","footSrc":"Code source","chipNote":"Un seul fichier fonctionne avec les deux puces Bluetooth. HearBridge détecte la puce tout seul et l'affiche dans **Détails**.","s4D":"Ouvre **Réglages**, puis **Casques**. Mets le casque en mode appairage, appuie sur **Rechercher des appareils** (environ 12 s), puis **Connecter**.","shotSet":"Réglages: Son et jeux","wnTitle":"Nouveautés de la 1.3.0","wnG1":"Profils de jeu (nouveau)","wn1_1":"HearBridge détecte tout seul le jeu en cours et affiche son nom et sa jaquette.","wn1_2":"Chaque jeu peut avoir son propre son : EQ, préréglage, amplification, volume et mode nuit.","wn1_3":"Le profil du jeu se charge tout seul au lancement du jeu, et ton son habituel revient à sa fermeture.","wn1_4":"Chaque casque garde son propre profil pour le même jeu. Par exemple, le même jeu peut avoir beaucoup de basses sur un casque et un son équilibré sur un autre, et chacun charge le sien à la connexion.","wn1_5":"Enregistre jusqu'à 32 jeux, avec jusqu'à 4 casques par jeu.","wn1_6":"Si le casque connecté n'a pas encore de profil pour le jeu, le profil le plus récent du jeu venant d'un autre casque est utilisé, sans l'écraser.","wn1_7":"Bouton Mettre à jour le profil du jeu : il reste gris et s'allume dès que tu changes quoi que ce soit au son. Appuie dessus pour enregistrer le changement pour ce jeu et ce casque.","wn1_8":"Dans Réglages, sous Son et jeux, chaque jeu enregistré affiche les casques enregistrés pour lui. Tu peux appliquer ou supprimer le profil d'un casque précis.","wnG2":"Casques","wn2_1":"Pourcentage de batterie réel sur les casques qui l'indiquent, plus une alerte de batterie faible.","wn2_2":"Volume depuis les écouteurs : suivant/précédent sur les écouteurs avec boîtier change le volume, et le curseur suit. Tu peux désactiver ça dans Réglages.","wn2_3":"Passage rapide d'un casque enregistré à l'autre en un geste. Jusqu'à 8 casques peuvent être enregistrés.","wn2_4":"Meilleure reconnexion : les casques reviennent tout seuls après le mode repos ou une perte de liaison.","wn2_5":"Le son s'arrête proprement quand la console passe en mode repos et revient à son réveil.","wnG3":"Son","wn3_1":"Mode nuit : explosions plus douces, voix plus claires.","wn3_2":"Curseur de latence avec une estimation en direct du délai jusqu'à tes oreilles.","wn3_3":"Connexion plus stable : la qualité du son se rétablit toute seule après une courte coupure.","wnG4":"Design","wn4_1":"Nouvel écran d'accueil, plus grand et plus clair, avec quatre sections : Casque, Son, Connexion et Journal.","wn4_2":"Réglages dans un menu latéral plein écran : Accueil, Casques, Son et jeux, Détails, Sauvegarde et restauration.","wn4_3":"Nouvelle police plus lisible et nouvelle icône, aussi sur la tuile de l'écran d'accueil de la PS5.","wnG5":"Sauvegarde et restauration","wn5_1":"Sauvegarde et restaure tous tes réglages sur USB, sur le stockage interne ou en téléchargement dans le navigateur."},"de":{"intro":"HearBridge PS5 ist ein Payload (ELF), der den Ton der Konsole über das eigene Bluetooth der PS5 an normale Bluetooth-Kopfhörer oder Lautsprecher überträgt. Gesteuert wird er über eine Webseite, die die Konsole bereitstellt. Spiele, Firmware und Jailbreak bleiben unberührt.","limHp":"Getestet mit Sony WF-1000XM6, OnePlus Buds Ace 2 und Xbox Wireless Headset.","req1":"Eine gejailbreakte PS5 mit einem ELF-Loader auf Port **9021** (elfldr).","req2":"Bluetooth-Kopfhörer oder ein Lautsprecher mit **A2DP** (SBC).","testedNote":"Getestet auf PS5 CFI-10xx (Marvell/NXP) und PS5 Slim CFI-2008 (MediaTek). Berichte von anderen Modellen sind willkommen.","log1":"Sende einen FTP-Server-Payload (zum Beispiel [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) mit demselben Loader, den du für HearBridge nutzt.","log2":"Verbinde dich mit FileZilla mit der IP der Konsole auf dem Port, den der Server anzeigt (ftpsrv nutzt meist **2121**).","log3":"Lade `/data/hearbridge/hearbridge.log` und `/data/hearbridge/diag.txt` herunter.","logDiag":"`diag.txt` gibt es auch unter `http://<console-ip>:8090/api/diag`.","notesData":"Einstellungen, gespeicherte Geräte und das Log liegen in `/data/hearbridge/` (`hearbridge.log` protokolliert jeden Schritt).","r1":"dem Konsolenmodell (CFI-Nummer, z. B. CFI-1016A)","r2":"der Firmware-Version","r3":"dem verwendeten Loader","r4":"ob die Start-Benachrichtigung erschienen ist","r5":"ob sich die Seite öffnet und was unter **Chip** in **Details** steht","r6":"den Log-Dateien (`hearbridge.log`, `diag.txt`)","language":"Sprache","navFeatures":"Funktionen","navCompat":"Kompatibilität","navInstall":"Installation","navHelp":"Fehlerbehebung","btnDownload":"Neueste Version herunterladen","btnDownloadShort":"Download","btnGithub":"Auf GitHub ansehen","btnReport":"Problem melden","btnHowto":"So installierst du es","h1a":"Bluetooth-Kopfhörer für eine gejailbreakte PS5","h1b":"Spiel- und Systemton, ohne Dongle.","heroCap":"Die Steuerseite auf einem Fernseher.","limTitle":"Einschränkungen","lim1":"Nur SBC (kein AAC, aptX oder LDAC), ein Kopfhörer zur Zeit, kein Mikrofon.","lim2":"Der Fernseher gibt den Ton weiterhin aus.","lim3":"Immer nur einen Payload mit Bluetooth gleichzeitig ausführen. Der DualSense funktioniert weiter.","compatTitle":"Kompatibilität","reqTitle":"Voraussetzungen","installTitle":"Installation und Start","s1T":"ELF herunterladen","s1D":"Lade **HearBridge-PS5-1.3.0.elf** aus dem [neuesten Release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest) herunter.","s2T":"An den Loader auf Port 9021 senden","s2D":"Sende die Datei an den Loader der Konsole, zum Beispiel:","s3T":"Steuerseite öffnen","s3D":"Öffne diese Adresse im PS5-Browser, auf dem Handy oder am PC, oder öffne die Kachel **HearBridge**, die beim ersten Start zum Startbildschirm hinzugefügt wird:","s4T":"Kopfhörer koppeln","s5T":"Aktualisieren oder beenden","s5D":"Das Schließen der Seite lässt HearBridge weiterlaufen. Erneutes Senden der ELF ersetzt die laufende Kopie. **HearBridge beenden** beendet es.","copy":"Kopieren","copied":"Kopiert","shotsTitle":"Screenshots","shotPhone":"Auf dem Handy","helpTitle":"Fehlerbehebung","q1":"Kein HearBridge-Symbol auf dem Startbildschirm","a1":"Das Symbol wird bei jedem Start neu angelegt, starte die ELF also noch einmal. Die Seite funktioniert auch ohne Symbol unter `http://<console-ip>:8090`.","q2":"Die Seite öffnet sich nicht","a2":"Nutze die IP-Adresse der Konsole und Port 8090, von einem Gerät im selben Netzwerk.","q3":"Kopfhörer werden beim Suchen nicht gefunden","a3":"Halte die Kopplungstaste gedrückt, bis das Licht schnell blinkt, und drücke dann erneut **Nach Geräten suchen**.","q4":"Kein Ton, obwohl die Kopfhörer verbunden sind","a4":"Prüfe, dass **Stumm** aus ist, und probiere **Testton** unter **Klang und Spiele**. Wenn immer noch nichts zu hören ist, hol dir das Log und eröffne ein Issue.","q5":"Beim Senden der ELF passiert nichts","a5":"Du solltest die Benachrichtigung **\"HearBridge 1.3.0: starting\"** sehen. Wenn nicht, hat der Loader sie nicht gestartet.","logTitle":"Log holen","reportTitle":"Problem melden","reportIntro":"Eröffne ein GitHub-Issue mit:","footRel":"Releases","footIss":"Issues","footLic":"Lizenz","footSrc":"Quellcode","chipNote":"Eine Datei funktioniert mit beiden Bluetooth-Chips. HearBridge erkennt den Chip selbst und zeigt ihn unter **Details**.","s4D":"Öffne **Einstellungen**, dann **Kopfhörer**. Versetze die Kopfhörer in den Kopplungsmodus, drücke **Nach Geräten suchen** (etwa 12 s) und dann **Verbinden**.","shotSet":"Einstellungen: Klang und Spiele","wnTitle":"Neu in 1.3.0","wnG1":"Spielprofile (neu)","wn1_1":"HearBridge erkennt das laufende Spiel von selbst und zeigt Namen und Cover.","wn1_2":"Jedes Spiel kann seinen eigenen Klang haben: EQ, Preset, Verstärkung, Lautstärke und Nachtmodus.","wn1_3":"Das Profil des Spiels lädt sich beim Spielstart von selbst, und beim Beenden kommt dein normaler Klang zurück.","wn1_4":"Jeder Kopfhörer behält sein eigenes Profil für dasselbe Spiel. Zum Beispiel kann dasselbe Spiel auf einem Kopfhörer viel Bass und auf einem anderen einen ausgewogenen Klang haben, und jeder lädt beim Verbinden sein eigenes.","wn1_5":"Bis zu 32 Spiele speichern, mit bis zu 4 Kopfhörern pro Spiel.","wn1_6":"Hat der verbundene Kopfhörer noch kein Profil für das Spiel, wird das neueste Profil des Spiels von einem anderen Kopfhörer verwendet, ohne es zu überschreiben.","wn1_7":"Taste Spielprofil aktualisieren: Sie bleibt grau und leuchtet auf, sobald du etwas am Klang änderst. Drück sie, um die Änderung für dieses Spiel und diesen Kopfhörer zu speichern.","wn1_8":"In Einstellungen unter Klang und Spiele zeigt jedes gespeicherte Spiel die dafür gespeicherten Kopfhörer. Du kannst das Profil eines bestimmten Kopfhörers anwenden oder löschen.","wnG2":"Kopfhörer","wn2_1":"Echter Akkustand in Prozent bei Kopfhörern, die ihn melden, plus Warnung bei schwachem Akku.","wn2_2":"Lautstärke über die Ohrhörer: Weiter/Zurück an Ohrhörern mit Etui ändert die Lautstärke, und der Regler folgt. Das lässt sich in Einstellungen abschalten.","wn2_3":"Mit einem Tipp zwischen gespeicherten Kopfhörern wechseln. Bis zu 8 Kopfhörer können gespeichert werden.","wn2_4":"Besseres Wiederverbinden: Kopfhörer kommen nach dem Ruhemodus oder einem Verbindungsabbruch von selbst zurück.","wn2_5":"Der Ton stoppt sauber, wenn die Konsole in den Ruhemodus geht, und kommt beim Aufwachen zurück.","wnG3":"Klang","wn3_1":"Nachtmodus: leisere Explosionen, klarere Stimmen.","wn3_2":"Latenzregler mit Live-Schätzung der Verzögerung bis zu deinen Ohren.","wn3_3":"Stabilere Verbindung: Die Klangqualität erholt sich nach einem kurzen Aussetzer von selbst.","wnG4":"Design","wn4_1":"Neuer Startbildschirm, größer und aufgeräumter, mit vier Bereichen: Kopfhörer, Klang, Verbindung und Protokoll.","wn4_2":"Einstellungen in einem Seitenmenü über den ganzen Bildschirm: Startseite, Kopfhörer, Klang und Spiele, Details, Sichern & wiederherstellen.","wn4_3":"Neue, besser lesbare Schrift und ein neues Icon, auch auf der Kachel im PS5-Startbildschirm.","wnG5":"Sichern und wiederherstellen","wn5_1":"Alle Einstellungen auf USB, dem internen Speicher oder als Browser-Download sichern und wiederherstellen."},"pt":{"intro":"O HearBridge PS5 é um payload (ELF) que envia o áudio do console pelo Bluetooth do próprio PS5 para fones ou caixas de som Bluetooth comuns. Você controla tudo por uma página web servida pelo console. Ele não mexe nos jogos, no firmware nem no jailbreak.","limHp":"Testado com Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Um PS5 desbloqueado com um carregador de ELF escutando na porta **9021** (elfldr).","req2":"Fones ou uma caixa de som Bluetooth com **A2DP** (SBC).","testedNote":"Testado no PS5 CFI-10xx (Marvell/NXP) e no PS5 Slim CFI-2008 (MediaTek). Relatos de outros modelos são bem-vindos.","log1":"Envie um payload de servidor FTP (por exemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) pelo mesmo carregador que você usa para o HearBridge.","log2":"Conecte-se com o FileZilla ao IP do console, na porta que o servidor mostra (o ftpsrv normalmente usa a **2121**).","log3":"Baixe `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` também está em `http://<console-ip>:8090/api/diag`.","notesData":"As configurações, os dispositivos salvos e o log ficam em `/data/hearbridge/` (`hearbridge.log` registra cada etapa).","r1":"o modelo do console (número CFI, ex.: CFI-1016A)","r2":"a versão do firmware","r3":"o carregador que você usou","r4":"se a notificação de início apareceu","r5":"se a página abre e o que **Chip** mostra em **Detalhes**","r6":"os arquivos de log (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Recursos","navCompat":"Compatibilidade","navInstall":"Instalação","navHelp":"Solução de problemas","btnDownload":"Baixar a versão mais recente","btnDownloadShort":"Baixar","btnGithub":"Ver no GitHub","btnReport":"Relatar um problema","btnHowto":"Como instalar","h1a":"Fones Bluetooth para um PS5 desbloqueado","h1b":"Áudio dos jogos e do sistema, sem adaptador.","heroCap":"A página de controle numa TV.","limTitle":"Limitações","lim1":"Só SBC (sem AAC, aptX ou LDAC), um fone por vez, sem microfone.","lim2":"A TV também continua tocando o som.","lim3":"Execute apenas um payload que use Bluetooth por vez. O DualSense continua funcionando.","compatTitle":"Compatibilidade","reqTitle":"Requisitos","installTitle":"Instalação e execução","s1T":"Baixe o ELF","s1D":"Baixe **HearBridge-PS5-1.3.0.elf** da [versão mais recente](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envie-o ao carregador na porta 9021","s2D":"Envie o arquivo ao carregador do console, por exemplo:","s3T":"Abra a página de controle","s3D":"Abra este endereço no navegador do PS5, no celular ou no PC, ou abra o bloco **HearBridge** adicionado à tela inicial na primeira execução:","s4T":"Pareie os fones","s5T":"Atualizar ou parar","s5D":"Fechar a página deixa o HearBridge rodando. Enviar o ELF de novo substitui a cópia em execução. **Parar o HearBridge** encerra.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas de tela","shotPhone":"No celular","helpTitle":"Solução de problemas","q1":"O ícone do HearBridge não aparece na tela inicial","a1":"O ícone é adicionado de novo a cada execução, então rode o ELF mais uma vez. A página também funciona sem ele em `http://<console-ip>:8090`.","q2":"A página não abre","a2":"Use o IP do console e a porta 8090, de um aparelho na mesma rede.","q3":"Os fones não são encontrados ao tocar em Procurar","a3":"Segure o botão de pareamento até a luz piscar rápido e toque em **Procurar dispositivos** de novo.","q4":"Não há som mesmo com os fones conectados","a4":"Confira se **Silenciar** está desligado e teste o **Tom de teste** em **Som e jogos**. Se ainda não houver som, pegue o log e abra uma issue.","q5":"Nada acontece quando envio o ELF","a5":"Deve aparecer a notificação **\"HearBridge 1.3.0: starting\"**. Se não, o carregador não o executou.","logTitle":"Como obter o log","reportTitle":"Relatar um problema","reportIntro":"Abra uma issue no GitHub e inclua:","footRel":"Versões","footIss":"Issues","footLic":"Licença","footSrc":"Código-fonte","chipNote":"Um só arquivo funciona com os dois chips Bluetooth. O HearBridge detecta o chip sozinho e mostra em **Detalhes**.","s4D":"Abra **Definições** e depois **Fones**. Coloque os fones em modo de pareamento, toque em **Procurar dispositivos** (cerca de 12 s) e depois em **Conectar**.","shotSet":"Definições: Som e jogos","wnTitle":"Novidades da 1.3.0","wnG1":"Perfis de jogo (novo)","wn1_1":"O HearBridge detecta sozinho o jogo aberto e mostra o nome e a capa.","wn1_2":"Cada jogo pode ter seu próprio som: EQ, predefinição, reforço, volume e modo noturno.","wn1_3":"O perfil do jogo carrega sozinho quando o jogo começa, e seu som de sempre volta quando ele fecha.","wn1_4":"Cada fone guarda seu próprio perfil para o mesmo jogo. Por exemplo, o mesmo jogo pode ter muito grave num fone e um som equilibrado em outro, e cada um carrega o seu ao conectar.","wn1_5":"Salve até 32 jogos, com até 4 fones por jogo.","wn1_6":"Se o fone conectado ainda não tem perfil para o jogo, é usado o perfil mais recente do jogo vindo de outro fone, sem sobrescrevê-lo.","wn1_7":"Botão Atualizar perfil do jogo: fica cinza e acende assim que você muda qualquer coisa no som. Toque nele para salvar a mudança para esse jogo e esse fone.","wn1_8":"Em Definições, dentro de Som e jogos, cada jogo salvo mostra os fones salvos para ele. Você pode aplicar ou apagar o perfil de um fone específico.","wnG2":"Fones","wn2_1":"Porcentagem real de bateria nos fones que informam, mais um aviso de bateria fraca.","wn2_2":"Volume pelos fones: próxima/anterior em fones com estojo muda o volume, e o controle acompanha. Dá para desligar isso em Definições.","wn2_3":"Troca rápida entre fones salvos com um toque. É possível salvar até 8 fones.","wn2_4":"Reconexão melhor: os fones voltam sozinhos depois do modo de repouso ou de uma queda de ligação.","wn2_5":"O som para de forma limpa quando o console entra em modo de repouso e volta quando ele acorda.","wnG3":"Som","wn3_1":"Modo noturno: explosões mais baixas, vozes mais claras.","wn3_2":"Controle de latência com estimativa ao vivo do atraso até os seus ouvidos.","wn3_3":"Conexão mais estável: a qualidade do som se recupera sozinha depois de uma queda curta.","wnG4":"Visual","wn4_1":"Nova tela inicial, maior e mais limpa, com quatro seções: Fone, Som, Conexão e Registo.","wn4_2":"Definições num menu lateral em tela cheia: Início, Fones, Som e jogos, Detalhes, Cópia e restauro.","wn4_3":"Nova fonte, mais legível, e um novo ícone, também no bloco da tela inicial do PS5.","wnG5":"Cópia e restauro","wn5_1":"Salve e restaure todas as suas definições num USB, no armazenamento interno ou como download do navegador."},"ru":{"intro":"HearBridge PS5 это payload (ELF), который передаёт звук консоли через собственный Bluetooth PS5 на обычные Bluetooth-наушники или колонки. Управление идёт через веб-страницу, которую отдаёт консоль. Игры, прошивку и джейлбрейк он не трогает.","limHp":"Проверено с Sony WF-1000XM6, OnePlus Buds Ace 2 и Xbox Wireless Headset.","req1":"Взломанная PS5 с загрузчиком ELF на порту **9021** (elfldr).","req2":"Bluetooth-наушники или колонка с поддержкой **A2DP** (SBC).","testedNote":"Проверено на PS5 CFI-10xx (Marvell/NXP) и PS5 Slim CFI-2008 (MediaTek). Отчёты о других моделях приветствуются.","log1":"Отправьте payload FTP-сервера (например, [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) тем же загрузчиком, что и HearBridge.","log2":"Подключитесь через FileZilla к IP консоли на порт, который показывает сервер (ftpsrv обычно использует **2121**).","log3":"Скачайте `/data/hearbridge/hearbridge.log` и `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` также доступен по адресу `http://<console-ip>:8090/api/diag`.","notesData":"Настройки, сохранённые устройства и журнал находятся в `/data/hearbridge/` (`hearbridge.log` записывает каждый шаг).","r1":"модель консоли (номер CFI, например CFI-1016A)","r2":"версию прошивки","r3":"какой загрузчик вы использовали","r4":"появилось ли уведомление о запуске","r5":"открывается ли страница и что показывает **Чип** в разделе **Подробности**","r6":"файлы журнала (`hearbridge.log`, `diag.txt`)","language":"Язык","navFeatures":"Возможности","navCompat":"Совместимость","navInstall":"Установка","navHelp":"Решение проблем","btnDownload":"Скачать последний релиз","btnDownloadShort":"Скачать","btnGithub":"Открыть на GitHub","btnReport":"Сообщить о проблеме","btnHowto":"Как установить","h1a":"Bluetooth-наушники для взломанной PS5","h1b":"Звук игр и системы без адаптера.","heroCap":"Страница управления на телевизоре.","limTitle":"Ограничения","lim1":"Только SBC (без AAC, aptX и LDAC), одни наушники за раз, без микрофона.","lim2":"Телевизор тоже продолжает воспроизводить звук.","lim3":"Запускайте одновременно только один payload, использующий Bluetooth. DualSense продолжает работать.","compatTitle":"Совместимость","reqTitle":"Требования","installTitle":"Установка и запуск","s1T":"Скачайте ELF","s1D":"Скачайте **HearBridge-PS5-1.3.0.elf** из [последнего релиза](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Отправьте его загрузчику на порт 9021","s2D":"Отправьте файл загрузчику консоли, например:","s3T":"Откройте страницу управления","s3D":"Откройте этот адрес в браузере PS5, на телефоне или ПК, или откройте плитку **HearBridge**, которая добавляется на главный экран при первом запуске:","s4T":"Выполните сопряжение наушников","s5T":"Обновить или остановить","s5D":"Если закрыть страницу, HearBridge продолжит работать. Повторная отправка ELF заменяет запущенную копию. **Остановить HearBridge** завершает его.","copy":"Копировать","copied":"Скопировано","shotsTitle":"Скриншоты","shotPhone":"На телефоне","helpTitle":"Решение проблем","q1":"Нет значка HearBridge на главном экране","a1":"Значок добавляется заново при каждом запуске, поэтому просто запустите ELF ещё раз. Страница работает и без него по адресу `http://<console-ip>:8090`.","q2":"Страница не открывается","a2":"Используйте IP-адрес консоли и порт 8090 с устройства в той же сети.","q3":"Наушники не находятся при поиске","a3":"Удерживайте кнопку сопряжения, пока индикатор не начнёт быстро мигать, и снова нажмите **Искать устройства**.","q4":"Нет звука, хотя наушники подключены","a4":"Проверьте, что **Без звука** выключен, и попробуйте **Тестовый тон** в разделе **Звук и игры**. Если звука всё ещё нет, скачайте лог и откройте issue.","q5":"При отправке ELF ничего не происходит","a5":"Должно появиться уведомление **\"HearBridge 1.3.0: starting\"**. Если нет, загрузчик его не запустил.","logTitle":"Как получить журнал","reportTitle":"Сообщить о проблеме","reportIntro":"Создайте issue на GitHub и укажите:","footRel":"Релизы","footIss":"Issues","footLic":"Лицензия","footSrc":"Исходный код","chipNote":"Один файл работает с обоими Bluetooth-чипами. HearBridge сам определяет чип и показывает его в разделе **Подробности**.","s4D":"Откройте **Настройки**, затем **Наушники**. Переведите наушники в режим сопряжения, нажмите **Искать устройства** (около 12 с), затем **Подключить**.","shotSet":"Настройки: Звук и игры","wnTitle":"Что нового в 1.3.0","wnG1":"Профили игр (новое)","wn1_1":"HearBridge сам определяет запущенную игру и показывает её название и обложку.","wn1_2":"У каждой игры может быть свой звук: эквалайзер, пресет, усиление, громкость и ночной режим.","wn1_3":"Профиль игры загружается сам при запуске игры, а когда она закрывается, возвращается ваш обычный звук.","wn1_4":"Для одной и той же игры у каждых наушников свой профиль. Например, в одной игре на одних наушниках может быть мощный бас, а на других сбалансированный звук, и каждые загружают свой при подключении.","wn1_5":"До 32 игр, до 4 наушников на игру.","wn1_6":"Если у подключённых наушников ещё нет профиля для игры, используется последний профиль этой игры с других наушников, без его перезаписи.","wn1_7":"Кнопка Обновить профиль игры: она серая и загорается, как только вы что-то меняете в звуке. Нажмите её, чтобы сохранить изменение для этой игры и этих наушников.","wn1_8":"В разделе Настройки, в пункте Звук и игры, у каждой сохранённой игры видны сохранённые для неё наушники. Можно применить или удалить профиль конкретных наушников.","wnG2":"Наушники","wn2_1":"Настоящий процент заряда у наушников, которые его сообщают, и предупреждение о низком заряде.","wn2_2":"Громкость с наушников: вперёд/назад на наушниках с кейсом меняют громкость, и ползунок следует за ней. Это можно отключить в разделе Настройки.","wn2_3":"Быстрое переключение между сохранёнными наушниками одним нажатием. Можно сохранить до 8 наушников.","wn2_4":"Лучше переподключение: наушники сами возвращаются после режима покоя или потери связи.","wn2_5":"Звук аккуратно останавливается, когда консоль уходит в режим покоя, и возвращается при пробуждении.","wnG3":"Звук","wn3_1":"Ночной режим: тише взрывы, чётче голоса.","wn3_2":"Ползунок задержки с живой оценкой задержки до ваших ушей.","wn3_3":"Стабильнее связь: качество звука само восстанавливается после короткого провала.","wnG4":"Дизайн","wn4_1":"Новый главный экран, крупнее и чище, с четырьмя разделами: Наушники, Звук, Подключение и Журнал.","wn4_2":"Настройки в полноэкранном боковом меню: Главная, Наушники, Звук и игры, Подробности, Резервная копия.","wn4_3":"Новый, более читаемый шрифт и новая иконка, в том числе на плитке главного экрана PS5.","wnG5":"Резервная копия и восстановление","wn5_1":"Сохраняйте и восстанавливайте все настройки на USB, на внутренний накопитель или как загрузку в браузере."},"ja":{"intro":"HearBridge PS5 は、本体の音を PS5 内蔵の Bluetooth で普通の Bluetooth ヘッドホンやスピーカーに送るペイロード（ELF）です。操作は本体が提供する Web ページから行います。ゲーム、ファームウェア、脱獄には手を加えません。","limHp":"Sony WF-1000XM6、OnePlus Buds Ace 2、Xbox Wireless Headset で動作確認済み。","req1":"ポート **9021** で待ち受ける ELF ローダー（elfldr）がある脱獄済み PS5。","req2":"**A2DP**（SBC）対応の Bluetooth ヘッドホンまたはスピーカー。","testedNote":"PS5 CFI-10xx（Marvell/NXP）と PS5 Slim CFI-2008（MediaTek）で動作確認済み。他のモデルの報告も歓迎します。","log1":"HearBridge と同じローダーで FTP サーバーのペイロード（例: [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）を送信します。","log2":"FileZilla で、サーバーが表示するポートを使って本体の IP に接続します（ftpsrv は通常 **2121**）。","log3":"`/data/hearbridge/hearbridge.log` と `/data/hearbridge/diag.txt` をダウンロードします。","logDiag":"`diag.txt` は `http://<console-ip>:8090/api/diag` でも見られます。","notesData":"設定、保存済みデバイス、ログは `/data/hearbridge/` にあります（`hearbridge.log` に各手順が記録されます）。","r1":"本体のモデル（CFI 番号、例: CFI-1016A）","r2":"ファームウェアのバージョン","r3":"使用したローダー","r4":"起動通知が出たかどうか","r5":"ページが開くか、**詳細** の **チップ** に何と表示されるか","r6":"ログファイル（`hearbridge.log`、`diag.txt`）","language":"言語","navFeatures":"機能","navCompat":"対応状況","navInstall":"インストール","navHelp":"トラブルシューティング","btnDownload":"最新リリースをダウンロード","btnDownloadShort":"ダウンロード","btnGithub":"GitHub で見る","btnReport":"問題を報告","btnHowto":"インストール方法","h1a":"脱獄済み PS5 で Bluetooth ヘッドホン","h1b":"ゲームとシステムの音声を、ドングルなしで。","heroCap":"テレビで見たコントロールページ。","limTitle":"制限事項","lim1":"SBC のみ（AAC、aptX、LDAC は非対応）、一度に一台、マイクなし。","lim2":"テレビからも音は出続けます。","lim3":"Bluetooth を使うペイロードは一度に一つだけ実行してください。DualSense はそのまま使えます。","compatTitle":"対応状況","reqTitle":"必要なもの","installTitle":"インストールと起動","s1T":"ELF をダウンロード","s1D":"[最新リリース](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest)から **HearBridge-PS5-1.3.0.elf** をダウンロードします。","s2T":"ポート 9021 のローダーに送信","s2D":"本体のローダーにファイルを送信します。例:","s3T":"操作ページを開く","s3D":"PS5 のブラウザ、スマートフォン、PC で次のアドレスを開きます。初回起動時にホーム画面に追加される **HearBridge** タイルからも開けます:","s4T":"ヘッドホンをペアリング","s5T":"更新・停止","s5D":"ページを閉じても HearBridge は動き続けます。ELF をもう一度送ると実行中のものと入れ替わります。**HearBridge を停止** で終了します。","copy":"コピー","copied":"コピーしました","shotsTitle":"スクリーンショット","shotPhone":"スマートフォン","helpTitle":"トラブルシューティング","q1":"ホーム画面に HearBridge のアイコンが出ない","a1":"アイコンは起動のたびに追加されるので、ELF をもう一度実行してください。アイコンがなくてもページは `http://<console-ip>:8090` で使えます。","q2":"ページが開かない","a2":"同じネットワーク上のデバイスから、本体の IP アドレスとポート 8090 を使ってください。","q3":"検索してもヘッドホンが見つからない","a3":"ライトが速く点滅するまでペアリングボタンを長押しし、もう一度 **デバイスを検索** を押してください。","q4":"ヘッドホンは接続されているのに音が出ない","a4":"**ミュート** がオフか確認し、**サウンドとゲーム** の **テストトーン** を試してください。それでも音が出なければ、ログを取得して issue を開いてください。","q5":"ELF を送っても何も起きない","a5":"**\"HearBridge 1.3.0: starting\"** という通知が出るはずです。出なければ、ローダーが実行していません。","logTitle":"ログの取得","reportTitle":"問題を報告","reportIntro":"GitHub の Issue を作成し、次の情報を含めてください:","footRel":"リリース","footIss":"Issue","footLic":"ライセンス","footSrc":"ソースコード","chipNote":"1 つのファイルで両方の Bluetooth チップに対応します。HearBridge がチップを自動で判別し、**詳細** に表示します。","s4D":"**設定** を開き、**ヘッドセット** を選びます。ヘッドホンをペアリングモードにして **デバイスを検索**（約 12 秒）を押し、**接続** を押します。","shotSet":"設定: サウンドとゲーム","wnTitle":"1.3.0 の新機能","wnG1":"ゲームプロファイル（新機能）","wn1_1":"HearBridge が起動中のゲームを自動で判別し、名前とカバーアートを表示します。","wn1_2":"ゲームごとに独自の音を設定できます：EQ、プリセット、ブースト、音量、ナイトモード。","wn1_3":"ゲームを始めるとそのゲームのプロファイルが自動で読み込まれ、終了するといつもの音に戻ります。","wn1_4":"同じゲームでもヘッドセットごとに別のプロファイルを持てます。たとえば同じゲームを、あるヘッドセットでは低音強め、別のヘッドセットではバランス型にでき、それぞれ接続時に自分のプロファイルを読み込みます。","wn1_5":"最大 32 ゲーム、1 ゲームあたり最大 4 台のヘッドセットを保存できます。","wn1_6":"接続中のヘッドセットにそのゲームのプロファイルがまだない場合は、別のヘッドセットで保存したそのゲームの最新プロファイルを使います。元のプロファイルは上書きしません。","wn1_7":"ゲームプロファイルを更新 ボタン：普段はグレーで、音を少しでも変えると点灯します。押すと、そのゲームとそのヘッドセットの変更を保存します。","wn1_8":"設定 の サウンドとゲーム では、保存した各ゲームにそのゲーム用に保存したヘッドセットが表示されます。特定のヘッドセットのプロファイルを適用したり削除したりできます。","wnG2":"ヘッドセット","wn2_1":"対応ヘッドセットではバッテリー残量を実際のパーセントで表示し、残量が少ないと通知します。","wn2_2":"イヤホンから音量操作：ケース付きイヤホンの次へ/前へで音量が変わり、スライダーも追従します。設定 でオフにできます。","wn2_3":"保存したヘッドセットをワンタップで切り替え。最大8台まで保存できます。","wn2_4":"再接続を改善：レストモードやリンク切断のあと、ヘッドセットが自動で戻ってきます。","wn2_5":"本体がレストモードに入るときは音をきれいに止め、復帰すると再開します。","wnG3":"サウンド","wn3_1":"ナイトモード：爆発音は控えめ、声ははっきり。","wn3_2":"耳に届くまでの遅延をライブで推定するレイテンシスライダー。","wn3_3":"より安定した接続：短い途切れのあと、音質が自動で回復します。","wnG4":"デザイン","wn4_1":"新しいホーム画面。大きくすっきりして、ヘッドセット、サウンド、接続、ログ の 4 つのセクション。","wn4_2":"設定 は全画面のサイドメニューに：ホーム、ヘッドセット、サウンドとゲーム、詳細、バックアップと復元。","wn4_3":"読みやすい新しいフォントと新しいアイコン。PS5 のホーム画面のタイルにも表示されます。","wnG5":"バックアップと復元","wn5_1":"すべての設定を USB、内蔵ストレージ、またはブラウザのダウンロードとして保存・復元できます。"},"zh":{"intro":"HearBridge PS5 是一个 payload（ELF），通过 PS5 自带的蓝牙把主机声音传到普通蓝牙耳机或音箱。你可以在主机提供的网页上控制它。它不会改动游戏、固件或越狱。","limHp":"已在 Sony WF-1000XM6、OnePlus Buds Ace 2 和 Xbox Wireless Headset 上测试。","req1":"已破解的 PS5，并有在端口 **9021** 监听的 ELF 加载器（elfldr）。","req2":"支持 **A2DP**（SBC）的蓝牙耳机或音箱。","testedNote":"已在 PS5 CFI-10xx（Marvell/NXP）和 PS5 Slim CFI-2008（MediaTek）上测试。欢迎反馈其他型号的情况。","log1":"用运行 HearBridge 的同一个加载器发送 FTP 服务器载荷（例如 [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）。","log2":"用 FileZilla 连接主机的 IP，端口使用服务器显示的端口（ftpsrv 通常为 **2121**）。","log3":"下载 `/data/hearbridge/hearbridge.log` 和 `/data/hearbridge/diag.txt`。","logDiag":"`diag.txt` 也可以在 `http://<console-ip>:8090/api/diag` 查看。","notesData":"设置、已保存的设备和日志位于 `/data/hearbridge/`（`hearbridge.log` 记录每一步）。","r1":"主机型号（CFI 编号，例如 CFI-1016A）","r2":"固件版本","r3":"使用的加载器","r4":"是否出现了启动通知","r5":"网页能否打开，以及 **详细信息** 中 **芯片** 显示什么","r6":"日志文件（`hearbridge.log`、`diag.txt`）","language":"语言","navFeatures":"功能","navCompat":"兼容性","navInstall":"安装","navHelp":"故障排除","btnDownload":"下载最新版本","btnDownloadShort":"下载","btnGithub":"在 GitHub 上查看","btnReport":"报告问题","btnHowto":"安装方法","h1a":"为破解的 PS5 连接蓝牙耳机","h1b":"游戏和系统声音，无需适配器。","heroCap":"电视上的控制页面。","limTitle":"限制","lim1":"仅支持 SBC（不支持 AAC、aptX 或 LDAC），一次一副耳机，没有麦克风。","lim2":"电视也会继续播放声音。","lim3":"同一时间只运行一个使用蓝牙的载荷。DualSense 照常工作。","compatTitle":"兼容性","reqTitle":"要求","installTitle":"安装与运行","s1T":"下载 ELF","s1D":"从[最新版本](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest)下载 **HearBridge-PS5-1.3.0.elf**。","s2T":"发送到端口 9021 的加载器","s2D":"将文件发送到主机的加载器，例如：","s3T":"打开控制网页","s3D":"在 PS5 浏览器、手机或电脑上打开以下地址，或打开首次运行时添加到主屏幕的 **HearBridge** 图块：","s4T":"配对耳机","s5T":"更新或停止","s5D":"关闭页面后 HearBridge 仍在运行。再次发送 ELF 会替换正在运行的副本。**停止 HearBridge** 可结束它。","copy":"复制","copied":"已复制","shotsTitle":"截图","shotPhone":"手机","helpTitle":"故障排除","q1":"主屏幕上没有 HearBridge 图标","a1":"每次运行都会重新添加图标，所以再运行一次 ELF 即可。没有图标时页面也可以在 `http://<console-ip>:8090` 打开。","q2":"网页打不开","a2":"在同一网络的设备上，使用主机的 IP 地址和端口 8090。","q3":"搜索时找不到耳机","a3":"按住配对键直到指示灯快速闪烁，然后再按一次 **搜索设备**。","q4":"耳机已连接但没有声音","a4":"确认 **静音** 已关闭，并在 **声音与游戏** 中试试 **测试音**。如果仍然没有声音，获取日志并提交 issue。","q5":"发送 ELF 后没有任何反应","a5":"应该会看到 **\"HearBridge 1.3.0: starting\"** 通知。如果没有，说明加载器没有运行它。","logTitle":"获取日志","reportTitle":"报告问题","reportIntro":"在 GitHub 上提交 issue，并附上：","footRel":"版本发布","footIss":"Issues","footLic":"许可证","footSrc":"源代码","chipNote":"同一个文件支持两种蓝牙芯片。HearBridge 会自动识别芯片，并显示在 **详细信息** 中。","s4D":"打开 **设置**，再进入 **耳机**。让耳机进入配对模式，按 **搜索设备**（约 12 秒），然后按 **连接**。","shotSet":"设置: 声音与游戏","wnTitle":"1.3.0 新功能","wnG1":"游戏配置（新）","wn1_1":"HearBridge 自动识别正在运行的游戏，并显示游戏名称和封面。","wn1_2":"每个游戏都可以有自己的声音：均衡器、预设、增益、音量和夜间模式。","wn1_3":"游戏启动时自动加载该游戏的配置，关闭后恢复你平时的声音。","wn1_4":"同一个游戏，每副耳机都保存自己的配置。例如，同一个游戏在一副耳机上可以是重低音，在另一副上是均衡的声音，连接时各自加载自己的配置。","wn1_5":"最多保存 32 个游戏，每个游戏最多 4 副耳机。","wn1_6":"如果当前连接的耳机还没有这个游戏的配置，就使用其他耳机为该游戏保存的最新配置，且不会覆盖它。","wn1_7":"更新游戏配置 按钮：平时是灰色，只要你改动声音的任何设置就会亮起。按下即可为这个游戏和这副耳机保存修改。","wn1_8":"在 设置 的 声音与游戏 中，每个已保存的游戏都会显示为它保存过的耳机。你可以应用或删除某一副耳机的配置。","wnG2":"耳机","wn2_1":"支持的耳机可显示真实电量百分比，并有低电量提醒。","wn2_2":"用耳机调音量：带充电盒的耳机按下一首/上一首即可调节音量，滑块同步变化。可在 设置 中关闭。","wn2_3":"一键在已保存的耳机之间快速切换。最多可保存 8 副耳机。","wn2_4":"重连更好：休息模式或连接中断后，耳机会自动回来。","wn2_5":"主机进入休息模式时声音干净地停止，唤醒后恢复。","wnG3":"声音","wn3_1":"夜间模式：爆炸声更小，人声更清楚。","wn3_2":"延迟滑块，实时估算声音到达耳朵的延迟。","wn3_3":"连接更稳定：短暂中断后音质会自动恢复。","wnG4":"设计","wn4_1":"全新主屏幕，更大更简洁，分为四个区域：耳机、声音、连接 和 日志。","wn4_2":"设置 改为全屏侧边菜单：主页、耳机、声音与游戏、详细信息、备份与恢复。","wn4_3":"更易读的新字体和新图标，PS5 主屏幕上的图块也会显示新图标。","wnG5":"备份与恢复","wn5_1":"把所有设置保存到 U 盘、内置存储或作为浏览器下载，并可随时恢复。"},"it":{"intro":"HearBridge PS5 è un payload (ELF) che invia l'audio della console tramite il Bluetooth della PS5 a normali cuffie o altoparlanti Bluetooth. Lo controlli da una pagina web servita dalla console. Non tocca i giochi, il firmware o il jailbreak.","limHp":"Testato con Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Una PS5 con jailbreak e un loader ELF in ascolto sulla porta **9021** (elfldr).","req2":"Cuffie o un altoparlante Bluetooth con **A2DP** (SBC).","testedNote":"Testato su PS5 CFI-10xx (Marvell/NXP) e PS5 Slim CFI-2008 (MediaTek). Le segnalazioni su altri modelli sono benvenute.","log1":"Invia un payload server FTP (ad esempio [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con lo stesso loader che usi per HearBridge.","log2":"Collegati con FileZilla all'IP della console sulla porta indicata dal server (ftpsrv di solito usa la **2121**).","log3":"Scarica `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` è anche su `http://<console-ip>:8090/api/diag`.","notesData":"Impostazioni, dispositivi salvati e log si trovano in `/data/hearbridge/` (`hearbridge.log` registra ogni passaggio).","r1":"il modello della console (numero CFI, ad es. CFI-1016A)","r2":"la versione del firmware","r3":"il loader usato","r4":"se è comparsa la notifica di avvio","r5":"se la pagina si apre e cosa mostra **Chip** in **Dettagli**","r6":"i file di log (`hearbridge.log`, `diag.txt`)","language":"Lingua","navFeatures":"Funzioni","navCompat":"Compatibilità","navInstall":"Installazione","navHelp":"Risoluzione dei problemi","btnDownload":"Scarica l'ultima release","btnDownloadShort":"Scarica","btnGithub":"Vedi su GitHub","btnReport":"Segnala un problema","btnHowto":"Come installarlo","h1a":"Cuffie Bluetooth per una PS5 con jailbreak","h1b":"Audio dei giochi e del sistema, senza dongle.","heroCap":"La pagina di controllo su una TV.","limTitle":"Limiti","lim1":"Solo SBC (niente AAC, aptX o LDAC), una cuffia alla volta, niente microfono.","lim2":"Anche la TV continua a riprodurre l'audio.","lim3":"Esegui un solo payload che usa il Bluetooth alla volta. Il DualSense continua a funzionare.","compatTitle":"Compatibilità","reqTitle":"Requisiti","installTitle":"Installazione e avvio","s1T":"Scarica l'ELF","s1D":"Scarica **HearBridge-PS5-1.3.0.elf** dall'[ultima release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Invialo al loader sulla porta 9021","s2D":"Invia il file al loader della console, ad esempio:","s3T":"Apri la pagina di controllo","s3D":"Apri questo indirizzo nel browser della PS5, su un telefono o su un PC, oppure apri il riquadro **HearBridge** aggiunto alla schermata iniziale al primo avvio:","s4T":"Abbina le cuffie","s5T":"Aggiornare o fermare","s5D":"Chiudere la pagina lascia HearBridge in esecuzione. Inviare di nuovo l'ELF sostituisce la copia in esecuzione. **Arresta HearBridge** lo chiude.","copy":"Copia","copied":"Copiato","shotsTitle":"Screenshot","shotPhone":"Su un telefono","helpTitle":"Risoluzione dei problemi","q1":"Nessuna icona di HearBridge nella schermata iniziale","a1":"L'icona viene aggiunta a ogni avvio, quindi avvia di nuovo l'ELF. La pagina funziona anche senza icona su `http://<console-ip>:8090`.","q2":"La pagina non si apre","a2":"Usa l'indirizzo IP della console e la porta 8090, da un dispositivo sulla stessa rete.","q3":"Le cuffie non vengono trovate quando premi Cerca","a3":"Tieni premuto il tasto di associazione finché la luce lampeggia veloce, poi premi di nuovo **Cerca dispositivi**.","q4":"Nessun suono anche se le cuffie sono connesse","a4":"Controlla che **Muto** sia disattivato e prova **Tono di prova** in **Suono e giochi**. Se ancora non si sente nulla, prendi il log e apri una issue.","q5":"Non succede niente quando invio l'ELF","a5":"Dovresti vedere la notifica **\"HearBridge 1.3.0: starting\"**. Se no, il loader non l'ha avviato.","logTitle":"Ottenere il log","reportTitle":"Segnala un problema","reportIntro":"Apri una issue su GitHub indicando:","footRel":"Release","footIss":"Issue","footLic":"Licenza","footSrc":"Codice sorgente","chipNote":"Un solo file funziona con entrambi i chip Bluetooth. HearBridge riconosce il chip da solo e lo mostra in **Dettagli**.","s4D":"Apri **Impostazioni**, poi **Cuffie**. Metti le cuffie in modalità di associazione, premi **Cerca dispositivi** (circa 12 s), poi **Connetti**.","shotSet":"Impostazioni: Suono e giochi","wnTitle":"Novità della 1.3.0","wnG1":"Profili di gioco (nuovo)","wn1_1":"HearBridge riconosce da solo il gioco in esecuzione e ne mostra nome e copertina.","wn1_2":"Ogni gioco può avere il suo suono: EQ, preset, amplificazione, volume e modalità notte.","wn1_3":"Il profilo del gioco si carica da solo quando il gioco parte, e il tuo suono di sempre torna quando si chiude.","wn1_4":"Ogni cuffia tiene il suo profilo per lo stesso gioco. Per esempio, lo stesso gioco può avere bassi potenti su una cuffia e un suono bilanciato su un'altra, e ognuna carica il suo quando si connette.","wn1_5":"Salva fino a 32 giochi, con fino a 4 cuffie per gioco.","wn1_6":"Se la cuffia connessa non ha ancora un profilo per il gioco, viene usato il profilo più recente del gioco da un'altra cuffia, senza sovrascriverlo.","wn1_7":"Pulsante Aggiorna profilo gioco: resta grigio e si accende appena cambi qualcosa nel suono. Premilo per salvare la modifica per quel gioco e quella cuffia.","wn1_8":"In Impostazioni, sotto Suono e giochi, ogni gioco salvato mostra le cuffie salvate per lui. Puoi applicare o eliminare il profilo di una cuffia specifica.","wnG2":"Cuffie","wn2_1":"Percentuale reale della batteria sulle cuffie che la comunicano, più un avviso di batteria scarica.","wn2_2":"Volume dagli auricolari: avanti/indietro sugli auricolari con custodia cambia il volume, e il cursore segue. Puoi disattivarlo in Impostazioni.","wn2_3":"Cambio rapido tra cuffie salvate con un tocco. Si possono salvare fino a 8 cuffie.","wn2_4":"Riconnessione migliore: le cuffie tornano da sole dopo la modalità riposo o una perdita di collegamento.","wn2_5":"Il suono si ferma in modo pulito quando la console va in modalità riposo e torna al risveglio.","wnG3":"Suono","wn3_1":"Modalità notte: esplosioni più morbide, voci più chiare.","wn3_2":"Cursore di latenza con una stima dal vivo del ritardo fino alle tue orecchie.","wn3_3":"Connessione più stabile: la qualità del suono si riprende da sola dopo una breve interruzione.","wnG4":"Design","wn4_1":"Nuova schermata principale, più grande e pulita, con quattro sezioni: Cuffie, Suono, Connessione e Registro.","wn4_2":"Impostazioni in un menu laterale a schermo intero: Home, Cuffie, Suono e giochi, Dettagli, Backup e ripristino.","wn4_3":"Nuovo font più leggibile e una nuova icona, anche sul riquadro della schermata Home della PS5.","wnG5":"Backup e ripristino","wn5_1":"Salva e ripristina tutte le impostazioni su USB, sulla memoria interna o come download del browser."}};

var LANG="en";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,function(m,x){return /http|HearBridge \d/.test(x)?'<b class="ltr">'+x+'</b>':'<b>'+x+'</b>'});
  s=s.replace(/\[([^\]]+)\]\(((?:https:|#)[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function t(k){var d=STR[LANG]||STR.en;return d[k]!=null?d[k]:STR.en[k]}
function find(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]==c)return LANGS[i];return null}
function applyLang(c){
  var L=find(c)||LANGS[0];LANG=L[0];
  var h=document.documentElement;h.lang=LANG;h.dir=L[3]?"rtl":"ltr";
  var els=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<els.length;i++)els[i].innerHTML=fmt(t(els[i].getAttribute("data-i18n")));
  document.title="HearBridge PS5: "+t("h1a");
  document.getElementById("langflag").innerHTML=FLAGS[L[2]];
  var o=document.querySelectorAll(".langopt");for(var j=0;j<o.length;j++)o[j].classList.toggle("on",o[j].getAttribute("data-lang")==LANG);
  fitHeader();
}
function initLang(){
  var list=document.getElementById("langlist"),btn=document.getElementById("langbtn"),h="";
  for(var i=0;i<LANGS.length;i++){var L=LANGS[i];
    h+='<button type="button" class="langopt" role="menuitem" data-lang="'+L[0]+'" lang="'+L[0]+'"'+(L[3]?' dir="rtl"':'')+'><span class="flag">'+FLAGS[L[2]]+'</span><span>'+L[1]+'</span></button>'}
  list.innerHTML=h;
  function setOpen(v){list.classList.toggle("show",v);btn.setAttribute("aria-expanded",v?"true":"false");if(v){var on=list.querySelector(".on");(on||list.firstChild).focus()}}
  btn.addEventListener("click",function(e){e.stopPropagation();setOpen(!list.classList.contains("show"))});
  list.addEventListener("click",function(e){var b=e.target.closest(".langopt");if(!b)return;e.stopPropagation();applyLang(b.getAttribute("data-lang"));setOpen(false);btn.focus()});
  document.addEventListener("click",function(){setOpen(false)});
  document.addEventListener("keydown",function(e){if(e.key=="Escape"&&list.classList.contains("show")){setOpen(false);btn.focus()}});
  /* Always open in English; only ?lang= or the switcher changes it. No browser-language detection, nothing restored. */
  var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  applyLang(q&&find(q)?q:"en");
}
function fitHeader(){var top=document.querySelector(".top"),row=top.querySelector(".in");top.classList.remove("compact");
  if(row.scrollWidth>row.clientWidth+1)top.classList.add("compact")}
window.addEventListener("resize",fitHeader);
function initCopy(){
  var b=document.querySelectorAll("[data-copy]");
  for(var i=0;i<b.length;i++)b[i].addEventListener("click",function(){
    var me=this,txt=document.getElementById(me.getAttribute("data-copy")).textContent;
    function done(){me.classList.add("done");me.textContent=t("copied");setTimeout(function(){me.classList.remove("done");me.textContent=t("copy")},1600)}
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,function(){});
    else{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
  });
}
initLang();initCopy();
</script>
