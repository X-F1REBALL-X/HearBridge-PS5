<style>

<script>
var STR={"en":{"intro":"HearBridge PS5 is a payload (ELF) for a jailbroken PS5. It captures the console's audio and streams it over the console's own Bluetooth radio to ordinary Bluetooth headphones or speakers (A2DP, SBC). You control it from a web page served by the console. It does not modify games, the firmware or the jailbreak.","limHp":"Tested with Sony WF-1000XM6, OnePlus Buds Ace 2 and Xbox Wireless Headset.","req1":"A jailbroken PS5 with an ELF loader listening on port **9021** (elfldr).","req2":"Bluetooth headphones or a speaker with **A2DP** (SBC).","testedNote":"**Tested on:** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Other models: reports are welcome.","log1":"Send an FTP server payload (for example [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) with the same loader you use for HearBridge.","log2":"Connect with FileZilla to the console's IP on the port the server shows (ftpsrv usually uses **2121**).","log3":"Download `/data/hearbridge/hearbridge.log` and `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` is also at `http://<console-ip>:8090/api/diag`.","u2":"**Auto-connect:** saved headphones connect on their own when you turn them on or take them out of the case. Taking out another saved pair switches to it. After a manual **Disconnect** they wait for **Connect**.","u3":"**Disconnect** drops the link and keeps the headphones saved. **Forget** disconnects them first, then removes them.","u4":"**Volume:** boost up to 500 % (starts at 250 %) and headset volume (AVRCP, starts at 50 %, follows the headphones' buttons too). Saved per headset once you change them.","u5":"**Equalizer:** 5 bands with presets, saved per headset. **Clean sound** turns it off and sets the boost back to 250 % and the buffer to 200 ms.","u6":"**Codec:** **Auto** is plain SBC. **SBC HQ** and **SBC-XQ** can be picked by hand when the headphones support them; the rest are greyed out.","notesData":"Settings, saved devices and the log are in `/data/hearbridge/` (`hearbridge.log` records every step).","r1":"the console model (CFI number, e.g. CFI-1016A)","r2":"the firmware version","r3":"the loader you used","r4":"whether the **\"HearBridge 1.2.0: starting\"** notification appeared","r5":"whether the page opens, and what **Chip** shows in **Status**","r6":"the log files (`hearbridge.log`, `diag.txt`)","language":"Language","navFeatures":"Features","navCompat":"Compatibility","navInstall":"Install","navHelp":"Troubleshooting","btnDownload":"Download latest release","btnDownloadShort":"Download","btnGithub":"View on GitHub","btnReport":"Report a problem","btnHowto":"How to install","beta":"Beta","h1a":"Bluetooth headphones for a jailbroken PS5","h1b":"Game and system audio, no dongle.","heroCap":"The control page served by the console (version 1.2.0).","featTitle":"Features","limTitle":"Limits","lim1":"SBC only (no AAC, aptX or LDAC), one headset at a time, no microphone.","lim2":"The TV keeps playing sound too.","lim3":"Run only one payload that uses Bluetooth at a time. The DualSense keeps working.","compatTitle":"Compatibility","reqTitle":"Requirements","installTitle":"Install and run","s1T":"Download the ELF","s1D":"Download `HearBridge-PS5-1.2.0.elf` from the latest release.","s2T":"Send it to the loader on port 9021","s2D":"Send the file to the console's loader, for example:","s3T":"Open the control page","s3D":"Open this address in the PS5 browser, on a phone or on a PC, or open the **HearBridge** tile that is added to the home screen on first run:","s4T":"Pair the headphones","s5T":"Update or stop","s5D":"Closing the page leaves HearBridge running. Sending the ELF again replaces the running copy. **Stop HearBridge** ends it.","copy":"Copy","copied":"Copied","shotsTitle":"Screenshots","shotEn":"On a TV, 1920×1080","shotPhone":"On a phone","helpTitle":"Troubleshooting","q1":"No HearBridge icon on the home screen","a1":"The icon is added again on every run, so run the ELF once more. The page also works without it at `http://<console-ip>:8090`.","q2":"The page does not open","a2":"Use the console's IP address and port 8090, from a device on the same network. When HearBridge starts, the console shows the notification **\"HearBridge 1.2.0: http://…\"** with the address.","q3":"Headphones are not found when you press Scan","a3":"Put the headphones in pairing mode first, then press **Scan for devices**. If the page asks for pairing mode, hold the pair button until the light flashes fast and try again.","q4":"No sound although the headphones are connected","a4":"Check that **Mute** is off and try **Test tone**. If there is still no sound, get the log and open an issue.","q5":"Nothing happens when I send the ELF","a5":"You should see **\"HearBridge 1.2.0: starting\"**. If not, the loader did not run it.","logTitle":"Get the log","reportTitle":"Report a problem","reportIntro":"Open a GitHub issue and include:","footRel":"Releases","footIss":"Issues","footLic":"License","footSrc":"Source code","u7":"**Latency:** buffer target from 60 to 200 ms (default 200 ms). Lower means less delay but can cut out.","u8":"**Status** shows the codec and your Bluetooth chip. The **Log** shows every step: green worked, red failed, blue for your presses.","chipNote":"**One file for every PS5:** HearBridge finds the Bluetooth chip by itself, Marvell/NXP (`1286`) or MediaTek (`0e8d`), and shows it under **Chip** in **Status**. More in [which chip do I have?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Put the headphones in pairing mode, press **Scan for devices** (about 20 s), then **Connect**. They are saved and audio starts."},"ar":{"intro":"HearBridge PS5 حمولة (ELF) لجهاز PS5 مكسور الحماية. تلتقط صوت الجهاز وتبثه عبر شريحة البلوتوث الخاصة بالجهاز نفسه إلى سماعات أو مكبر صوت بلوتوث عادي (A2DP، SBC). يتم التحكم فيها من صفحة ويب يقدمها الجهاز. لا تعدّل الألعاب ولا البرنامج الثابت ولا كسر الحماية.","limHp":"تم الاختبار مع Sony WF-1000XM6 وOnePlus Buds Ace 2 وXbox Wireless Headset.","req1":"جهاز PS5 مكسور الحماية مع محمّل ELF يستمع على المنفذ **9021** (elfldr).","req2":"سماعات أو مكبر صوت بلوتوث يدعم **A2DP** (SBC).","testedNote":"**تمت التجربة على:** PS5 fat ‏CFI-10xx ‏(Marvell/NXP)، PS5 Slim ‏CFI-2008 ‏(MediaTek). الطرازات الأخرى: نرحّب بالتقارير.","log1":"أرسل حمولة خادم FTP (مثل [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) عبر المحمّل نفسه الذي تستخدمه لـ HearBridge.","log2":"اتصل باستخدام FileZilla بعنوان IP الخاص بالجهاز على المنفذ الذي يعرضه الخادم (يستخدم ftpsrv عادةً المنفذ **2121**).","log3":"نزّل `/data/hearbridge/hearbridge.log` و`/data/hearbridge/diag.txt`.","logDiag":"يتوفر `diag.txt` أيضًا على `http://<console-ip>:8090/api/diag`.","u2":"**الاتصال التلقائي:** السماعات المحفوظة تتصل وحدها عند تشغيلها أو إخراجها من العلبة. إخراج زوج محفوظ آخر ينقل الصوت إليه. بعد **قطع الاتصال** يدويًا تنتظر **اتصال**.","u3":"**قطع الاتصال** يقطع الاتصال ويُبقي السماعات محفوظة. **نسيان** يقطع الاتصال أولًا ثم يحذفها.","u4":"**الصوت:** تعزيز حتى 500% (يبدأ من 250%) وصوت السماعة (AVRCP، يبدأ من 50%، ويتبع أزرار السماعات أيضًا). يُحفظان لكل سماعة بعد تغييرهما.","u5":"**المعادل:** 5 نطاقات مع إعدادات جاهزة، محفوظ لكل سماعة. **صوت نظيف** يطفئه ويعيد التعزيز إلى 250% والمخزن المؤقت إلى 200 ms.","u6":"**الترميز:** **تلقائي** هو SBC العادي. يمكن اختيار **SBC HQ** و**SBC-XQ** يدويًا عندما تدعمها السماعات؛ والباقي يظهر رماديًا.","notesData":"الإعدادات والأجهزة المحفوظة والسجل موجودة في `/data/hearbridge/` (يسجّل `hearbridge.log` كل خطوة).","r1":"طراز الجهاز (رقم CFI، مثل CFI-1016A)","r2":"إصدار النظام","r3":"المحمّل الذي استخدمته","r4":"هل ظهر الإشعار **\"HearBridge 1.2.0: starting\"**","r5":"هل تفتح الصفحة، وماذا تعرض **الشريحة** في **الحالة**","r6":"ملفات السجل (`hearbridge.log` و`diag.txt`)","language":"اللغة","navFeatures":"الميزات","navCompat":"التوافق","navInstall":"التثبيت","navHelp":"حل المشكلات","btnDownload":"تنزيل أحدث إصدار","btnDownloadShort":"تنزيل","btnGithub":"عرض على GitHub","btnReport":"الإبلاغ عن مشكلة","btnHowto":"طريقة التثبيت","beta":"بيتا","h1a":"سماعات بلوتوث لجهاز PS5 مكسور الحماية","h1b":"صوت الألعاب والنظام، بدون دونجل.","heroCap":"صفحة التحكم التي يقدّمها الجهاز (الإصدار 1.2.0).","featTitle":"الميزات","limTitle":"القيود","lim1":"SBC فقط (بلا AAC أو aptX أو LDAC)، سماعة واحدة في كل مرة، بلا ميكروفون.","lim2":"يستمر التلفاز أيضًا في تشغيل الصوت.","lim3":"شغّل حمولة واحدة فقط تستخدم البلوتوث في كل مرة. ويستمر DualSense في العمل.","compatTitle":"التوافق","reqTitle":"المتطلبات","installTitle":"التثبيت والتشغيل","s1T":"نزّل ملف ELF","s1D":"نزّل `HearBridge-PS5-1.2.0.elf` من أحدث إصدار.","s2T":"أرسله إلى المحمّل على المنفذ 9021","s2D":"أرسل الملف إلى محمّل الجهاز، مثلًا:","s3T":"افتح صفحة التحكم","s3D":"افتح هذا العنوان في متصفح PS5 أو على هاتف أو حاسوب، أو افتح مربع **HearBridge** الذي يُضاف إلى الشاشة الرئيسية عند التشغيل الأول:","s4T":"أقرن السماعات","s5T":"التحديث أو الإيقاف","s5D":"إغلاق الصفحة يُبقي HearBridge يعمل. إرسال ملف ELF مرة أخرى يستبدل النسخة العاملة. **إيقاف HearBridge** يُنهيه.","copy":"نسخ","copied":"تم النسخ","shotsTitle":"لقطات الشاشة","shotEn":"على التلفاز، 1920×1080","shotPhone":"على الهاتف","helpTitle":"حل المشكلات","q1":"لا تظهر أيقونة HearBridge في الشاشة الرئيسية","a1":"تُضاف الأيقونة من جديد في كل تشغيل، لذا شغّل ملف ELF مرة أخرى. الصفحة تعمل أيضًا بدونها على `http://<console-ip>:8090`.","q2":"الصفحة لا تفتح","a2":"استخدم عنوان IP الخاص بالجهاز والمنفذ 8090 من جهاز على الشبكة نفسها. عند بدء HearBridge يعرض الجهاز الإشعار **\"HearBridge 1.2.0: http://…\"** مع العنوان.","q3":"لا يتم العثور على السماعات عند الضغط على البحث","a3":"ضع السماعات في وضع الإقران أولًا، ثم اضغط **البحث عن أجهزة**. إذا طلبت الصفحة وضع الإقران، اضغط زر الإقران مطولًا حتى يومض الضوء بسرعة ثم حاول مجددًا.","q4":"لا يوجد صوت مع أن السماعات متصلة","a4":"تأكد من أن **كتم** غير مفعّل وجرّب **نغمة اختبار**. إذا بقي الصوت غائبًا، احصل على السجل وافتح بلاغًا.","q5":"لا يحدث شيء عند إرسال ملف ELF","a5":"يجب أن يظهر الإشعار **\"HearBridge 1.2.0: starting\"**. إذا لم يظهر، فالمحمِّل لم يشغّله.","logTitle":"الحصول على السجل","reportTitle":"الإبلاغ عن مشكلة","reportIntro":"افتح بلاغًا (issue) على GitHub وأرفق:","footRel":"الإصدارات","footIss":"البلاغات","footLic":"الترخيص","footSrc":"الشيفرة المصدرية","u7":"**التأخير:** هدف المخزن المؤقت من 60 إلى 200 ms (الافتراضي 200 ms). الأقل يعني تأخيرًا أقل لكن قد يتقطع الصوت.","u8":"**الحالة** تعرض الترميز وشريحة البلوتوث. **السجل** يعرض كل خطوة: الأخضر نجح، الأحمر فشل، والأزرق لضغطاتك.","chipNote":"**ملف واحد لكل أجهزة PS5:** يتعرّف HearBridge على شريحة البلوتوث بنفسه، Marvell/NXP ‏(`1286`) أو MediaTek ‏(`0e8d`)، ويعرضها في **الشريحة** ضمن **الحالة**. المزيد في [أي شريحة عندي؟](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"ضع السماعات في وضع الإقران، واضغط **البحث عن أجهزة** (نحو 20 ثانية)، ثم **اتصال**. تُحفظ ويبدأ الصوت."},"es":{"intro":"HearBridge PS5 es un payload (ELF) para una PS5 con jailbreak. Captura el audio de la consola y lo transmite por la propia radio Bluetooth de la consola a auriculares o altavoces Bluetooth normales (A2DP, SBC). Se controla desde una página web que sirve la consola. No modifica los juegos, el firmware ni el jailbreak.","limHp":"Probado con Sony WF-1000XM6, OnePlus Buds Ace 2 y Xbox Wireless Headset.","req1":"Una PS5 con jailbreak y un cargador de ELF escuchando en el puerto **9021** (elfldr).","req2":"Auriculares o un altavoz Bluetooth con **A2DP** (SBC).","testedNote":"**Probado en:** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Otros modelos: los informes son bienvenidos.","log1":"Envía un payload de servidor FTP (por ejemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con el mismo cargador que usas para HearBridge.","log2":"Conéctate con FileZilla a la IP de la consola en el puerto que muestra el servidor (ftpsrv suele usar el **2121**).","log3":"Descarga `/data/hearbridge/hearbridge.log` y `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` también está en `http://<console-ip>:8090/api/diag`.","u2":"**Conexión automática:** los auriculares guardados se conectan solos al encenderlos o sacarlos del estuche. Sacar otro par guardado cambia a ese. Tras **Desconectar** a mano esperan a **Conectar**.","u3":"**Desconectar** corta la conexión y deja los auriculares guardados. **Olvidar** primero los desconecta y luego los borra.","u4":"**Volumen:** refuerzo hasta 500 % (empieza en 250 %) y volumen del auricular (AVRCP, empieza en 50 %, también sigue sus botones). Se guardan por auricular cuando los cambias.","u5":"**Ecualizador:** 5 bandas con presets, guardado por auricular. **Sonido limpio** lo apaga y vuelve el refuerzo a 250 % y el búfer a 200 ms.","u6":"**Códec:** **Auto** es SBC normal. **SBC HQ** y **SBC-XQ** se eligen a mano si los auriculares los admiten; el resto aparece en gris.","notesData":"Los ajustes, los dispositivos guardados y el registro están en `/data/hearbridge/` (`hearbridge.log` registra cada paso).","r1":"el modelo de la consola (número CFI, p. ej. CFI-1016A)","r2":"la versión del firmware","r3":"el cargador que usaste","r4":"si apareció la notificación **\"HearBridge 1.2.0: starting\"**","r5":"si la página abre, y qué muestra **Chip** en **Estado**","r6":"los archivos de registro (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Funciones","navCompat":"Compatibilidad","navInstall":"Instalación","navHelp":"Solución de problemas","btnDownload":"Descargar la última versión","btnDownloadShort":"Descargar","btnGithub":"Ver en GitHub","btnReport":"Informar de un problema","btnHowto":"Cómo instalarlo","beta":"Beta","h1a":"Auriculares Bluetooth para una PS5 con jailbreak","h1b":"Audio de juegos y del sistema, sin adaptador.","heroCap":"La página de control que sirve la consola (versión 1.2.0).","featTitle":"Funciones","limTitle":"Limitaciones","lim1":"Solo SBC (sin AAC, aptX ni LDAC), un auricular a la vez, sin micrófono.","lim2":"El televisor también sigue sonando.","lim3":"Ejecuta solo un payload que use Bluetooth a la vez. El DualSense sigue funcionando.","compatTitle":"Compatibilidad","reqTitle":"Requisitos","installTitle":"Instalación y ejecución","s1T":"Descarga el ELF","s1D":"Descarga `HearBridge-PS5-1.2.0.elf` de la última versión.","s2T":"Envíalo al cargador en el puerto 9021","s2D":"Envía el archivo al cargador de la consola, por ejemplo:","s3T":"Abre la página de control","s3D":"Abre esta dirección en el navegador de la PS5, en un móvil o en un PC, o abre el icono **HearBridge** que se añade a la pantalla de inicio la primera vez:","s4T":"Empareja los auriculares","s5T":"Actualizar o detener","s5D":"Cerrar la página deja HearBridge funcionando. Enviar el ELF de nuevo reemplaza la copia en marcha. **Detener HearBridge** lo termina.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas","shotEn":"En un televisor, 1920×1080","shotPhone":"En un móvil","helpTitle":"Solución de problemas","q1":"No aparece el icono de HearBridge en la pantalla de inicio","a1":"El icono se vuelve a añadir en cada ejecución, así que ejecuta el ELF otra vez. La página también funciona sin él en `http://<console-ip>:8090`.","q2":"La página no se abre","a2":"Usa la IP de la consola y el puerto 8090 desde un dispositivo en la misma red. Al iniciarse HearBridge, la consola muestra la notificación **\"HearBridge 1.2.0: http://…\"** con la dirección.","q3":"No se encuentran los auriculares al pulsar Buscar","a3":"Pon primero los auriculares en modo de emparejamiento y luego pulsa **Buscar dispositivos**. Si la página pide el modo de emparejamiento, mantén pulsado el botón de emparejar hasta que la luz parpadee rápido e inténtalo de nuevo.","q4":"No hay sonido aunque los auriculares están conectados","a4":"Comprueba que **Silenciar** está desactivado y prueba **Tono de prueba**. Si sigue sin sonar, obtén el registro y abre una incidencia.","q5":"No pasa nada al enviar el ELF","a5":"Deberías ver **\"HearBridge 1.2.0: starting\"**. Si no aparece, el cargador no lo ejecutó.","logTitle":"Obtener el registro","reportTitle":"Informar de un problema","reportIntro":"Abre una incidencia en GitHub e incluye:","footRel":"Versiones","footIss":"Incidencias","footLic":"Licencia","footSrc":"Código fuente","u7":"**Latencia:** objetivo de búfer de 60 a 200 ms (200 ms por defecto). Menos es menos retardo, pero puede cortarse.","u8":"**Estado** muestra el códec y tu chip Bluetooth. El **Registro** muestra cada paso: verde salió bien, rojo falló, azul para lo que pulsas.","chipNote":"**Un archivo para todas las PS5:** HearBridge detecta el chip Bluetooth solo, Marvell/NXP (`1286`) o MediaTek (`0e8d`), y lo muestra en **Chip** dentro de **Estado**. Más en [¿qué chip tengo?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Pon los auriculares en modo de emparejamiento, pulsa **Buscar dispositivos** (unos 20 s) y luego **Conectar**. Se guardan y empieza el audio."},"fr":{"intro":"HearBridge PS5 est un payload (ELF) pour une PS5 jailbreakée. Il capture le son de la console et le diffuse via la radio Bluetooth de la console elle-même vers un casque ou une enceinte Bluetooth ordinaire (A2DP, SBC). On le pilote depuis une page web servie par la console. Il ne modifie ni les jeux, ni le firmware, ni le jailbreak.","limHp":"Testé avec Sony WF-1000XM6, OnePlus Buds Ace 2 et Xbox Wireless Headset.","req1":"Une PS5 jailbreakée avec un chargeur ELF à l'écoute sur le port **9021** (elfldr).","req2":"Un casque ou une enceinte Bluetooth compatible **A2DP** (SBC).","testedNote":"**Testé sur :** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Autres modèles : les retours sont les bienvenus.","log1":"Envoyez un payload de serveur FTP (par exemple [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) avec le même chargeur que pour HearBridge.","log2":"Connectez-vous avec FileZilla à l'IP de la console, sur le port affiché par le serveur (ftpsrv utilise généralement **2121**).","log3":"Téléchargez `/data/hearbridge/hearbridge.log` et `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` est aussi sur `http://<console-ip>:8090/api/diag`.","u2":"**Connexion automatique :** les casques enregistrés se connectent seuls quand vous les allumez ou les sortez de l'étui. Sortir une autre paire enregistrée bascule vers elle. Après un **Déconnecter** manuel, ils attendent **Connecter**.","u3":"**Déconnecter** coupe la liaison et garde le casque enregistré. **Oublier** le déconnecte d'abord, puis le supprime.","u4":"**Volume :** amplification jusqu'à 500 % (démarre à 250 %) et volume du casque (AVRCP, démarre à 50 %, suit aussi ses boutons). Enregistrés par casque une fois modifiés.","u5":"**Égaliseur :** 5 bandes avec préréglages, enregistré par casque. **Son net** le coupe et remet l'amplification à 250 % et le tampon à 200 ms.","u6":"**Codec :** **Auto** est le SBC simple. **SBC HQ** et **SBC-XQ** se choisissent à la main si le casque les prend en charge ; les autres sont grisés.","notesData":"Les réglages, les appareils enregistrés et le journal se trouvent dans `/data/hearbridge/` (`hearbridge.log` enregistre chaque étape).","r1":"le modèle de la console (numéro CFI, par ex. CFI-1016A)","r2":"la version du firmware","r3":"le chargeur utilisé","r4":"si la notification **« HearBridge 1.2.0: starting »** est apparue","r5":"si la page s'ouvre, et ce qu'affiche **Puce** dans **État**","r6":"les fichiers journaux (`hearbridge.log`, `diag.txt`)","language":"Langue","navFeatures":"Fonctions","navCompat":"Compatibilité","navInstall":"Installation","navHelp":"Dépannage","btnDownload":"Télécharger la dernière version","btnDownloadShort":"Télécharger","btnGithub":"Voir sur GitHub","btnReport":"Signaler un problème","btnHowto":"Comment l'installer","beta":"Bêta","h1a":"Un casque Bluetooth pour une PS5 jailbreakée","h1b":"Le son des jeux et du système, sans dongle.","heroCap":"La page de contrôle servie par la console (version 1.2.0).","featTitle":"Fonctions","limTitle":"Limites","lim1":"SBC uniquement (pas d'AAC, d'aptX ni de LDAC), un casque à la fois, pas de micro.","lim2":"La télévision continue aussi à émettre le son.","lim3":"N'exécutez qu'un seul payload utilisant le Bluetooth à la fois. La DualSense continue de fonctionner.","compatTitle":"Compatibilité","reqTitle":"Prérequis","installTitle":"Installation et lancement","s1T":"Téléchargez l'ELF","s1D":"Téléchargez `HearBridge-PS5-1.2.0.elf` depuis la dernière version.","s2T":"Envoyez-le au chargeur sur le port 9021","s2D":"Envoyez le fichier au chargeur de la console, par exemple :","s3T":"Ouvrez la page de contrôle","s3D":"Ouvrez cette adresse dans le navigateur de la PS5, sur un téléphone ou sur un PC, ou ouvrez la vignette **HearBridge** ajoutée à l'écran d'accueil au premier lancement :","s4T":"Appairez le casque","s5T":"Mettre à jour ou arrêter","s5D":"Fermer la page laisse HearBridge tourner. Renvoyer l'ELF remplace la copie en cours. **Arrêter HearBridge** le termine.","copy":"Copier","copied":"Copié","shotsTitle":"Captures d'écran","shotEn":"Sur un téléviseur, 1920×1080","shotPhone":"Sur un téléphone","helpTitle":"Dépannage","q1":"Pas d'icône HearBridge sur l'écran d'accueil","a1":"L'icône est ajoutée à chaque lancement, relancez donc l'ELF. La page marche aussi sans elle sur `http://<console-ip>:8090`.","q2":"La page ne s'ouvre pas","a2":"Utilisez l'IP de la console et le port 8090, depuis un appareil sur le même réseau. Au démarrage de HearBridge, la console affiche la notification **« HearBridge 1.2.0: http://… »** avec l'adresse.","q3":"Le casque n'est pas trouvé lors de la recherche","a3":"Mettez d'abord le casque en mode appairage, puis appuyez sur **Rechercher des appareils**. Si la page demande le mode appairage, maintenez le bouton d'appairage jusqu'à ce que le voyant clignote vite, puis réessayez.","q4":"Pas de son alors que le casque est connecté","a4":"Vérifiez que **Couper le son** n'est pas actif et essayez **Son de test**. S'il n'y a toujours pas de son, récupérez le journal et ouvrez un ticket.","q5":"Rien ne se passe quand j'envoie l'ELF","a5":"Vous devriez voir **« HearBridge 1.2.0: starting »**. Sinon, le loader ne l'a pas lancé.","logTitle":"Récupérer le journal","reportTitle":"Signaler un problème","reportIntro":"Ouvrez un ticket GitHub en indiquant :","footRel":"Versions","footIss":"Tickets","footLic":"Licence","footSrc":"Code source","u7":"**Latence :** cible de tampon de 60 à 200 ms (200 ms par défaut). Plus bas, c'est moins de délai, mais le son peut couper.","u8":"**État** affiche le codec et votre puce Bluetooth. Le **Journal** affiche chaque étape : vert réussi, rouge échoué, bleu pour vos appuis.","chipNote":"**Un seul fichier pour toutes les PS5 :** HearBridge détecte la puce Bluetooth tout seul, Marvell/NXP (`1286`) ou MediaTek (`0e8d`), et l'affiche dans **Puce** sous **État**. Plus de détails : [quelle puce ai-je ?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Mettez le casque en mode appairage, appuyez sur **Rechercher des appareils** (environ 20 s), puis sur **Connecter**. Il est enregistré et le son démarre."},"de":{"intro":"HearBridge PS5 ist ein Payload (ELF) für eine gejailbreakte PS5. Er nimmt den Ton der Konsole auf und überträgt ihn über das konsoleneigene Bluetooth-Funkmodul an normale Bluetooth-Kopfhörer oder -Lautsprecher (A2DP, SBC). Gesteuert wird er über eine Webseite, die die Konsole bereitstellt. Spiele, Firmware und Jailbreak bleiben unverändert.","limHp":"Getestet mit Sony WF-1000XM6, OnePlus Buds Ace 2 und Xbox Wireless Headset.","req1":"Eine gejailbreakte PS5 mit einem ELF-Loader auf Port **9021** (elfldr).","req2":"Bluetooth-Kopfhörer oder ein Lautsprecher mit **A2DP** (SBC).","testedNote":"**Getestet auf:** PS5 Fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Andere Modelle: Berichte sind willkommen.","log1":"Sende einen FTP-Server-Payload (zum Beispiel [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) mit demselben Loader, den du für HearBridge nutzt.","log2":"Verbinde dich mit FileZilla mit der IP der Konsole auf dem Port, den der Server anzeigt (ftpsrv nutzt meist **2121**).","log3":"Lade `/data/hearbridge/hearbridge.log` und `/data/hearbridge/diag.txt` herunter.","logDiag":"`diag.txt` gibt es auch unter `http://<console-ip>:8090/api/diag`.","u2":"**Auto-Verbindung:** Gespeicherte Kopfhörer verbinden sich von selbst, wenn du sie einschaltest oder aus dem Etui nimmst. Ein anderes gespeichertes Paar herausnehmen wechselt zu diesem. Nach manuellem **Trennen** warten sie auf **Verbinden**.","u3":"**Trennen** beendet die Verbindung, die Kopfhörer bleiben gespeichert. **Entfernen** trennt sie zuerst und löscht sie dann.","u4":"**Lautstärke:** Verstärkung bis 500 % (Start bei 250 %) und Kopfhörer-Lautstärke (AVRCP, Start bei 50 %, folgt auch den Tasten der Kopfhörer). Pro Kopfhörer gespeichert, sobald du sie änderst.","u5":"**Equalizer:** 5 Bänder mit Presets, pro Kopfhörer gespeichert. **Klarer Klang** schaltet ihn aus und setzt die Verstärkung auf 250 % und den Puffer auf 200 ms zurück.","u6":"**Codec:** **Auto** ist einfaches SBC. **SBC HQ** und **SBC-XQ** lassen sich manuell wählen, wenn die Kopfhörer sie unterstützen; der Rest ist ausgegraut.","notesData":"Einstellungen, gespeicherte Geräte und das Log liegen in `/data/hearbridge/` (`hearbridge.log` protokolliert jeden Schritt).","r1":"dem Konsolenmodell (CFI-Nummer, z. B. CFI-1016A)","r2":"der Firmware-Version","r3":"dem verwendeten Loader","r4":"ob die Meldung **„HearBridge 1.2.0: starting“** erschienen ist","r5":"ob die Seite aufgeht und was unter **Status** bei **Chip** steht","r6":"den Log-Dateien (`hearbridge.log`, `diag.txt`)","language":"Sprache","navFeatures":"Funktionen","navCompat":"Kompatibilität","navInstall":"Installation","navHelp":"Fehlerbehebung","btnDownload":"Neueste Version herunterladen","btnDownloadShort":"Download","btnGithub":"Auf GitHub ansehen","btnReport":"Problem melden","btnHowto":"So installierst du es","beta":"Beta","h1a":"Bluetooth-Kopfhörer für eine gejailbreakte PS5","h1b":"Spiel- und Systemton, ohne Dongle.","heroCap":"Die Steuerseite, die die Konsole bereitstellt (Version 1.2.0).","featTitle":"Funktionen","limTitle":"Einschränkungen","lim1":"Nur SBC (kein AAC, aptX oder LDAC), ein Kopfhörer zur Zeit, kein Mikrofon.","lim2":"Der Fernseher gibt den Ton weiterhin aus.","lim3":"Immer nur einen Payload mit Bluetooth gleichzeitig ausführen. Der DualSense funktioniert weiter.","compatTitle":"Kompatibilität","reqTitle":"Voraussetzungen","installTitle":"Installation und Start","s1T":"ELF herunterladen","s1D":"Lade `HearBridge-PS5-1.2.0.elf` aus dem neuesten Release.","s2T":"An den Loader auf Port 9021 senden","s2D":"Sende die Datei an den Loader der Konsole, zum Beispiel:","s3T":"Steuerseite öffnen","s3D":"Öffne diese Adresse im PS5-Browser, auf dem Handy oder am PC, oder öffne die Kachel **HearBridge**, die beim ersten Start zum Startbildschirm hinzugefügt wird:","s4T":"Kopfhörer koppeln","s5T":"Aktualisieren oder beenden","s5D":"Das Schließen der Seite lässt HearBridge weiterlaufen. Erneutes Senden der ELF ersetzt die laufende Kopie. **HearBridge beenden** beendet es.","copy":"Kopieren","copied":"Kopiert","shotsTitle":"Screenshots","shotEn":"Auf dem Fernseher, 1920×1080","shotPhone":"Auf dem Handy","helpTitle":"Fehlerbehebung","q1":"Kein HearBridge-Symbol auf dem Startbildschirm","a1":"Das Symbol wird bei jedem Start neu angelegt, starte die ELF also noch einmal. Die Seite funktioniert auch ohne Symbol unter `http://<console-ip>:8090`.","q2":"Die Seite öffnet sich nicht","a2":"Nutze die IP-Adresse der Konsole und Port 8090, von einem Gerät im selben Netzwerk. Beim Start von HearBridge zeigt die Konsole die Meldung **„HearBridge 1.2.0: http://…“** mit der Adresse.","q3":"Kopfhörer werden beim Suchen nicht gefunden","a3":"Versetze die Kopfhörer zuerst in den Kopplungsmodus und drücke dann **Nach Geräten suchen**. Wenn die Seite nach dem Kopplungsmodus fragt, halte die Kopplungstaste, bis das Licht schnell blinkt, und versuch es erneut.","q4":"Kein Ton, obwohl die Kopfhörer verbunden sind","a4":"Prüfe, dass **Stumm** aus ist, und probiere **Testton**. Wenn weiterhin kein Ton kommt, hol dir das Log und eröffne ein Issue.","q5":"Beim Senden der ELF passiert nichts","a5":"Du solltest **„HearBridge 1.2.0: starting“** sehen. Wenn nicht, hat der Loader sie nicht gestartet.","logTitle":"Log holen","reportTitle":"Problem melden","reportIntro":"Eröffne ein GitHub-Issue mit:","footRel":"Releases","footIss":"Issues","footLic":"Lizenz","footSrc":"Quellcode","u7":"**Latenz:** Pufferziel von 60 bis 200 ms (Standard 200 ms). Weniger heißt weniger Verzögerung, kann aber Aussetzer bringen.","u8":"**Status** zeigt den Codec und deinen Bluetooth-Chip. Das **Protokoll** zeigt jeden Schritt: grün geklappt, rot fehlgeschlagen, blau für deine Klicks.","chipNote":"**Eine Datei für jede PS5:** HearBridge erkennt den Bluetooth-Chip selbst, Marvell/NXP (`1286`) oder MediaTek (`0e8d`), und zeigt ihn unter **Status** bei **Chip**. Mehr unter [welchen Chip habe ich?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Versetze die Kopfhörer in den Kopplungsmodus, drücke **Nach Geräten suchen** (etwa 20 s) und dann **Verbinden**. Sie werden gespeichert und der Ton startet."},"pt":{"intro":"HearBridge PS5 é um payload (ELF) para um PS5 desbloqueado. Ele captura o áudio do console e o transmite pelo próprio rádio Bluetooth do console para fones ou caixas de som Bluetooth comuns (A2DP, SBC). O controle é feito por uma página web servida pelo console. Não modifica jogos, firmware nem o desbloqueio.","limHp":"Testado com Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Um PS5 desbloqueado com um carregador de ELF escutando na porta **9021** (elfldr).","req2":"Fones ou uma caixa de som Bluetooth com **A2DP** (SBC).","testedNote":"**Testado em:** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Outros modelos: relatos são bem-vindos.","log1":"Envie um payload de servidor FTP (por exemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) pelo mesmo carregador que você usa para o HearBridge.","log2":"Conecte-se com o FileZilla ao IP do console, na porta que o servidor mostra (o ftpsrv normalmente usa a **2121**).","log3":"Baixe `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` também está em `http://<console-ip>:8090/api/diag`.","u2":"**Conexão automática:** fones salvos conectam sozinhos quando você os liga ou tira do estojo. Tirar outro par salvo troca para ele. Depois de **Desconectar** manualmente, eles esperam o **Conectar**.","u3":"**Desconectar** encerra a conexão e mantém os fones salvos. **Esquecer** desconecta primeiro e depois remove.","u4":"**Volume:** reforço até 500 % (começa em 250 %) e volume do fone (AVRCP, começa em 50 %, também segue os botões do fone). Salvos por fone depois que você muda.","u5":"**Equalizador:** 5 bandas com presets, salvo por fone. **Som limpo** desliga e volta o reforço para 250 % e o buffer para 200 ms.","u6":"**Codec:** **Auto** é SBC simples. **SBC HQ** e **SBC-XQ** podem ser escolhidos à mão quando os fones suportam; o resto fica cinza.","notesData":"As configurações, os dispositivos salvos e o log ficam em `/data/hearbridge/` (`hearbridge.log` registra cada etapa).","r1":"o modelo do console (número CFI, ex.: CFI-1016A)","r2":"a versão do firmware","r3":"o carregador que você usou","r4":"se a notificação **\"HearBridge 1.2.0: starting\"** apareceu","r5":"se a página abre, e o que **Chip** mostra em **Estado**","r6":"os arquivos de log (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Recursos","navCompat":"Compatibilidade","navInstall":"Instalação","navHelp":"Solução de problemas","btnDownload":"Baixar a versão mais recente","btnDownloadShort":"Baixar","btnGithub":"Ver no GitHub","btnReport":"Relatar um problema","btnHowto":"Como instalar","beta":"Beta","h1a":"Fones Bluetooth para um PS5 desbloqueado","h1b":"Áudio dos jogos e do sistema, sem adaptador.","heroCap":"A página de controle servida pelo console (versão 1.2.0).","featTitle":"Recursos","limTitle":"Limitações","lim1":"Só SBC (sem AAC, aptX ou LDAC), um fone por vez, sem microfone.","lim2":"A TV também continua tocando o som.","lim3":"Execute apenas um payload que use Bluetooth por vez. O DualSense continua funcionando.","compatTitle":"Compatibilidade","reqTitle":"Requisitos","installTitle":"Instalação e execução","s1T":"Baixe o ELF","s1D":"Baixe `HearBridge-PS5-1.2.0.elf` da versão mais recente.","s2T":"Envie-o ao carregador na porta 9021","s2D":"Envie o arquivo ao carregador do console, por exemplo:","s3T":"Abra a página de controle","s3D":"Abra este endereço no navegador do PS5, no celular ou no PC, ou abra o bloco **HearBridge** adicionado à tela inicial na primeira execução:","s4T":"Pareie os fones","s5T":"Atualizar ou parar","s5D":"Fechar a página deixa o HearBridge rodando. Enviar o ELF de novo substitui a cópia em execução. **Parar o HearBridge** encerra.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas de tela","shotEn":"Na TV, 1920×1080","shotPhone":"No celular","helpTitle":"Solução de problemas","q1":"O ícone do HearBridge não aparece na tela inicial","a1":"O ícone é adicionado de novo a cada execução, então rode o ELF mais uma vez. A página também funciona sem ele em `http://<console-ip>:8090`.","q2":"A página não abre","a2":"Use o IP do console e a porta 8090, de um dispositivo na mesma rede. Quando o HearBridge inicia, o console mostra a notificação **\"HearBridge 1.2.0: http://…\"** com o endereço.","q3":"Os fones não são encontrados ao tocar em Procurar","a3":"Coloque os fones no modo de pareamento primeiro e depois toque em **Procurar dispositivos**. Se a página pedir o modo de pareamento, segure o botão de parear até a luz piscar rápido e tente de novo.","q4":"Não há som mesmo com os fones conectados","a4":"Verifique se **Silenciar** está desligado e experimente **Tom de teste**. Se ainda não houver som, obtenha o log e abra uma issue.","q5":"Nada acontece quando envio o ELF","a5":"Deve aparecer **\"HearBridge 1.2.0: starting\"**. Se não aparecer, o loader não o executou.","logTitle":"Como obter o log","reportTitle":"Relatar um problema","reportIntro":"Abra uma issue no GitHub e inclua:","footRel":"Versões","footIss":"Issues","footLic":"Licença","footSrc":"Código-fonte","u7":"**Latência:** alvo de buffer de 60 a 200 ms (padrão 200 ms). Menos é menos atraso, mas pode cortar.","u8":"**Estado** mostra o codec e o seu chip Bluetooth. O **Registo** mostra cada passo: verde deu certo, vermelho falhou, azul para o que você toca.","chipNote":"**Um arquivo para todo PS5:** o HearBridge detecta o chip Bluetooth sozinho, Marvell/NXP (`1286`) ou MediaTek (`0e8d`), e mostra em **Chip** no **Estado**. Mais em [qual chip eu tenho?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Coloque os fones no modo de pareamento, toque em **Procurar dispositivos** (cerca de 20 s) e depois em **Conectar**. Eles são salvos e o áudio começa."},"ru":{"intro":"HearBridge PS5 — это payload (ELF) для взломанной PS5. Он захватывает звук консоли и передаёт его через собственный Bluetooth-модуль консоли на обычные Bluetooth-наушники или колонки (A2DP, SBC). Управление — через веб-страницу, которую отдаёт консоль. Игры, прошивка и взлом не изменяются.","limHp":"Проверено с Sony WF-1000XM6, OnePlus Buds Ace 2 и Xbox Wireless Headset.","req1":"Взломанная PS5 с загрузчиком ELF на порту **9021** (elfldr).","req2":"Bluetooth-наушники или колонка с поддержкой **A2DP** (SBC).","testedNote":"**Проверено на:** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Другие модели: отчёты приветствуются.","log1":"Отправьте payload FTP-сервера (например, [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) тем же загрузчиком, что и HearBridge.","log2":"Подключитесь через FileZilla к IP консоли на порт, который показывает сервер (ftpsrv обычно использует **2121**).","log3":"Скачайте `/data/hearbridge/hearbridge.log` и `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` также доступен по адресу `http://<console-ip>:8090/api/diag`.","u2":"**Автоподключение:** сохранённые наушники подключаются сами, когда их включают или достают из кейса. Если достать другую сохранённую пару, звук переключится на неё. После ручного **Отключить** они ждут **Подключить**.","u3":"**Отключить** разрывает связь, наушники остаются сохранёнными. **Забыть** сначала отключает их, затем удаляет.","u4":"**Громкость:** усиление до 500 % (по умолчанию 250 %) и громкость наушников (AVRCP, по умолчанию 50 %, также следует кнопкам наушников). Сохраняются для каждых наушников после изменения.","u5":"**Эквалайзер:** 5 полос с пресетами, сохраняется для каждых наушников. **Чистый звук** выключает его и возвращает усиление на 250 % и буфер на 200 мс.","u6":"**Кодек:** **Авто** — обычный SBC. **SBC HQ** и **SBC-XQ** можно выбрать вручную, если наушники их поддерживают; остальные показаны серым.","notesData":"Настройки, сохранённые устройства и журнал находятся в `/data/hearbridge/` (`hearbridge.log` записывает каждый шаг).","r1":"модель консоли (номер CFI, например CFI-1016A)","r2":"версию прошивки","r3":"какой загрузчик вы использовали","r4":"появилось ли уведомление **«HearBridge 1.2.0: starting»**","r5":"открывается ли страница и что показывает **Чип** в разделе **Состояние**","r6":"файлы журнала (`hearbridge.log`, `diag.txt`)","language":"Язык","navFeatures":"Возможности","navCompat":"Совместимость","navInstall":"Установка","navHelp":"Решение проблем","btnDownload":"Скачать последний релиз","btnDownloadShort":"Скачать","btnGithub":"Открыть на GitHub","btnReport":"Сообщить о проблеме","btnHowto":"Как установить","beta":"Бета","h1a":"Bluetooth-наушники для взломанной PS5","h1b":"Звук игр и системы без адаптера.","heroCap":"Страница управления, которую отдаёт консоль (версия 1.2.0).","featTitle":"Возможности","limTitle":"Ограничения","lim1":"Только SBC (без AAC, aptX и LDAC), одни наушники за раз, без микрофона.","lim2":"Телевизор тоже продолжает воспроизводить звук.","lim3":"Запускайте одновременно только один payload, использующий Bluetooth. DualSense продолжает работать.","compatTitle":"Совместимость","reqTitle":"Требования","installTitle":"Установка и запуск","s1T":"Скачайте ELF","s1D":"Скачайте `HearBridge-PS5-1.2.0.elf` из последнего релиза.","s2T":"Отправьте его загрузчику на порт 9021","s2D":"Отправьте файл загрузчику консоли, например:","s3T":"Откройте страницу управления","s3D":"Откройте этот адрес в браузере PS5, на телефоне или ПК, или откройте плитку **HearBridge**, которая добавляется на главный экран при первом запуске:","s4T":"Выполните сопряжение наушников","s5T":"Обновить или остановить","s5D":"Если закрыть страницу, HearBridge продолжит работать. Повторная отправка ELF заменяет запущенную копию. **Остановить HearBridge** завершает его.","copy":"Копировать","copied":"Скопировано","shotsTitle":"Скриншоты","shotEn":"На телевизоре, 1920×1080","shotPhone":"На телефоне","helpTitle":"Решение проблем","q1":"Нет значка HearBridge на главном экране","a1":"Значок добавляется заново при каждом запуске, поэтому просто запустите ELF ещё раз. Страница работает и без него по адресу `http://<console-ip>:8090`.","q2":"Страница не открывается","a2":"Используйте IP-адрес консоли и порт 8090 с устройства в той же сети. При запуске HearBridge консоль показывает уведомление **«HearBridge 1.2.0: http://…»** с адресом.","q3":"Наушники не находятся при поиске","a3":"Сначала переведите наушники в режим сопряжения, затем нажмите **Искать устройства**. Если страница просит режим сопряжения, держите кнопку сопряжения, пока индикатор не замигает быстро, и попробуйте снова.","q4":"Нет звука, хотя наушники подключены","a4":"Проверьте, что режим **Без звука** выключен, и попробуйте **Тестовый тон**. Если звука всё равно нет, получите журнал и создайте issue.","q5":"При отправке ELF ничего не происходит","a5":"Должно появиться **«HearBridge 1.2.0: starting»**. Если нет, загрузчик его не запустил.","logTitle":"Как получить журнал","reportTitle":"Сообщить о проблеме","reportIntro":"Создайте issue на GitHub и укажите:","footRel":"Релизы","footIss":"Issues","footLic":"Лицензия","footSrc":"Исходный код","u7":"**Задержка:** целевой буфер от 60 до 200 мс (по умолчанию 200 мс). Меньше — меньше задержка, но возможны обрывы звука.","u8":"**Состояние** показывает кодек и ваш Bluetooth-чип. **Журнал** показывает каждый шаг: зелёный — получилось, красный — ошибка, голубой — ваши нажатия.","chipNote":"**Один файл для любой PS5:** HearBridge сам определяет Bluetooth-чип, Marvell/NXP (`1286`) или MediaTek (`0e8d`), и показывает его в строке **Чип** раздела **Состояние**. Подробнее: [какой у меня чип?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Переведите наушники в режим сопряжения, нажмите **Искать устройства** (около 20 с), затем **Подключить**. Они сохраняются, и звук начинает играть."},"ja":{"intro":"HearBridge PS5 は脱獄済み PS5 用のペイロード（ELF）です。本体の音声をキャプチャし、本体内蔵の Bluetooth 無線で一般的な Bluetooth ヘッドホンやスピーカーへ送ります（A2DP、SBC）。操作は本体が提供する Web ページから行います。ゲーム、ファームウェア、脱獄環境は変更しません。","limHp":"Sony WF-1000XM6、OnePlus Buds Ace 2、Xbox Wireless Headset で動作確認済み。","req1":"ポート **9021** で待ち受ける ELF ローダー（elfldr）がある脱獄済み PS5。","req2":"**A2DP**（SBC）対応の Bluetooth ヘッドホンまたはスピーカー。","testedNote":"**動作確認環境:** PS5 初期型 CFI-10xx（Marvell/NXP）、PS5 Slim CFI-2008（MediaTek）。ほかのモデルの報告を歓迎します。","log1":"HearBridge と同じローダーで FTP サーバーのペイロード（例: [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）を送信します。","log2":"FileZilla で、サーバーが表示するポートを使って本体の IP に接続します（ftpsrv は通常 **2121**）。","log3":"`/data/hearbridge/hearbridge.log` と `/data/hearbridge/diag.txt` をダウンロードします。","logDiag":"`diag.txt` は `http://<console-ip>:8090/api/diag` でも見られます。","u2":"**自動接続:** 保存済みのヘッドホンは電源を入れたりケースから出したりすると自動で接続します。別の保存済みヘッドホンを出すとそちらに切り替わります。手動で **切断** した後は **接続** を待ちます。","u3":"**切断** は接続を切り、ヘッドホンは保存されたままです。**削除** はまず切断してから削除します。","u4":"**音量:** ブースト最大 500 %（初期値 250 %）とヘッドホン音量（AVRCP、初期値 50 %、本体のボタンにも追従）。変更するとヘッドホンごとに保存されます。","u5":"**イコライザー:** プリセット付きの 5 バンド、ヘッドホンごとに保存。**クリアな音** でオフになり、ブーストは 250 %、バッファは 200 ms に戻ります。","u6":"**コーデック:** **自動** は通常の SBC。ヘッドホンが対応していれば **SBC HQ** と **SBC-XQ** を手動で選べます。非対応のものはグレー表示です。","notesData":"設定、保存済みデバイス、ログは `/data/hearbridge/` にあります（`hearbridge.log` に各手順が記録されます）。","r1":"本体のモデル（CFI 番号、例: CFI-1016A）","r2":"ファームウェアのバージョン","r3":"使用したローダー","r4":"**「HearBridge 1.2.0: starting」** の通知が表示されたか","r5":"ページが開くか、**状態** の **チップ** に何と表示されるか","r6":"ログファイル（`hearbridge.log`、`diag.txt`）","language":"言語","navFeatures":"機能","navCompat":"対応状況","navInstall":"インストール","navHelp":"トラブルシューティング","btnDownload":"最新リリースをダウンロード","btnDownloadShort":"ダウンロード","btnGithub":"GitHub で見る","btnReport":"問題を報告","btnHowto":"インストール方法","beta":"ベータ","h1a":"脱獄済み PS5 で Bluetooth ヘッドホン","h1b":"ゲームとシステムの音声を、ドングルなしで。","heroCap":"本体が提供するコントロールページ（バージョン 1.2.0）。","featTitle":"機能","limTitle":"制限事項","lim1":"SBC のみ（AAC、aptX、LDAC は非対応）、一度に一台、マイクなし。","lim2":"テレビからも音は出続けます。","lim3":"Bluetooth を使うペイロードは一度に一つだけ実行してください。DualSense はそのまま使えます。","compatTitle":"対応状況","reqTitle":"必要なもの","installTitle":"インストールと起動","s1T":"ELF をダウンロード","s1D":"最新リリースから `HearBridge-PS5-1.2.0.elf` をダウンロードします。","s2T":"ポート 9021 のローダーに送信","s2D":"本体のローダーにファイルを送信します。例:","s3T":"操作ページを開く","s3D":"PS5 のブラウザ、スマートフォン、PC で次のアドレスを開きます。初回起動時にホーム画面に追加される **HearBridge** タイルからも開けます:","s4T":"ヘッドホンをペアリング","s5T":"更新・停止","s5D":"ページを閉じても HearBridge は動き続けます。ELF をもう一度送ると実行中のものと入れ替わります。**HearBridge を停止** で終了します。","copy":"コピー","copied":"コピーしました","shotsTitle":"スクリーンショット","shotEn":"テレビ表示、1920×1080","shotPhone":"スマートフォン","helpTitle":"トラブルシューティング","q1":"ホーム画面に HearBridge のアイコンが出ない","a1":"アイコンは起動のたびに追加されるので、ELF をもう一度実行してください。アイコンがなくてもページは `http://<console-ip>:8090` で使えます。","q2":"ページが開かない","a2":"同じネットワーク上の機器から、本体の IP アドレスとポート 8090 を使ってください。HearBridge の起動時に、アドレス付きの **「HearBridge 1.2.0: http://…」** という通知が本体に表示されます。","q3":"検索してもヘッドホンが見つからない","a3":"先にヘッドホンをペアリングモードにしてから **デバイスを検索** を押してください。ページにペアリングモードの案内が出たら、ランプが速く点滅するまでペアリングボタンを長押しして、もう一度試してください。","q4":"ヘッドホンは接続されているのに音が出ない","a4":"**ミュート** がオフになっているか確認し、**テストトーン** を試してください。それでも音が出ない場合は、ログを取得して Issue を作成してください。","q5":"ELF を送っても何も起きない","a5":"**「HearBridge 1.2.0: starting」** と表示されるはずです。表示されなければ、ローダーが実行していません。","logTitle":"ログの取得","reportTitle":"問題を報告","reportIntro":"GitHub の Issue を作成し、次の情報を含めてください:","footRel":"リリース","footIss":"Issue","footLic":"ライセンス","footSrc":"ソースコード","u7":"**遅延:** バッファ目標 60〜200 ms（初期値 200 ms）。下げると遅延は減りますが、音が途切れることがあります。","u8":"**状態** にはコーデックと Bluetooth チップが表示されます。**ログ** には全ステップが表示されます：緑は成功、赤は失敗、青はボタン操作。","chipNote":"**すべての PS5 に 1 つのファイル:** HearBridge が Bluetooth チップ（Marvell/NXP `1286` または MediaTek `0e8d`）を自動で判別し、**状態** の **チップ** に表示します。詳しくは [どのチップか確認する](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"ヘッドホンをペアリングモードにして **デバイスを検索**（約 20 秒）を押し、**接続** を押します。保存され、音声が流れ始めます。"},"zh":{"intro":"HearBridge PS5 是用于破解 PS5 的载荷（ELF）。它采集主机的声音，并通过主机自带的蓝牙模块传输到普通的蓝牙耳机或音箱（A2DP、SBC）。通过主机提供的网页进行控制。它不会修改游戏、固件或破解环境。","limHp":"已在 Sony WF-1000XM6、OnePlus Buds Ace 2 和 Xbox Wireless Headset 上测试。","req1":"已破解的 PS5，并有在端口 **9021** 监听的 ELF 加载器（elfldr）。","req2":"支持 **A2DP**（SBC）的蓝牙耳机或音箱。","testedNote":"**测试环境**：PS5 初代机型 CFI-10xx（Marvell/NXP），PS5 Slim CFI-2008（MediaTek）。其他机型欢迎反馈。","log1":"用运行 HearBridge 的同一个加载器发送 FTP 服务器载荷（例如 [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）。","log2":"用 FileZilla 连接主机的 IP，端口使用服务器显示的端口（ftpsrv 通常为 **2121**）。","log3":"下载 `/data/hearbridge/hearbridge.log` 和 `/data/hearbridge/diag.txt`。","logDiag":"`diag.txt` 也可以在 `http://<console-ip>:8090/api/diag` 查看。","u2":"**自动连接：**已保存的耳机在开机或从充电盒取出时会自动连接。取出另一副已保存的耳机会切换过去。手动 **断开** 后会等待 **连接**。","u3":"**断开** 会断开连接，耳机仍保留。**忘记** 会先断开，再删除耳机。","u4":"**音量：**增益最高 500%（初始 250%）和耳机音量（AVRCP，初始 50%，也会跟随耳机自身的按键）。修改后按耳机保存。","u5":"**均衡器：**5 个频段，带预设，按耳机保存。**纯净声音** 会关闭均衡器，并把增益恢复到 250%、缓冲恢复到 200 ms。","u6":"**编解码器：****自动** 为普通 SBC。耳机支持时可以手动选择 **SBC HQ** 和 **SBC-XQ**；其余显示为灰色。","notesData":"设置、已保存的设备和日志位于 `/data/hearbridge/`（`hearbridge.log` 记录每一步）。","r1":"主机型号（CFI 编号，例如 CFI-1016A）","r2":"固件版本","r3":"使用的加载器","r4":"是否出现了 **\"HearBridge 1.2.0: starting\"** 通知","r5":"页面能否打开，以及 **状态** 中 **芯片** 显示什么","r6":"日志文件（`hearbridge.log`、`diag.txt`）","language":"语言","navFeatures":"功能","navCompat":"兼容性","navInstall":"安装","navHelp":"故障排除","btnDownload":"下载最新版本","btnDownloadShort":"下载","btnGithub":"在 GitHub 上查看","btnReport":"报告问题","btnHowto":"安装方法","beta":"测试版","h1a":"为破解的 PS5 连接蓝牙耳机","h1b":"游戏和系统声音，无需适配器。","heroCap":"主机提供的控制页面（版本 1.2.0）。","featTitle":"功能","limTitle":"限制","lim1":"仅支持 SBC（不支持 AAC、aptX 或 LDAC），一次一副耳机，没有麦克风。","lim2":"电视也会继续播放声音。","lim3":"同一时间只运行一个使用蓝牙的载荷。DualSense 照常工作。","compatTitle":"兼容性","reqTitle":"要求","installTitle":"安装与运行","s1T":"下载 ELF","s1D":"从最新发布中下载 `HearBridge-PS5-1.2.0.elf`。","s2T":"发送到端口 9021 的加载器","s2D":"将文件发送到主机的加载器，例如：","s3T":"打开控制网页","s3D":"在 PS5 浏览器、手机或电脑上打开以下地址，或打开首次运行时添加到主屏幕的 **HearBridge** 图块：","s4T":"配对耳机","s5T":"更新或停止","s5D":"关闭页面后 HearBridge 仍在运行。再次发送 ELF 会替换正在运行的副本。**停止 HearBridge** 可结束它。","copy":"复制","copied":"已复制","shotsTitle":"截图","shotEn":"电视画面，1920×1080","shotPhone":"手机","helpTitle":"故障排除","q1":"主屏幕上没有 HearBridge 图标","a1":"每次运行都会重新添加图标，所以再运行一次 ELF 即可。没有图标时页面也可以在 `http://<console-ip>:8090` 打开。","q2":"网页打不开","a2":"请在同一网络中的设备上使用主机的 IP 地址和端口 8090。HearBridge 启动时，主机会显示带有地址的 **\"HearBridge 1.2.0: http://…\"** 通知。","q3":"搜索时找不到耳机","a3":"先让耳机进入配对模式，再按 **搜索设备**。如果页面提示进入配对模式，请按住配对键直到指示灯快速闪烁，然后重试。","q4":"耳机已连接但没有声音","a4":"确认 **静音** 已关闭，然后试试 **测试音**。如果仍然没有声音，请获取日志并提交 issue。","q5":"发送 ELF 后没有任何反应","a5":"应该会看到 **\"HearBridge 1.2.0: starting\"**。如果没有，说明加载器没有运行它。","logTitle":"获取日志","reportTitle":"报告问题","reportIntro":"在 GitHub 上提交 issue，并附上：","footRel":"版本发布","footIss":"Issues","footLic":"许可证","footSrc":"源代码","u7":"**延迟：**缓冲目标 60 到 200 ms（默认 200 ms）。越低延迟越小，但可能断音。","u8":"**状态** 显示编解码器和你的蓝牙芯片。**日志** 显示每一步：绿色表示成功，红色表示失败，蓝色表示你的操作。","chipNote":"**所有 PS5 用同一个文件：**HearBridge 会自动识别蓝牙芯片，Marvell/NXP（`1286`）或 MediaTek（`0e8d`），并显示在 **状态** 的 **芯片** 中。详见 [我的是哪种芯片？](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"让耳机进入配对模式，按 **搜索设备**（约 20 秒），然后按 **连接**。耳机会被保存，声音开始播放。"},"it":{"intro":"HearBridge PS5 è un payload (ELF) per una PS5 con jailbreak. Cattura l'audio della console e lo trasmette tramite la radio Bluetooth della console stessa a normali cuffie o altoparlanti Bluetooth (A2DP, SBC). Si controlla da una pagina web servita dalla console. Non modifica i giochi, il firmware né il jailbreak.","limHp":"Testato con Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Una PS5 con jailbreak e un loader ELF in ascolto sulla porta **9021** (elfldr).","req2":"Cuffie o un altoparlante Bluetooth con **A2DP** (SBC).","testedNote":"**Testato su:** PS5 fat CFI-10xx (Marvell/NXP), PS5 Slim CFI-2008 (MediaTek). Altri modelli: le segnalazioni sono benvenute.","log1":"Invia un payload server FTP (ad esempio [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con lo stesso loader che usi per HearBridge.","log2":"Collegati con FileZilla all'IP della console sulla porta indicata dal server (ftpsrv di solito usa la **2121**).","log3":"Scarica `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` è anche su `http://<console-ip>:8090/api/diag`.","u2":"**Connessione automatica:** le cuffie salvate si connettono da sole quando le accendi o le togli dalla custodia. Togliendo un altro paio salvato si passa a quello. Dopo un **Disconnetti** manuale aspettano **Connetti**.","u3":"**Disconnetti** chiude il collegamento e lascia le cuffie salvate. **Dimentica** prima le disconnette, poi le rimuove.","u4":"**Volume:** amplificazione fino al 500 % (parte da 250 %) e volume delle cuffie (AVRCP, parte da 50 %, segue anche i tasti delle cuffie). Salvati per cuffia quando li cambi.","u5":"**Equalizzatore:** 5 bande con preset, salvato per cuffia. **Suono pulito** lo spegne e riporta l'amplificazione a 250 % e il buffer a 200 ms.","u6":"**Codec:** **Auto** è SBC semplice. **SBC HQ** e **SBC-XQ** si scelgono a mano se le cuffie li supportano; gli altri sono in grigio.","notesData":"Impostazioni, dispositivi salvati e log si trovano in `/data/hearbridge/` (`hearbridge.log` registra ogni passaggio).","r1":"il modello della console (numero CFI, ad es. CFI-1016A)","r2":"la versione del firmware","r3":"il loader usato","r4":"se è apparsa la notifica **\"HearBridge 1.2.0: starting\"**","r5":"se la pagina si apre, e cosa mostra **Chip** in **Stato**","r6":"i file di log (`hearbridge.log`, `diag.txt`)","language":"Lingua","navFeatures":"Funzioni","navCompat":"Compatibilità","navInstall":"Installazione","navHelp":"Risoluzione dei problemi","btnDownload":"Scarica l'ultima release","btnDownloadShort":"Scarica","btnGithub":"Vedi su GitHub","btnReport":"Segnala un problema","btnHowto":"Come installarlo","beta":"Beta","h1a":"Cuffie Bluetooth per una PS5 con jailbreak","h1b":"Audio dei giochi e del sistema, senza dongle.","heroCap":"La pagina di controllo servita dalla console (versione 1.2.0).","featTitle":"Funzioni","limTitle":"Limiti","lim1":"Solo SBC (niente AAC, aptX o LDAC), una cuffia alla volta, niente microfono.","lim2":"Anche la TV continua a riprodurre l'audio.","lim3":"Esegui un solo payload che usa il Bluetooth alla volta. Il DualSense continua a funzionare.","compatTitle":"Compatibilità","reqTitle":"Requisiti","installTitle":"Installazione e avvio","s1T":"Scarica l'ELF","s1D":"Scarica `HearBridge-PS5-1.2.0.elf` dall'ultima release.","s2T":"Invialo al loader sulla porta 9021","s2D":"Invia il file al loader della console, ad esempio:","s3T":"Apri la pagina di controllo","s3D":"Apri questo indirizzo nel browser della PS5, su un telefono o su un PC, oppure apri il riquadro **HearBridge** aggiunto alla schermata iniziale al primo avvio:","s4T":"Abbina le cuffie","s5T":"Aggiornare o fermare","s5D":"Chiudere la pagina lascia HearBridge in esecuzione. Inviare di nuovo l'ELF sostituisce la copia in esecuzione. **Arresta HearBridge** lo chiude.","copy":"Copia","copied":"Copiato","shotsTitle":"Screenshot","shotEn":"Su una TV, 1920×1080","shotPhone":"Su un telefono","helpTitle":"Risoluzione dei problemi","q1":"Nessuna icona di HearBridge nella schermata iniziale","a1":"L'icona viene aggiunta a ogni avvio, quindi avvia di nuovo l'ELF. La pagina funziona anche senza icona su `http://<console-ip>:8090`.","q2":"La pagina non si apre","a2":"Usa l'IP della console e la porta 8090, da un dispositivo sulla stessa rete. All'avvio di HearBridge la console mostra la notifica **\"HearBridge 1.2.0: http://…\"** con l'indirizzo.","q3":"Le cuffie non vengono trovate quando premi Cerca","a3":"Metti prima le cuffie in modalità di abbinamento, poi premi **Cerca dispositivi**. Se la pagina chiede la modalità di abbinamento, tieni premuto il tasto di abbinamento finché la luce lampeggia veloce e riprova.","q4":"Nessun suono anche se le cuffie sono connesse","a4":"Controlla che **Muto** sia disattivato e prova **Tono di prova**. Se ancora non senti nulla, recupera il log e apri una issue.","q5":"Non succede niente quando invio l'ELF","a5":"Dovresti vedere **\"HearBridge 1.2.0: starting\"**. Se non compare, il loader non l'ha avviato.","logTitle":"Ottenere il log","reportTitle":"Segnala un problema","reportIntro":"Apri una issue su GitHub indicando:","footRel":"Release","footIss":"Issue","footLic":"Licenza","footSrc":"Codice sorgente","u7":"**Latenza:** obiettivo del buffer da 60 a 200 ms (predefinito 200 ms). Più basso vuol dire meno ritardo, ma l'audio può interrompersi.","u8":"**Stato** mostra il codec e il tuo chip Bluetooth. Il **Registro** mostra ogni passaggio: verde riuscito, rosso fallito, blu per quello che premi.","chipNote":"**Un file per ogni PS5:** HearBridge riconosce il chip Bluetooth da solo, Marvell/NXP (`1286`) o MediaTek (`0e8d`), e lo mostra in **Chip** sotto **Stato**. Altro in [che chip ho?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Metti le cuffie in modalità di abbinamento, premi **Cerca dispositivi** (circa 20 s), poi **Connetti**. Vengono salvate e l'audio parte."}};

var LANGS=[["en","English","us"],["ar","العربية","sa",1],["es","Español","es"],["fr","Français","fr"],["de","Deutsch","de"],["pt","Português","br"],["ru","Русский","ru"],["ja","日本語","jp"],["zh","中文","cn"],["it","Italiano","it"]];
var LANG="en";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,function(m,x){return /http|HearBridge \d/.test(x)?'<b class="ltr">'+x+'</b>':'<b>'+x+'</b>'});
  s=s.replace(/\[([^\]]+)\]\(((?:https:|#)[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function t(k){var d=STR[LANG]||STR.en;return d[k]!=null?d[k]:STR.en[k]}
function find(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]==c)return LANGS[i];return null}
function applyLang(c){
  var L=find(c)||LANGS[0];LANG=L[0];
  var h=document.documentElement;h.lang=LANG;h.dir=L[3]?"rtl":"ltr";
  var els=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<els.length;i++)els[i].innerHTML=fmt(t(els[i].getAttribute("data-i18n")));
  document.title="HearBridge PS5: "+t("h1a");
  document.getElementById("heroimg").src=document.getElementById("altimg").src="img/ui-"+LANG+".png";document.getElementById("phoneimg").src="img/ui-phone-"+LANG+".png";
  document.getElementById("langflag").innerHTML=FLAGS[L[2]];
  var o=document.querySelectorAll(".langopt");for(var j=0;j<o.length;j++)o[j].classList.toggle("on",o[j].getAttribute("data-lang")==LANG);
  fitHeader();
}
function initLang(){
  var list=document.getElementById("langlist"),btn=document.getElementById("langbtn"),h="";
  for(var i=0;i<LANGS.length;i++){var L=LANGS[i];
    h+='<button type="button" class="langopt" role="menuitem" data-lang="'+L[0]+'" lang="'+L[0]+'"'+(L[3]?' dir="rtl"':'')+'><span class="flag">'+FLAGS[L[2]]+'</span><span>'+L[1]+'</span></button>'}
  list.innerHTML=h;
  function setOpen(v){list.classList.toggle("show",v);btn.setAttribute("aria-expanded",v?"true":"false");if(v){var on=list.querySelector(".on");(on||list.firstChild).focus()}}
  btn.addEventListener("click",function(e){e.stopPropagation();setOpen(!list.classList.contains("show"))});
  list.addEventListener("click",function(e){var b=e.target.closest(".langopt");if(!b)return;e.stopPropagation();applyLang(b.getAttribute("data-lang"));setOpen(false);btn.focus()});
  document.addEventListener("click",function(){setOpen(false)});
  document.addEventListener("keydown",function(e){if(e.key=="Escape"&&list.classList.contains("show")){setOpen(false);btn.focus()}});
  /* Always open in English; only ?lang= or the switcher changes it. No browser-language detection, nothing restored. */
  var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  applyLang(q&&find(q)?q:"en");
}
function fitHeader(){var top=document.querySelector(".top"),row=top.querySelector(".in");top.classList.remove("compact");
  if(row.scrollWidth>row.clientWidth+1)top.classList.add("compact")}
window.addEventListener("resize",fitHeader);
function initCopy(){
  var b=document.querySelectorAll("[data-copy]");
  for(var i=0;i<b.length;i++)b[i].addEventListener("click",function(){
    var me=this,txt=document.getElementById(me.getAttribute("data-copy")).textContent;
    function done(){me.classList.add("done");me.textContent=t("copied");setTimeout(function(){me.classList.remove("done");me.textContent=t("copy")},1600)}
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,function(){});
    else{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
  });
}
initLang();initCopy();
</script>
