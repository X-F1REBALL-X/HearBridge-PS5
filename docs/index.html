<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HearBridge PS5: Bluetooth headphones for a jailbroken PS5</title>
<meta name="description" content="HearBridge PS5 is a payload (ELF) for a jailbroken PS5 that streams game and system audio over the console's own Bluetooth to ordinary Bluetooth headphones or speakers. No dongle.">
<link rel="icon" type="image/png" href="img/icon.png">
<style>
:root{--ink:#f4efe6;--ink2:#cfc9be;--mute:#9a948a;--void:#0c0b0f;--deck:#15131a;--card:#1f1b26;--edge:#2c2833;--edge2:#3a3543;
--lime:#c8ff3d;--ember:#ff6a2b;--warn:#ffb23d;--bad:#ff3d5a;--sk:-12deg;--max:1320px}
[dir=rtl]{--sk:12deg}
*{box-sizing:border-box}
html{background:var(--void);font-size:16px;scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;color:var(--ink);font:1rem/1.6 "Bahnschrift","DIN Alternate","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Sans CJK JP",sans-serif;
background:repeating-linear-gradient(135deg,rgba(255,255,255,.016) 0 2px,transparent 2px 14px),
radial-gradient(70vw 60vh at 100% 0,rgba(255,106,43,.13),transparent 60%),
radial-gradient(60vw 60vh at 0 100%,rgba(200,255,61,.06),transparent 60%),var(--void);background-attachment:fixed}
a{color:var(--lime)}
code{font:600 .88em/1.4 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;background:rgba(255,255,255,.06);border:1px solid var(--edge);padding:.05em .35em;
direction:ltr;unicode-bidi:isolate;white-space:nowrap}
b{font-weight:800;color:var(--ink)}
.in{max-width:var(--max);margin:0 auto;padding:0 1.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- buttons: skewed plate like the app ---------- */
.btn{position:relative;z-index:0;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:3rem;padding:.35rem 1.5rem;
font:inherit;font-size:1rem;font-weight:800;letter-spacing:.04em;line-height:1.2;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;white-space:nowrap;outline:none}
.btn:before{content:"";position:absolute;z-index:-1;inset:0 .35em;background:var(--card);border:2px solid var(--edge2);transform:skewX(var(--sk));
transition:box-shadow .12s,border-color .12s,background .12s}
.btn:hover:before,.btn:focus-visible:before{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,61,.3),0 0 1rem rgba(200,255,61,.3)}
.btn.act{color:var(--void)}.btn.act:before{background:var(--lime);border-color:var(--lime);box-shadow:0 0 1.4rem rgba(200,255,61,.22)}
.btn.act:hover:before,.btn.act:focus-visible:before{border-color:#fff;box-shadow:0 0 0 3px #fff,0 0 1.2rem rgba(200,255,61,.6)}
.btn.ember{color:var(--void)}.btn.ember:before{background:var(--ember);border-color:var(--ember)}
.btn.ghost{color:var(--lime)}.btn.ghost:before{background:transparent;border-color:transparent}
.btn.ghost:hover:before{border-color:var(--edge2);box-shadow:none}
.btn.sm{min-height:2.5rem;padding:.25rem 1.1rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(12,11,15,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--edge)}
.top .in{display:flex;align-items:center;gap:1rem;height:4.4rem}
.brand{display:flex;align-items:center;flex:0 0 auto;color:var(--ink);text-decoration:none;margin-inline-end:auto}
.logo{flex:0 0 auto;width:2.6rem;height:2.6rem;margin-inline-end:.8rem;display:flex;align-items:center;justify-content:center;color:var(--void);
background:var(--lime);transform:skewX(var(--sk));box-shadow:0 0 1.2rem rgba(200,255,61,.25)}
.logo{background:#0c0b0f;transform:none;border:1px solid var(--edge2);overflow:hidden}.logo img{display:block;width:100%;height:100%}
.name{display:block;font-size:1.35rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;line-height:1.05;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.name b{color:var(--lime);font-weight:900}
.meta{display:flex;align-items:center;margin-top:.25rem}
.ver{color:var(--void);background:var(--ember);font-size:.7rem;font-weight:800;padding:0 .5em;margin-inline-end:.6em;letter-spacing:.06em;transform:skewX(var(--sk));line-height:1.45}
.by{color:var(--mute);font-size:.74rem;direction:ltr;unicode-bidi:isolate;white-space:nowrap;line-height:1.2}
.links{display:flex;align-items:center;gap:.1rem;margin-inline-start:auto}
.top.compact .links{display:none}
.links a{color:var(--ink2);text-decoration:none;font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:.5rem .45rem;white-space:nowrap}
.links a:hover{color:var(--lime)}
#langbox{position:relative}
#langbtn .flag{display:inline-block;width:1.35rem;height:.9rem;line-height:0}
.flag svg{width:100%;height:100%;display:block}
#langbtn .chev{width:.7rem;height:.7rem}
#langlist{display:none;position:absolute;inset-inline-end:0;top:calc(100% + .6rem);z-index:60;width:25rem;max-width:calc(100vw - 2rem);padding:.6rem;
grid-template-columns:1fr 1fr;gap:.3rem;background:var(--deck);border:2px solid var(--lime);box-shadow:0 1.2rem 2.5rem rgba(0,0,0,.75)}
#langlist.show{display:grid}
.langopt{position:relative;z-index:0;display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.6rem;padding:.2rem .9rem;font:inherit;font-size:.95rem;font-weight:700;
color:var(--ink);background:none;border:0;cursor:pointer;text-align:start}
.langopt:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--void);border:2px solid var(--edge)}
.langopt:hover:before,.langopt:focus-visible:before{border-color:var(--lime)}
.langopt.on{color:var(--void)}.langopt.on:before{background:var(--lime);border-color:var(--lime)}
.langopt .flag{width:1.35rem;height:.9rem;flex:0 0 auto}
/* ---------- section scaffolding ---------- */
section{padding:4.5rem 0}
.band{background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.008));border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
h2{display:flex;align-items:center;margin:0 0 .6rem;font-size:1.65rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
h2:before{content:"";flex:0 0 auto;width:.6rem;height:.6rem;margin-inline-end:.8rem;background:var(--ember);transform:rotate(45deg)}
h2:after{content:"";flex:1;height:1px;margin-inline-start:1.1rem;background:linear-gradient(90deg,var(--edge2),transparent)}
[dir=rtl] h2:after{background:linear-gradient(270deg,var(--edge2),transparent)}
.sec-lead{margin:0 0 2rem;color:var(--ink2);max-width:46rem}
h3{margin:0 0 .4rem;font-size:1.1rem;font-weight:800;line-height:1.3}
p{margin:0 0 .8rem}
.panel{position:relative;min-width:0;padding:1.25rem 1.4rem 1.3rem;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 6rem),var(--deck);
border:1px solid var(--edge);border-inline-start:4px solid var(--ember);clip-path:polygon(0 0,calc(100% - 1.1rem) 0,100% 1.1rem,100% 100%,0 100%)}
[dir=rtl] .panel{clip-path:polygon(1.1rem 0,100% 0,100% 100%,0 100%,0 1.1rem)}
.panel.lime{border-inline-start-color:var(--lime)}
.panel.muted{border-inline-start-color:var(--edge2)}
.panel p:last-child,.panel ul:last-child,.panel ol:last-child{margin-bottom:0}
.k{color:var(--mute)}
ul.ticks,ol.steps-sm{margin:0;padding:0;list-style:none}
ul.ticks li{position:relative;padding-inline-start:1.4rem;margin:.45rem 0}
ul.ticks li:before{content:"";position:absolute;inset-inline-start:.15rem;top:.62em;width:.42rem;height:.42rem;background:var(--lime);transform:rotate(45deg)}
ul.ticks.ember li:before{background:var(--ember)}
/* ---------- hero ---------- */
.hero{padding:3.5rem 0 4rem}
.hero .in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3rem;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.2rem}
.tag{display:inline-block;padding:.2rem .8rem;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transform:skewX(var(--sk));line-height:1.5}
.tag.v{color:var(--void);background:var(--ember);border:2px solid var(--ember);direction:ltr;text-transform:none}
h1{margin:0 0 1.2rem;font-size:3.1rem;font-weight:900;line-height:1.06;letter-spacing:.01em;text-transform:uppercase}
h1 .hl{display:block;margin-top:.5rem;color:var(--lime);font-size:.56em;letter-spacing:.06em;line-height:1.2}
.lead{font-size:1.07rem;color:var(--ink2);max-width:36rem;margin-bottom:1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.6rem}
.cta .btn{min-height:3.2rem;font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.chips li{padding:.25rem .75rem;font-size:.82rem;font-weight:700;color:var(--ink2);background:var(--deck);border:1px solid var(--edge2)}
.shot{margin:0}
.frame{position:relative;padding:.55rem;background:var(--deck);border:1px solid var(--edge2);border-inline-start:4px solid var(--lime);
clip-path:polygon(0 0,calc(100% - 1.4rem) 0,100% 1.4rem,100% 100%,0 100%);box-shadow:0 1.5rem 4rem rgba(0,0,0,.55)}
[dir=rtl] .frame{clip-path:polygon(1.4rem 0,100% 0,100% 100%,0 100%,0 1.4rem)}
.frame img{display:block;width:100%;height:auto}
.hero-shot .frame{box-shadow:0 0 0 1px rgba(200,255,61,.08),0 2rem 5rem rgba(0,0,0,.6),0 0 6rem rgba(255,106,43,.08)}
figcaption{margin-top:.7rem;font-size:.85rem;color:var(--mute)}
/* ---------- flow ---------- */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:.9rem;margin-bottom:1.6rem}
.node{display:flex;flex-direction:column;align-items:flex-start}
.node .ic,.feat .ic{display:flex;align-items:center;justify-content:center;width:2.9rem;height:2.9rem;margin-bottom:.9rem;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.node .ic svg,.feat .ic svg{width:1.6rem;height:1.6rem;transform:skewX(calc(var(--sk)*-1))}
.node.mid .ic{background:var(--ember)}
.node p{color:var(--ink2);margin:0}
.flow .arrow{display:flex;align-items:center;color:var(--lime)}
.flow .arrow svg{width:2.2rem;height:2.2rem}
[dir=rtl] .flow .arrow svg{transform:scaleX(-1)}
.new{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem 1.4rem;align-items:start}
.new h3{grid-column:1;margin:0;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);white-space:nowrap;padding-top:.45rem}
.new ul{grid-column:2}
.new .note{grid-column:2;margin:.5rem 0 0;color:var(--warn);font-weight:700}
/* ---------- features ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
.feat p{color:var(--ink2);margin:0}
.limits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1rem;margin-top:1.1rem}
.hp{display:flex;align-items:center;gap:1.1rem}.hp p{margin:0;color:var(--ink2)}
.hp .ic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:2.9rem;height:2.9rem;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.hp .ic svg{width:1.6rem;height:1.6rem;transform:skewX(calc(var(--sk)*-1))}
.limits h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.wn h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);margin-bottom:.6rem}
.wn .grid2 h3,.grid2.wn h3{color:var(--ember)}
/* ---------- compat ---------- */
.pill{display:inline-block;margin-bottom:.8rem;padding:.12rem .7rem;font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transform:skewX(var(--sk))}
.pill.ok{color:var(--void);background:var(--lime)}
.pill.no{color:var(--ink2);border:2px solid var(--edge2)}
.pill.exp{color:var(--void);background:var(--ember)}
.compat p{color:var(--ink2);margin:0}
.req{margin-top:1.1rem}
.req h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
/* ---------- install ---------- */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps>li{position:relative;counter-increment:s;padding-inline-start:4.2rem;margin-bottom:1.1rem}
.steps>li:before{content:counter(s);position:absolute;inset-inline-start:0;top:.2rem;width:2.9rem;height:2.9rem;display:flex;align-items:center;justify-content:center;
font-size:1.35rem;font-weight:900;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.steps>li:not(:last-child):after{content:"";position:absolute;inset-inline-start:1.45rem;top:3.5rem;bottom:-1.1rem;width:2px;background:linear-gradient(var(--edge2),transparent)}
.steps .panel p{color:var(--ink2)}
.code{display:flex;align-items:stretch;margin-top:.8rem;background:var(--void);border:1px solid var(--edge2);direction:ltr}
.code pre{flex:1;min-width:0;margin:0;padding:.75rem 1rem;overflow-x:auto;font:600 .92rem/1.5 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;color:var(--lime)}
.code pre code{all:unset;font:inherit;white-space:pre}
.copy{flex:0 0 auto;min-width:6rem;padding:0 1rem;font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--card);border:0;border-inline-start:1px solid var(--edge2);cursor:pointer}
.copy:hover,.copy:focus-visible{color:var(--void);background:var(--lime);outline:none}
.copy.done{color:var(--void);background:var(--lime)}
/* ---------- screenshots ---------- */
.shots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.24fr);gap:1.2rem;align-items:start}
.shots .frame{padding:.4rem}
/* ---------- help ---------- */
.callout{margin-bottom:1.6rem;color:var(--ink2)}
.faq{display:grid;gap:.6rem;margin-bottom:1.6rem}
details{background:var(--deck);border:1px solid var(--edge);border-inline-start:4px solid var(--edge2)}
details[open]{border-inline-start-color:var(--lime)}
summary{display:flex;align-items:center;gap:1rem;padding:.95rem 1.2rem;font-weight:800;font-size:1.03rem;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"";flex:0 0 auto;width:.55rem;height:.55rem;margin-inline-start:auto;border-right:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(45deg);transition:transform .15s}
details[open] summary:after{transform:rotate(-135deg)}
summary:hover{color:var(--lime)}
summary:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
details p{margin:0;padding:0 1.2rem 1.1rem;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1rem}
.grid2 h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);margin-bottom:.8rem}
ol.num{margin:0 0 .8rem;padding:0;list-style:none;counter-reset:n}
ol.num li{position:relative;counter-increment:n;padding-inline-start:2.1rem;margin:.55rem 0;color:var(--ink2)}
ol.num li:before{content:counter(n);position:absolute;inset-inline-start:0;top:.1rem;width:1.45rem;height:1.45rem;display:flex;align-items:center;justify-content:center;
font-size:.8rem;font-weight:900;color:var(--void);background:var(--ember);transform:skewX(var(--sk))}
.usage{margin-top:1.4rem}
.usage li{color:var(--ink2)}
.report ul{margin-bottom:1.2rem;color:var(--ink2)}
.report .btn{margin-top:.2rem}
/* ---------- CTA + footer ---------- */
.ctabox{text-align:center;padding:3rem 2rem;border-inline-start-color:var(--lime)}
.ctabox h2{justify-content:center;font-size:2rem;letter-spacing:.08em;margin-bottom:.4rem}
.ctabox h2:before,.ctabox h2:after{display:none}
.ctabox .hl{display:block;color:var(--lime);font-size:1.2rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem}
.ctabox .cta{justify-content:center;margin:1.4rem 0 0}
footer{padding:2.5rem 0 3rem;border-top:2px solid var(--edge);margin-top:0;color:var(--mute);font-size:.88rem}
footer .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem}
footer .fb{display:flex;align-items:center;gap:.8rem}
footer .logo{width:2rem;height:2rem;margin:0}
footer nav{display:flex;flex-wrap:wrap;gap:1.2rem}
footer nav a{color:var(--ink2);text-decoration:none;font-weight:700}
footer nav a:hover{color:var(--lime)}
.ltr{direction:ltr;unicode-bidi:isolate}
/* ---------- scripts without caps / letter-spacing ---------- */
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .links a,[dir=rtl] .btn,[dir=rtl] .tag,[dir=rtl] .pill,[dir=rtl] .new h3,[dir=rtl] .limits h3,[dir=rtl] .req h3,[dir=rtl] .grid2 h3,[dir=rtl] .copy,[dir=rtl] .ctabox .hl,
html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] .links a,html[lang=ja] .btn,html[lang=ja] .tag,html[lang=ja] .pill,html[lang=ja] .new h3,html[lang=ja] .limits h3,html[lang=ja] .req h3,html[lang=ja] .grid2 h3,html[lang=ja] .ctabox .hl,
html[lang=zh] h1,html[lang=zh] h2,html[lang=zh] .links a,html[lang=zh] .btn,html[lang=zh] .tag,html[lang=zh] .pill,html[lang=zh] .new h3,html[lang=zh] .limits h3,html[lang=zh] .req h3,html[lang=zh] .grid2 h3,html[lang=zh] .ctabox .hl{letter-spacing:0}
html[lang=ja] h1,html[lang=zh] h1{line-height:1.25;text-transform:none}
html[lang=ja] .ctabox h2,html[lang=zh] .ctabox h2,html[lang=ja] .ctabox .hl,html[lang=zh] .ctabox .hl{text-transform:none}
html[lang=ru] h1,html[lang=de] h1{font-size:2.7rem}
[dir=rtl] h1{line-height:1.2}
/* ---------- responsive ---------- */
@media (max-width:1100px){.links{display:none}}
@media (max-width:980px){
 .hero .in{grid-template-columns:minmax(0,1fr);gap:2.4rem}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
 html{font-size:15px}
 .in{padding:0 1.1rem}
 section{padding:3.2rem 0}
 .top .in{height:4rem;gap:.5rem}
 .by{display:none}
 .name{font-size:1.1rem;letter-spacing:.16em}
 .logo{width:2.2rem;height:2.2rem;margin-inline-end:.6rem}
 .nav-dl{display:none}
 #langbtn .lbl{display:none}
 #langbtn{padding:.25rem .9rem}
 h1{font-size:2.15rem}
 html[lang=ru] h1,html[lang=de] h1{font-size:1.9rem}
 h2{font-size:1.3rem;letter-spacing:.1em}
 .cta .btn{flex:1 1 100%;white-space:normal;text-align:center}
 .btn{max-width:100%}
 .flow{grid-template-columns:minmax(0,1fr)}
 .flow .arrow{justify-content:center;transform:rotate(90deg);height:1.6rem}
 [dir=rtl] .flow .arrow{transform:rotate(90deg)}
 .new{grid-template-columns:minmax(0,1fr)}
 .new h3,.new ul,.new .note{grid-column:1}
 .grid3,.limits,.grid2{grid-template-columns:minmax(0,1fr)}
 .shots{grid-template-columns:minmax(0,1fr)}
 .shots figure:last-child{max-width:none;justify-self:center;width:70%}
 .steps>li{padding-inline-start:3.4rem}
 .steps>li:before{width:2.4rem;height:2.4rem;font-size:1.15rem}
 .steps>li:not(:last-child):after{inset-inline-start:1.2rem;top:3rem}
 .ctabox{padding:2.2rem 1.2rem}
 .ctabox h2{font-size:1.5rem}
 code{white-space:normal;overflow-wrap:anywhere}
 .code pre{white-space:pre-wrap;overflow-wrap:anywhere}
 .code pre code{white-space:pre-wrap}
 .steps .cta .btn{flex:0 1 auto}
 footer .in{flex-direction:column;align-items:flex-start}
}
</style>
