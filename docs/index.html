<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HearBridge PS5: Bluetooth headphones for a jailbroken PS5</title>
<meta name="description" content="HearBridge PS5 is a payload (ELF) for a jailbroken PS5 that streams game and system audio over the console's own Bluetooth to ordinary Bluetooth headphones or speakers. No dongle.">
<link rel="icon" type="image/png" href="img/icon.png">
<style>
:root{--ink:#f4efe6;--ink2:#cfc9be;--mute:#9a948a;--void:#0c0b0f;--deck:#15131a;--card:#1f1b26;--edge:#2c2833;--edge2:#3a3543;
--lime:#c8ff3d;--ember:#ff6a2b;--warn:#ffb23d;--bad:#ff3d5a;--sk:-12deg;--max:1320px}
[dir=rtl]{--sk:12deg}
*{box-sizing:border-box}
html{background:var(--void);font-size:16px;scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;color:var(--ink);font:1rem/1.6 "Bahnschrift","DIN Alternate","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Sans CJK JP",sans-serif;
background:repeating-linear-gradient(135deg,rgba(255,255,255,.016) 0 2px,transparent 2px 14px),
radial-gradient(70vw 60vh at 100% 0,rgba(255,106,43,.13),transparent 60%),
radial-gradient(60vw 60vh at 0 100%,rgba(200,255,61,.06),transparent 60%),var(--void);background-attachment:fixed}
a{color:var(--lime)}
code{font:600 .88em/1.4 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;background:rgba(255,255,255,.06);border:1px solid var(--edge);padding:.05em .35em;
direction:ltr;unicode-bidi:isolate;white-space:nowrap}
b{font-weight:800;color:var(--ink)}
.in{max-width:var(--max);margin:0 auto;padding:0 1.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- buttons: skewed plate like the app ---------- */
.btn{position:relative;z-index:0;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:3rem;padding:.35rem 1.5rem;
font:inherit;font-size:1rem;font-weight:800;letter-spacing:.04em;line-height:1.2;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;white-space:nowrap;outline:none}
.btn:before{content:"";position:absolute;z-index:-1;inset:0 .35em;background:var(--card);border:2px solid var(--edge2);transform:skewX(var(--sk));
transition:box-shadow .12s,border-color .12s,background .12s}
.btn:hover:before,.btn:focus-visible:before{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,61,.3),0 0 1rem rgba(200,255,61,.3)}
.btn.act{color:var(--void)}.btn.act:before{background:var(--lime);border-color:var(--lime);box-shadow:0 0 1.4rem rgba(200,255,61,.22)}
.btn.act:hover:before,.btn.act:focus-visible:before{border-color:#fff;box-shadow:0 0 0 3px #fff,0 0 1.2rem rgba(200,255,61,.6)}
.btn.ember{color:var(--void)}.btn.ember:before{background:var(--ember);border-color:var(--ember)}
.btn.ghost{color:var(--lime)}.btn.ghost:before{background:transparent;border-color:transparent}
.btn.ghost:hover:before{border-color:var(--edge2);box-shadow:none}
.btn.sm{min-height:2.5rem;padding:.25rem 1.1rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(12,11,15,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--edge)}
.top .in{display:flex;align-items:center;gap:1rem;height:4.4rem}
.brand{display:flex;align-items:center;flex:0 0 auto;color:var(--ink);text-decoration:none;margin-inline-end:auto}
.logo{flex:0 0 auto;width:2.6rem;height:2.6rem;margin-inline-end:.8rem;display:flex;align-items:center;justify-content:center;color:var(--void);
background:var(--lime);transform:skewX(var(--sk));box-shadow:0 0 1.2rem rgba(200,255,61,.25)}
.logo{background:#0c0b0f;transform:none;border:1px solid var(--edge2);overflow:hidden}.logo img{display:block;width:100%;height:100%}
.name{display:block;font-size:1.35rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;line-height:1.05;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.name b{color:var(--lime);font-weight:900}
.meta{display:flex;align-items:center;margin-top:.25rem}
.ver{color:var(--void);background:var(--ember);font-size:.7rem;font-weight:800;padding:0 .5em;margin-inline-end:.6em;letter-spacing:.06em;transform:skewX(var(--sk));line-height:1.45}
.by{color:var(--mute);font-size:.74rem;direction:ltr;unicode-bidi:isolate;white-space:nowrap;line-height:1.2}
.links{display:flex;align-items:center;gap:.1rem;margin-inline-start:auto}
.top.compact .links{display:none}
.links a{color:var(--ink2);text-decoration:none;font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:.5rem .45rem;white-space:nowrap}
.links a:hover{color:var(--lime)}
#langbox{position:relative}
#langbtn .flag{display:inline-block;width:1.35rem;height:.9rem;line-height:0}
.flag svg{width:100%;height:100%;display:block}
#langbtn .chev{width:.7rem;height:.7rem}
#langlist{display:none;position:absolute;inset-inline-end:0;top:calc(100% + .6rem);z-index:60;width:25rem;max-width:calc(100vw - 2rem);padding:.6rem;
grid-template-columns:1fr 1fr;gap:.3rem;background:var(--deck);border:2px solid var(--lime);box-shadow:0 1.2rem 2.5rem rgba(0,0,0,.75)}
#langlist.show{display:grid}
.langopt{position:relative;z-index:0;display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.6rem;padding:.2rem .9rem;font:inherit;font-size:.95rem;font-weight:700;
color:var(--ink);background:none;border:0;cursor:pointer;text-align:start}
.langopt:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--void);border:2px solid var(--edge)}
.langopt:hover:before,.langopt:focus-visible:before{border-color:var(--lime)}
.langopt.on{color:var(--void)}.langopt.on:before{background:var(--lime);border-color:var(--lime)}
.langopt .flag{width:1.35rem;height:.9rem;flex:0 0 auto}
/* ---------- section scaffolding ---------- */
section{padding:4.5rem 0}
.band{background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.008));border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
h2{display:flex;align-items:center;margin:0 0 .6rem;font-size:1.65rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
h2:before{content:"";flex:0 0 auto;width:.6rem;height:.6rem;margin-inline-end:.8rem;background:var(--ember);transform:rotate(45deg)}
h2:after{content:"";flex:1;height:1px;margin-inline-start:1.1rem;background:linear-gradient(90deg,var(--edge2),transparent)}
[dir=rtl] h2:after{background:linear-gradient(270deg,var(--edge2),transparent)}
.sec-lead{margin:0 0 2rem;color:var(--ink2);max-width:46rem}
h3{margin:0 0 .4rem;font-size:1.1rem;font-weight:800;line-height:1.3}
p{margin:0 0 .8rem}
.panel{position:relative;min-width:0;padding:1.25rem 1.4rem 1.3rem;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 6rem),var(--deck);
border:1px solid var(--edge);border-inline-start:4px solid var(--ember);clip-path:polygon(0 0,calc(100% - 1.1rem) 0,100% 1.1rem,100% 100%,0 100%)}
[dir=rtl] .panel{clip-path:polygon(1.1rem 0,100% 0,100% 100%,0 100%,0 1.1rem)}
.panel.lime{border-inline-start-color:var(--lime)}
.panel.muted{border-inline-start-color:var(--edge2)}
.panel p:last-child,.panel ul:last-child,.panel ol:last-child{margin-bottom:0}
.k{color:var(--mute)}
ul.ticks,ol.steps-sm{margin:0;padding:0;list-style:none}
ul.ticks li{position:relative;padding-inline-start:1.4rem;margin:.45rem 0}
ul.ticks li:before{content:"";position:absolute;inset-inline-start:.15rem;top:.62em;width:.42rem;height:.42rem;background:var(--lime);transform:rotate(45deg)}
ul.ticks.ember li:before{background:var(--ember)}
/* ---------- hero ---------- */
.hero{padding:3.5rem 0 4rem}
.hero .in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3rem;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.2rem}
.tag{display:inline-block;padding:.2rem .8rem;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transform:skewX(var(--sk));line-height:1.5}
.tag.beta{color:var(--lime);border:2px solid rgba(200,255,61,.6);background:rgba(200,255,61,.07)}
.tag.v{color:var(--void);background:var(--ember);border:2px solid var(--ember);direction:ltr;text-transform:none}
h1{margin:0 0 1.2rem;font-size:3.1rem;font-weight:900;line-height:1.06;letter-spacing:.01em;text-transform:uppercase}
h1 .hl{display:block;margin-top:.5rem;color:var(--lime);font-size:.56em;letter-spacing:.06em;line-height:1.2}
.lead{font-size:1.07rem;color:var(--ink2);max-width:36rem;margin-bottom:1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.6rem}
.cta .btn{min-height:3.2rem;font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.chips li{padding:.25rem .75rem;font-size:.82rem;font-weight:700;color:var(--ink2);background:var(--deck);border:1px solid var(--edge2)}
.shot{margin:0}
.frame{position:relative;padding:.55rem;background:var(--deck);border:1px solid var(--edge2);border-inline-start:4px solid var(--lime);
clip-path:polygon(0 0,calc(100% - 1.4rem) 0,100% 1.4rem,100% 100%,0 100%);box-shadow:0 1.5rem 4rem rgba(0,0,0,.55)}
[dir=rtl] .frame{clip-path:polygon(1.4rem 0,100% 0,100% 100%,0 100%,0 1.4rem)}
.frame img{display:block;width:100%;height:auto}
.hero-shot .frame{box-shadow:0 0 0 1px rgba(200,255,61,.08),0 2rem 5rem rgba(0,0,0,.6),0 0 6rem rgba(255,106,43,.08)}
figcaption{margin-top:.7rem;font-size:.85rem;color:var(--mute)}
/* ---------- flow ---------- */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:.9rem;margin-bottom:1.6rem}
.node{display:flex;flex-direction:column;align-items:flex-start}
.node .ic,.feat .ic{display:flex;align-items:center;justify-content:center;width:2.9rem;height:2.9rem;margin-bottom:.9rem;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.node .ic svg,.feat .ic svg{width:1.6rem;height:1.6rem;transform:skewX(calc(var(--sk)*-1))}
.node.mid .ic{background:var(--ember)}
.node p{color:var(--ink2);margin:0}
.flow .arrow{display:flex;align-items:center;color:var(--lime)}
.flow .arrow svg{width:2.2rem;height:2.2rem}
[dir=rtl] .flow .arrow svg{transform:scaleX(-1)}
.new{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem 1.4rem;align-items:start}
.new h3{grid-column:1;margin:0;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);white-space:nowrap;padding-top:.45rem}
.new ul{grid-column:2}
.new .note{grid-column:2;margin:.5rem 0 0;color:var(--warn);font-weight:700}
/* ---------- features ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
.feat p{color:var(--ink2);margin:0}
.limits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1rem;margin-top:1.1rem}
.hp{display:flex;align-items:center;gap:1.1rem}.hp p{margin:0;color:var(--ink2)}
.hp .ic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:2.9rem;height:2.9rem;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.hp .ic svg{width:1.6rem;height:1.6rem;transform:skewX(calc(var(--sk)*-1))}
.limits h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
/* ---------- compat ---------- */
.pill{display:inline-block;margin-bottom:.8rem;padding:.12rem .7rem;font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transform:skewX(var(--sk))}
.pill.ok{color:var(--void);background:var(--lime)}
.pill.no{color:var(--ink2);border:2px solid var(--edge2)}
.pill.exp{color:var(--void);background:var(--ember)}
.compat p{color:var(--ink2);margin:0}
.req{margin-top:1.1rem}
.req h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
/* ---------- install ---------- */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps>li{position:relative;counter-increment:s;padding-inline-start:4.2rem;margin-bottom:1.1rem}
.steps>li:before{content:counter(s);position:absolute;inset-inline-start:0;top:.2rem;width:2.9rem;height:2.9rem;display:flex;align-items:center;justify-content:center;
font-size:1.35rem;font-weight:900;color:var(--void);background:var(--lime);transform:skewX(var(--sk))}
.steps>li:not(:last-child):after{content:"";position:absolute;inset-inline-start:1.45rem;top:3.5rem;bottom:-1.1rem;width:2px;background:linear-gradient(var(--edge2),transparent)}
.steps .panel p{color:var(--ink2)}
.code{display:flex;align-items:stretch;margin-top:.8rem;background:var(--void);border:1px solid var(--edge2);direction:ltr}
.code pre{flex:1;min-width:0;margin:0;padding:.75rem 1rem;overflow-x:auto;font:600 .92rem/1.5 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;color:var(--lime)}
.code pre code{all:unset;font:inherit;white-space:pre}
.copy{flex:0 0 auto;min-width:6rem;padding:0 1rem;font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--card);border:0;border-inline-start:1px solid var(--edge2);cursor:pointer}
.copy:hover,.copy:focus-visible{color:var(--void);background:var(--lime);outline:none}
.copy.done{color:var(--void);background:var(--lime)}
/* ---------- screenshots ---------- */
.shots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.24fr);gap:1.2rem;align-items:start}
.shots .frame{padding:.4rem}
/* ---------- help ---------- */
.callout{margin-bottom:1.6rem;color:var(--ink2)}
.faq{display:grid;gap:.6rem;margin-bottom:1.6rem}
details{background:var(--deck);border:1px solid var(--edge);border-inline-start:4px solid var(--edge2)}
details[open]{border-inline-start-color:var(--lime)}
summary{display:flex;align-items:center;gap:1rem;padding:.95rem 1.2rem;font-weight:800;font-size:1.03rem;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"";flex:0 0 auto;width:.55rem;height:.55rem;margin-inline-start:auto;border-right:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(45deg);transition:transform .15s}
details[open] summary:after{transform:rotate(-135deg)}
summary:hover{color:var(--lime)}
summary:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
details p{margin:0;padding:0 1.2rem 1.1rem;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1rem}
.grid2 h3{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);margin-bottom:.8rem}
ol.num{margin:0 0 .8rem;padding:0;list-style:none;counter-reset:n}
ol.num li{position:relative;counter-increment:n;padding-inline-start:2.1rem;margin:.55rem 0;color:var(--ink2)}
ol.num li:before{content:counter(n);position:absolute;inset-inline-start:0;top:.1rem;width:1.45rem;height:1.45rem;display:flex;align-items:center;justify-content:center;
font-size:.8rem;font-weight:900;color:var(--void);background:var(--ember);transform:skewX(var(--sk))}
.usage{margin-top:1.4rem}
.usage li{color:var(--ink2)}
.report ul{margin-bottom:1.2rem;color:var(--ink2)}
.report .btn{margin-top:.2rem}
/* ---------- CTA + footer ---------- */
.ctabox{text-align:center;padding:3rem 2rem;border-inline-start-color:var(--lime)}
.ctabox h2{justify-content:center;font-size:2rem;letter-spacing:.08em;margin-bottom:.4rem}
.ctabox h2:before,.ctabox h2:after{display:none}
.ctabox .hl{display:block;color:var(--lime);font-size:1.2rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem}
.ctabox .cta{justify-content:center;margin:1.4rem 0 0}
footer{padding:2.5rem 0 3rem;border-top:2px solid var(--edge);margin-top:0;color:var(--mute);font-size:.88rem}
footer .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem}
footer .fb{display:flex;align-items:center;gap:.8rem}
footer .logo{width:2rem;height:2rem;margin:0}
footer nav{display:flex;flex-wrap:wrap;gap:1.2rem}
footer nav a{color:var(--ink2);text-decoration:none;font-weight:700}
footer nav a:hover{color:var(--lime)}
.ltr{direction:ltr;unicode-bidi:isolate}
/* ---------- scripts without caps / letter-spacing ---------- */
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .links a,[dir=rtl] .btn,[dir=rtl] .tag,[dir=rtl] .pill,[dir=rtl] .new h3,[dir=rtl] .limits h3,[dir=rtl] .req h3,[dir=rtl] .grid2 h3,[dir=rtl] .copy,[dir=rtl] .ctabox .hl,
html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] .links a,html[lang=ja] .btn,html[lang=ja] .tag,html[lang=ja] .pill,html[lang=ja] .new h3,html[lang=ja] .limits h3,html[lang=ja] .req h3,html[lang=ja] .grid2 h3,html[lang=ja] .ctabox .hl,
html[lang=zh] h1,html[lang=zh] h2,html[lang=zh] .links a,html[lang=zh] .btn,html[lang=zh] .tag,html[lang=zh] .pill,html[lang=zh] .new h3,html[lang=zh] .limits h3,html[lang=zh] .req h3,html[lang=zh] .grid2 h3,html[lang=zh] .ctabox .hl{letter-spacing:0}
html[lang=ja] h1,html[lang=zh] h1{line-height:1.25;text-transform:none}
html[lang=ja] .ctabox h2,html[lang=zh] .ctabox h2,html[lang=ja] .ctabox .hl,html[lang=zh] .ctabox .hl{text-transform:none}
html[lang=ru] h1,html[lang=de] h1{font-size:2.7rem}
[dir=rtl] h1{line-height:1.2}
/* ---------- responsive ---------- */
@media (max-width:1100px){.links{display:none}}
@media (max-width:980px){
 .hero .in{grid-template-columns:minmax(0,1fr);gap:2.4rem}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
 html{font-size:15px}
 .in{padding:0 1.1rem}
 section{padding:3.2rem 0}
 .top .in{height:4rem;gap:.5rem}
 .by{display:none}
 .name{font-size:1.1rem;letter-spacing:.16em}
 .logo{width:2.2rem;height:2.2rem;margin-inline-end:.6rem}
 .nav-dl{display:none}
 #langbtn .lbl{display:none}
 #langbtn{padding:.25rem .9rem}
 h1{font-size:2.15rem}
 html[lang=ru] h1,html[lang=de] h1{font-size:1.9rem}
 h2{font-size:1.3rem;letter-spacing:.1em}
 .cta .btn{flex:1 1 100%;white-space:normal;text-align:center}
 .btn{max-width:100%}
 .flow{grid-template-columns:minmax(0,1fr)}
 .flow .arrow{justify-content:center;transform:rotate(90deg);height:1.6rem}
 [dir=rtl] .flow .arrow{transform:rotate(90deg)}
 .new{grid-template-columns:minmax(0,1fr)}
 .new h3,.new ul,.new .note{grid-column:1}
 .grid3,.limits,.grid2{grid-template-columns:minmax(0,1fr)}
 .shots{grid-template-columns:minmax(0,1fr)}
 .shots figure:last-child{max-width:none;justify-self:center;width:70%}
 .steps>li{padding-inline-start:3.4rem}
 .steps>li:before{width:2.4rem;height:2.4rem;font-size:1.15rem}
 .steps>li:not(:last-child):after{inset-inline-start:1.2rem;top:3rem}
 .ctabox{padding:2.2rem 1.2rem}
 .ctabox h2{font-size:1.5rem}
 code{white-space:normal;overflow-wrap:anywhere}
 .code pre{white-space:pre-wrap;overflow-wrap:anywhere}
 .code pre code{white-space:pre-wrap}
 .steps .cta .btn{flex:0 1 auto}
 footer .in{flex-direction:column;align-items:flex-start}
}
</style>

var STR={"en":{"intro":"HearBridge PS5 is a payload (ELF) that streams the console's audio over the PS5's own Bluetooth to regular Bluetooth headphones or speakers. You control it from a web page served by the console. It doesn't touch games, the firmware or the jailbreak.","limHp":"Tested with Sony WF-1000XM6, OnePlus Buds Ace 2 and Xbox Wireless Headset.","req1":"A jailbroken PS5 with an ELF loader listening on port **9021** (elfldr).","req2":"Bluetooth headphones or a speaker with **A2DP** (SBC).","testedNote":"Tested on PS5 CFI-10xx (Marvell/NXP) and PS5 Slim CFI-2008 (MediaTek). Reports from other models are welcome.","log1":"Send an FTP server payload (for example [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) with the same loader you use for HearBridge.","log2":"Connect with FileZilla to the console's IP on the port the server shows (ftpsrv usually uses **2121**).","log3":"Download `/data/hearbridge/hearbridge.log` and `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` is also at `http://<console-ip>:8090/api/diag`.","notesData":"Settings, saved devices and the log are in `/data/hearbridge/` (`hearbridge.log` records every step).","r1":"the console model (CFI number, e.g. CFI-1016A)","r2":"the firmware version","r3":"the loader you used","r4":"whether the starting notification appeared","r5":"whether the page opens, and what **Chip** shows in **Details**","r6":"the log files (`hearbridge.log`, `diag.txt`)","language":"Language","navFeatures":"Features","navCompat":"Compatibility","navInstall":"Install","navHelp":"Troubleshooting","btnDownload":"Download latest release","btnDownloadShort":"Download","btnGithub":"View on GitHub","btnReport":"Report a problem","btnHowto":"How to install","beta":"Beta","h1a":"Bluetooth headphones for a jailbroken PS5","h1b":"Game and system audio, no dongle.","heroCap":"The control page on a TV.","featTitle":"Features","limTitle":"Limits","lim1":"SBC only (no AAC, aptX or LDAC), one headset at a time, no microphone.","lim2":"The TV keeps playing sound too.","lim3":"Run only one payload that uses Bluetooth at a time. The DualSense keeps working.","compatTitle":"Compatibility","reqTitle":"Requirements","installTitle":"Install and run","s1T":"Download the ELF","s1D":"Download **HearBridge-PS5-1.3.0.elf** from the [latest release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Send it to the loader on port 9021","s2D":"Send the file to the console's loader, for example:","s3T":"Open the control page","s3D":"Open this address in the PS5 browser, on a phone or on a PC, or open the **HearBridge** tile that is added to the home screen on first run:","s4T":"Pair the headphones","s5T":"Update or stop","s5D":"Closing the page leaves HearBridge running. Sending the ELF again replaces the running copy. **Stop HearBridge** ends it.","copy":"Copy","copied":"Copied","shotsTitle":"Screenshots","shotPhone":"On a phone","helpTitle":"Troubleshooting","q1":"No HearBridge icon on the home screen","a1":"The icon is added again on every run, so run the ELF once more. The page also works without it at `http://<console-ip>:8090`.","q2":"The page does not open","a2":"Use the console's IP address and port 8090, from a device on the same network.","q3":"Headphones are not found when you press Scan","a3":"Hold the pair button until the light flashes fast, then press **Scan for devices** again.","q4":"No sound although the headphones are connected","a4":"Check that **Mute** is off and try **Test tone** in **Sound & games**. If there is still no sound, get the log and open an issue.","q5":"Nothing happens when I send the ELF","a5":"You should see the **\"HearBridge 1.3.0: starting\"** notification. If not, the loader did not run it.","logTitle":"Get the log","reportTitle":"Report a problem","reportIntro":"Open a GitHub issue and include:","footRel":"Releases","footIss":"Issues","footLic":"License","footSrc":"Source code","chipNote":"One file works on both Bluetooth chips. HearBridge finds ole or the device you're browsing from."},"ar":{"intro":"HearBridge PS5 حمولة (ELF) تنقل صوت الجهاز عبر بلوتوث PS5 المدمج إلى سماعات أو مكبرات بلوتوث عادية. تتحكم بها من صفحة ويب يقدمها الجهاز. لا تغيّر الألعاب ولا البرنامج الثابت ولا كسر الحماية.","limHp":"تم الاختبار مع Sony WF-1000XM6 وOnePlus Buds Ace 2 وXbox Wireless Headset.","req1":"جهاز PS5 مكسور الحماية مع محمّل ELF يستمع على المنفذ **9021** (elfldr).","req2":"سماعات أو مكبر صوت بلوتوث يدعم **A2DP** (SBC).","testedNote":"جُرّب على PS5 CFI-10xx (Marvell/NXP) وPS5 Slim CFI-2008 (MediaTek). نرحب بتقارير الطرازات الأخرى.","log1":"أرسل حمولة خادم FTP (مثل [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) عبر المحمّل نفسه الذي تستخدمه لـ HearBridge.","log2":"اتصل باستخدام FileZilla بعنوان IP الخاص بالجهاز على المنفذ الذي يعرضه الخادم (يستخدم ftpsrv عادةً المنفذ **2121**).","log3":"نزّل `/data/hearbridge/hearbridge.log` و`/data/hearbridge/diag.txt`.","logDiag":"يتوفر `diag.txt` أيضًا على `http://<console-ip>:8090/api/diag`.","notesData":"الإعدادات والأجهزة المحفوظة والسجل موجودة في `/data/hearbridge/` (يسجّل `hearbridge.log` كل خطوة).","r1":"طراز الجهاز (رقم CFI، مثل CFI-1016A)","r2":"إصدار النظام","r3":"المحمّل الذي استخدمته","r4":"هل ظهر إشعار البدء","r5":"هل تفتح الصفحة، وماذا تعرض **الشريحة** في **التفاصيل**","r6":"ملفات السجل (`hearbridge.log` و`diag.txt`)","language":"اللغة","navFeatures":"الميزات","navCompat":"التوافق","navInstall":"التثبيت","navHelp":"حل المشكلات","btnDownload":"تنزيل أحدث إصدار","btnDownloadShort":"تنزيل","btnGithub":"عرض على GitHub","btnReport":"الإبلاغ عن مشكلة","btnHowto":"طريقة التثبيت","beta":"بيتا","h1a":"سماعات بلوتوث لجهاز PS5 مكسور الحماية","h1b":"صوت الألعاب والنظام، بدون دونجل.","heroCap":"صفحة التحكم على التلفاز.","featTitle":"الميزات","limTitle":"القيود","lim1":"SBC فقط (بلا AAC أو aptX أو LDAC)، سماعة واحدة في كل مرة، بلا ميكروفون.","lim2":"يستمر التلفاز أيضًا في تشغيل الصوت.","lim3":"شغّل حمولة واحدة فقط تستخدم البلوتوث في كل مرة. ويستمر DualSense في العمل.","compatTitle":"التوافق","reqTitle":"المتطلبات","installTitle":"التثبيت والتشغيل","s1T":"نزّل ملف ELF","s1D":"نزّل **HearBridge-PS5-1.3.0.elf** من [أحدث إصدار](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"أرسله إلى المحمّل على المنفذ 9021","s2D":"أرسل الملف إلى محمّل الجهاز، مثلًا:","s3T":"افتح صفحة التحكم","s3D":"افتح هذا العنوان في متصفح PS5 أو على هاتف أو حاسوب، أو افتح مربع **HearBridge** الذي يُضاف إلى الشاشة الرئيسية عند التشغيل الأول:","s4T":"أقرن السماعات","s5T":"التحديث أو الإيقاف","s5D":"إغلاق الصفحة يُبقي HearBridge يعمل. إرسال ملف ELF مرة أخرى يستبدل النسخة العاملة. **إيقاف HearBridge** يُنهيه.","copy":"نسخ","copied":"تم النسخ","shotsTitle":"لقطات الشاشة","shotPhone":"على الهاتف","helpTitle":"حل المشكلات","q1":"لا تظهر أيقونة HearBridge في الشاشة الرئيسية","a1":"تُضاف الأيقونة من جديد في كل تشغيل، لذا شغّل ملف ELF مرة أخرى. الصفحة تعمل أيضًا بدونها على `http://<console-ip>:8090`.","q2":"الصفحة لا تفتح","a2":"استخدم عنوان IP للجهاز والمنفذ 8090، من جهاز على الشبكة نفسها.","q3":"لا يتم العثور على السماعات عند الضغط على البحث","a3":"اضغط مطولا على زر الاقتران حتى يومض الضوء بسرعة، ثم اضغط **البحث عن أجهزة** مرة أخرى.","q4":"لا يوجد صوت مع أن السماعات متصلة","a4":"تأكد أن **كتم** متوقف وجرّب **نغمة اختبار** في **الصوت والألعاب**. إذا بقي الصوت غائبا، نزّل السجل وافتح بلاغا.","q5":"لا يحدث شيء عند إرسال ملف ELF","a5":"يجب أن يظهر إشعار **\"HearBridge 1.3.0: starting\"**. إن لم يظهر، فالمحمّل لم يشغّلها.","logTitle":"الحصول على السجل","reportTitle":"الإبلاغ عن مشكلة","reportIntro":"افتح بلاغًا (issue) على GitHub وأرفق:","footRel":"الإصدارات","footIss":"البلاغات","footLic":"الترخيص","footSrc":"الشيفرة المصدرية","chipNote":"ملف واحد يعمل مع شريحتي البلوتوث. يتعرف HearBridge على الشريحة وحده ويعرضها في **التفاصيل**. [ما الشريحة التي لدي؟](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"افتح **الإعدادات** ثم **السماعات**. ضع السماعات في وضع الاقتران، واضغط **البحث عن أجهزة** (حوالي 12 ثانية)، ثم **اتصال**.","setTitle":"قائمة الإعدادات","shotSet":"الإعدادات: الصوت والألعاب","fHs":"**السماعة:** نسبة البطارية (تُقرأ عبر وصلة اليدين الحرتين)، والإشارة وجودة الاتصال. **تبديل السماعة** ينتقل إلى سماعة محفوظة أخرى بلمسة واحدة.","fSnd":"**الصوت:** معادل من 5 نطاقات مع إعدادات جاهزة، وتعزيز حتى 500 %، ومستوى صوت السماعة يتبع أزرارها، و**كتم** و**الوضع الليلي** (انفجارات أهدأ وأصوات أوضح).","fCon":"**الاتصال:** الترميز وشريط زمن الاستجابة من 40 إلى 200 مللي ثانية مع تقدير مباشر للتأخير.","fCodec":"**الترميزات:** **تلقائي** هو SBC العادي ويعمل مع كل شيء. يمكن اختيار **SBC HQ** و**SBC-XQ** يدويا عندما تدعمهما السماعة.","fLog":"**السجل:** كل خطوة بلون: الأخضر نجح، والأحمر فشل، والأزرق لضغطاتك.","fGame":"**ملفات الألعاب:** شغّل لعبة واضبط الصوت الذي تحبه واحفظه. تُحفظ الملفات لكل لعبة ولكل سماعة، وتعمل تلقائيا عند بدء اللعبة وتعيد صوتك المعتاد عند إغلاقها. **تحديث ملف اللعبة** في لوحة الصوت يحفظ تغييراتك.","fAuto":"**الاتصال التلقائي ووضع الراحة:** تتصل السماعات المحفوظة وحدها عند تشغيلها أو إخراجها من العلبة. قبل وضع الراحة يوقف HearBridge السماعة بشكل نظيف ويعيد توصيلها بعد الاستيقاظ.","setHome":"**الرئيسية:** العودة إلى الصفحة الرئيسية.","setHs":"**السماعات:** البحث والاتصال وقطع الاتصال والنسيان.","setSnd":"**الصوت والألعاب:** نغمة اختبار وصوت نظيف و**التالي/السابق في السماعة يغيّر الصوت** (للسماعات بلا أزرار صوت) وألعابك المحفوظة.","setDet":"**التفاصيل:** التنسيق والبطارية وAVRCP وتفصيل زمن الاستجابة وشريحة البلوتوث.","setBk":"**النسخ الاحتياطي والاستعادة:** السماعات المحفوظة مع اقترانها والإعدادات وملفات الألعاب في ملف واحد، على وحدة USB أو الجهاز أو الجهاز الذي تتصفح منه."},"es":{"intro":"HearBridge PS5 es un payload (ELF) que envía el audio de la consola por el Bluetooth propio de la PS5 a auriculares o altavoces Bluetooth normales. Se controla desde una página web que sirve la consola. No toca los juegos, el firmware ni el jailbreak.","limHp":"Probado con Sony WF-1000XM6, OnePlus Buds Ace 2 y Xbox Wireless Headset.","req1":"Una PS5 con jailbreak y un cargador de ELF escuchando en el puerto **9021** (elfldr).","req2":"Auriculares o un altavoz Bluetooth con **A2DP** (SBC).","testedNote":"Probado en PS5 CFI-10xx (Marvell/NXP) y PS5 Slim CFI-2008 (MediaTek). Se agradecen informes de otros modelos.","log1":"Envía un payload de servidor FTP (por ejemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con el mismo cargador que usas para HearBridge.","log2":"Conéctate con FileZilla a la IP de la consola en el puerto que muestra el servidor (ftpsrv suele usar el **2121**).","log3":"Descarga `/data/hearbridge/hearbridge.log` y `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` también está en `http://<console-ip>:8090/api/diag`.","notesData":"Los ajustes, los dispositivos guardados y el registro están en `/data/hearbridge/` (`hearbridge.log` registra cada paso).","r1":"el modelo de la consola (número CFI, p. ej. CFI-1016A)","r2":"la versión del firmware","r3":"el cargador que usaste","r4":"si apareció la notificación de inicio","r5":"si la página abre y qué muestra **Chip** en **Detalles**","r6":"los archivos de registro (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Funciones","navCompat":"Compatibilidad","navInstall":"Instalación","navHelp":"Solución de problemas","btnDownload":"Descargar la última versión","btnDownloadShort":"Descargar","btnGithub":"Ver en GitHub","btnReport":"Informar de un problema","btnHowto":"Cómo instalarlo","beta":"Beta","h1a":"Auriculares Bluetooth para una PS5 con jailbreak","h1b":"Audio de juegos y del sistema, sin adaptador.","heroCap":"La página de control en una TV.","featTitle":"Funciones","limTitle":"Limitaciones","lim1":"Solo SBC (sin AAC, aptX ni LDAC), un auricular a la vez, sin micrófono.","lim2":"El televisor también sigue sonando.","lim3":"Ejecuta solo un payload que use Bluetooth a la vez. El DualSense sigue funcionando.","compatTitle":"Compatibilidad","reqTitle":"Requisitos","installTitle":"Instalación y ejecución","s1T":"Descarga el ELF","s1D":"Descarga **HearBridge-PS5-1.3.0.elf** de la [última versión](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envíalo al cargador en el puerto 9021","s2D":"Envía el archivo al cargador de la consola, por ejemplo:","s3T":"Abre la página de control","s3D":"Abre esta dirección en el navegador de la PS5, en un móvil o en un PC, o abre el icono **HearBridge** que se añade a la pantalla de inicio la primera vez:","s4T":"Empareja los auriculares","s5T":"Actualizar o detener","s5D":"Cerrar la página deja HearBridge funcionando. Enviar el ELF de nuevo reemplaza la copia en marcha. **Detener HearBridge** lo termina.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas","shotPhone":"En un móvil","helpTitle":"Solución de problemas","q1":"No aparece el icono de HearBridge en la pantalla de inicio","a1":"El icono se vuelve a añadir en cada ejecución, así que ejecuta el ELF otra vez. La página también funciona sin él en `http://<console-ip>:8090`.","q2":"La página no se abre","a2":"Usa la IP de la consola y el puerto 8090, desde un dispositivo en la misma red.","q3":"No se encuentran los auriculares al pulsar Buscar","a3":"Mantén pulsado el botón de emparejamiento hasta que la luz parpadee rápido y vuelve a pulsar **Buscar dispositivos**.","q4":"No hay sonido aunque los auriculares están conectados","a4":"Comprueba que **Silenciar** está desactivado y prueba **Tono de prueba** en **Sonido y juegos**. Si sigue sin sonar, consigue el log y abre un issue.","q5":"No pasa nada al enviar el ELF","a5":"Deberías ver la notificación **\"HearBridge 1.3.0: starting\"**. Si no, el cargador no lo ejecutó.","logTitle":"Obtener el registro","reportTitle":"Informar de un problema","reportIntro":"Abre una incidencia en GitHub e incluye:","footRel":"Versiones","footIss":"Incidencias","footLic":"Licencia","footSrc":"Código fuente","chipNote":"Un solo archivo funciona con los dos chips Bluetooth. HearBridge detecta el chip solo y lo muestra en **Detalles**. [¿Qué chip tengo?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Abre **Ajustes** y luego **Auriculares**. Pon los auriculares en modo de emparejamiento, pulsa **Buscar dispositivos** (unos 12 s) y después **Conectar**.","setTitle":"Menú de ajustes","shotSet":"Ajustes: Sonido y juegos","fHs":"**Auriculares:** porcentaje de batería (leído por el enlace manos libres), señal y calidad del enlace. **Cambiar auriculares** pasa a otros auriculares guardados con un toque.","fSnd":"**Sonido:** ecualizador de 5 bandas con preajustes, refuerzo hasta 500 %, volumen de los auriculares que sigue sus botones, **Silenciar** y **Modo nocturno** (explosiones más suaves, voces más claras).","fCon":"**Conexión:** códec y un control de latencia de 40 a 200 ms con una estimación del retardo en vivo.","fCodec":"**Códecs:** **Auto** es SBC normal y funciona con todo. **SBC HQ** y **SBC-XQ** se pueden elegir a mano si los auriculares los admiten.","fLog":"**Registro:** cada paso en color: verde funcionó, rojo falló, azul para lo que pulsas.","fGame":"**Perfiles de juego:** Inicia un juego, ajusta el sonido que te guste y guárdalo. Los perfiles se guardan por juego y por auriculares, se activan solos cuando empieza el juego y devuelven tu sonido habitual al cerrarlo. **Actualizar perfil del juego** en el panel Sonido guarda tus cambios.","fAuto":"**Conexión automática y modo de reposo:** Los auriculares guardados se conectan solos al encenderlos o sacarlos del estuche. Antes del modo de reposo HearBridge desconecta los auriculares limpiamente y los vuelve a conectar al despertar.","setHome":"**Inicio:** vuelve a la página principal.","setHs":"**Auriculares:** buscar, conectar, desconectar y olvidar.","setSnd":"**Sonido y juegos:** Tono de prueba, Sonido limpio, **Siguiente/anterior del auricular cambia el volumen** (para auriculares sin teclas de volumen) y tus juegos guardados.","setDet":"**Detalles:** formato, batería, AVRCP, desglose de la latencia y el chip Bluetooth.","setBk":"**Copia y restauración:** auriculares guardados con su emparejamiento, ajustes y perfiles de juego en un archivo, en una memoria USB, la consola o el dispositivo desde el que navegas."},"fr":{"intro":"HearBridge PS5 est un payload (ELF) qui envoie le son de la console par le Bluetooth intégré de la PS5 vers un casque ou une enceinte Bluetooth ordinaire. On le contrôle depuis une page web servie par la console. Il ne touche ni aux jeux, ni au firmware, ni au jailbreak.","limHp":"Testé avec Sony WF-1000XM6, OnePlus Buds Ace 2 et Xbox Wireless Headset.","req1":"Une PS5 jailbreakée avec un chargeur ELF à l'écoute sur le port **9021** (elfldr).","req2":"Un casque ou une enceinte Bluetooth compatible **A2DP** (SBC).","testedNote":"Testé sur PS5 CFI-10xx (Marvell/NXP) et PS5 Slim CFI-2008 (MediaTek). Les retours sur d'autres modèles sont les bienvenus.","log1":"Envoyez un payload de serveur FTP (par exemple [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) avec le même chargeur que pour HearBridge.","log2":"Connectez-vous avec FileZilla à l'IP de la console, sur le port affiché par le serveur (ftpsrv utilise généralement **2121**).","log3":"Téléchargez `/data/hearbridge/hearbridge.log` et `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` est aussi sur `http://<console-ip>:8090/api/diag`.","notesData":"Les réglages, les appareils enregistrés et le journal se trouvent dans `/data/hearbridge/` (`hearbridge.log` enregistre chaque étape).","r1":"le modèle de la console (numéro CFI, par ex. CFI-1016A)","r2":"la version du firmware","r3":"le chargeur utilisé","r4":"si la notification de démarrage est apparue","r5":"si la page s'ouvre, et ce qu'affiche **Puce** dans **Détails**","r6":"les fichiers journaux (`hearbridge.log`, `diag.txt`)","language":"Langue","navFeatures":"Fonctions","navCompat":"Compatibilité","navInstall":"Installation","navHelp":"Dépannage","btnDownload":"Télécharger la dernière version","btnDownloadShort":"Télécharger","btnGithub":"Voir sur GitHub","btnReport":"Signaler un problème","btnHowto":"Comment l'installer","beta":"Bêta","h1a":"Un casque Bluetooth pour une PS5 jailbreakée","h1b":"Le son des jeux et du système, sans dongle.","heroCap":"La page de contrôle sur une TV.","featTitle":"Fonctions","limTitle":"Limites","lim1":"SBC uniquement (pas d'AAC, d'aptX ni de LDAC), un casque à la fois, pas de micro.","lim2":"La télévision continue aussi à émettre le son.","lim3":"N'exécutez qu'un seul payload utilisant le Bluetooth à la fois. La DualSense continue de fonctionner.","compatTitle":"Compatibilité","reqTitle":"Prérequis","installTitle":"Installation et lancement","s1T":"Téléchargez l'ELF","s1D":"Télécharge **HearBridge-PS5-1.3.0.elf** depuis la [dernière version](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envoyez-le au chargeur sur le port 9021","s2D":"Envoyez le fichier au chargeur de la console, par exemple :","s3T":"Ouvrez la page de contrôle","s3D":"Ouvrez cette adresse dans le navigateur de la PS5, sur un téléphone ou sur un PC, ou ouvrez la vignette **HearBridge** ajoutée à l'écran d'accueil au premier lancement :","s4T":"Appairez le casque","s5T":"Mettre à jour ou arrêter","s5D":"Fermer la page laisse HearBridge tourner. Renvoyer l'ELF remplace la copie en cours. **Arrêter HearBridge** le termine.","copy":"Copier","copied":"Copié","shotsTitle":"Captures d'écran","shotPhone":"Sur un téléphone","helpTitle":"Dépannage","q1":"Pas d'icône HearBridge sur l'écran d'accueil","a1":"L'icône est ajoutée à chaque lancement, relancez donc l'ELF. La page marche aussi sans elle sur `http://<console-ip>:8090`.","q2":"La page ne s'ouvre pas","a2":"Utilise l'adresse IP de la console et le port 8090, depuis un appareil sur le même réseau.","q3":"Le casque n'est pas trouvé lors de la recherche","a3":"Maintiens le bouton d'appairage jusqu'à ce que le voyant clignote vite, puis appuie de nouveau sur **Rechercher des appareils**.","q4":"Pas de son alors que le casque est connecté","a4":"Vérifie que **Couper le son** est désactivé et essaie **Son de test** dans **Son et jeux**. S'il n'y a toujours rien, récupère le log et ouvre une issue.","q5":"Rien ne se passe quand j'envoie l'ELF","a5":"Tu dois voir la notification **\"HearBridge 1.3.0: starting\"**. Sinon, le chargeur ne l'a pas lancé.","logTitle":"Récupérer le journal","reportTitle":"Signaler un problème","reportIntro":"Ouvrez un ticket GitHub en indiquant :","footRel":"Versions","footIss":"Tickets","footLic":"Licence","footSrc":"Code source","chipNote":"Un seul fichier fonctionne avec les deux puces Bluetooth. HearBridge détecte la puce tout seul et l'affiche dans **Détails**. [Quelle puce ai-je ?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Ouvre **Réglages**, puis **Casques**. Mets le casque en mode appairage, appuie sur **Rechercher des appareils** (environ 12 s), puis **Connecter**.","setTitle":"Menu des réglages","shotSet":"Réglages: Son et jeux","fHs":"**Casque** : batterie en pourcentage (lue par la liaison mains libres), signal et qualité de liaison. **Changer de casque** passe à un autre casque enregistré d'un seul geste.","fSnd":"**Son** : égaliseur 5 bandes avec préréglages, amplification jusqu'à 500 %, volume du casque qui suit ses boutons, **Couper le son** et **Mode nuit** (explosions plus douces, voix plus claires).","fCon":"**Connexion** : codec et un curseur de latence de 40 à 200 ms avec une estimation du délai en direct.","fCodec":"**Codecs :** **Auto** est du SBC standard et marche avec tout. **SBC HQ** et **SBC-XQ** se choisissent à la main quand le casque les prend en charge.","fLog":"**Journal** : chaque étape en couleur : vert réussi, rouge échoué, bleu pour tes actions.","fGame":"**Profils de jeu :** Lance un jeu, règle le son qui te plaît et enregistre-le. Les profils sont gardés par jeu et par casque, s'activent tout seuls au lancement du jeu et rendent ton son habituel à sa fermeture. **Mettre à jour le profil du jeu** dans le panneau Son enregistre tes changements.","fAuto":"**Connexion automatique et mode repos :** Les casques enregistrés se connectent tout seuls quand tu les allumes ou les sors de leur boîtier. Avant le mode repos, HearBridge arrête proprement le casque et le reconnecte au réveil.","setHome":"**Accueil** : retour à la page principale.","setHs":"**Casques** : rechercher, connecter, déconnecter et oublier.","setSnd":"**Son et jeux** : Son de test, Son net, **Suivant/précédent sur l'écouteur change le volume** (pour les écouteurs sans touches de volume) et tes jeux enregistrés.","setDet":"**Détails** : format, batterie, AVRCP, détail de la latence et puce Bluetooth.","setBk":"**Sauvegarde et restauration** : casques enregistrés avec leur appairage, réglages et profils de jeu dans un seul fichier, sur une clé USB, la console ou l'appareil depuis lequel tu navigues."},"de":{"intro":"HearBridge PS5 ist ein Payload (ELF), der den Ton der Konsole über das eigene Bluetooth der PS5 an normale Bluetooth-Kopfhörer oder Lautsprecher überträgt. Gesteuert wird er über eine Webseite, die die Konsole bereitstellt. Spiele, Firmware und Jailbreak bleiben unberührt.","limHp":"Getestet mit Sony WF-1000XM6, OnePlus Buds Ace 2 und Xbox Wireless Headset.","req1":"Eine gejailbreakte PS5 mit einem ELF-Loader auf Port **9021** (elfldr).","req2":"Bluetooth-Kopfhörer oder ein Lautsprecher mit **A2DP** (SBC).","testedNote":"Getestet auf PS5 CFI-10xx (Marvell/NXP) und PS5 Slim CFI-2008 (MediaTek). Berichte von anderen Modellen sind willkommen.","log1":"Sende einen FTP-Server-Payload (zum Beispiel [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) mit demselben Loader, den du für HearBridge nutzt.","log2":"Verbinde dich mit FileZilla mit der IP der Konsole auf dem Port, den der Server anzeigt (ftpsrv nutzt meist **2121**).","log3":"Lade `/data/hearbridge/hearbridge.log` und `/data/hearbridge/diag.txt` herunter.","logDiag":"`diag.txt` gibt es auch unter `http://<console-ip>:8090/api/diag`.","notesData":"Einstellungen, gespeicherte Geräte und das Log liegen in `/data/hearbridge/` (`hearbridge.log` protokolliert jeden Schritt).","r1":"dem Konsolenmodell (CFI-Nummer, z. B. CFI-1016A)","r2":"der Firmware-Version","r3":"dem verwendeten Loader","r4":"ob die Start-Benachrichtigung erschienen ist","r5":"ob sich die Seite öffnet und was unter **Chip** in **Details** steht","r6":"den Log-Dateien (`hearbridge.log`, `diag.txt`)","language":"Sprache","navFeatures":"Funktionen","navCompat":"Kompatibilität","navInstall":"Installation","navHelp":"Fehlerbehebung","btnDownload":"Neueste Version herunterladen","btnDownloadShort":"Download","btnGithub":"Auf GitHub ansehen","btnReport":"Problem melden","btnHowto":"So installierst du es","beta":"Beta","h1a":"Bluetooth-Kopfhörer für eine gejailbreakte PS5","h1b":"Spiel- und Systemton, ohne Dongle.","heroCap":"Die Steuerseite auf einem Fernseher.","featTitle":"Funktionen","limTitle":"Einschränkungen","lim1":"Nur SBC (kein AAC, aptX oder LDAC), ein Kopfhörer zur Zeit, kein Mikrofon.","lim2":"Der Fernseher gibt den Ton weiterhin aus.","lim3":"Immer nur einen Payload mit Bluetooth gleichzeitig ausführen. Der DualSense funktioniert weiter.","compatTitle":"Kompatibilität","reqTitle":"Voraussetzungen","installTitle":"Installation und Start","s1T":"ELF herunterladen","s1D":"Lade **HearBridge-PS5-1.3.0.elf** aus dem [neuesten Release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest) herunter.","s2T":"An den Loader auf Port 9021 senden","s2D":"Sende die Datei an den Loader der Konsole, zum Beispiel:","s3T":"Steuerseite öffnen","s3D":"Öffne diese Adresse im PS5-Browser, auf dem Handy oder am PC, oder öffne die Kachel **HearBridge**, die beim ersten Start zum Startbildschirm hinzugefügt wird:","s4T":"Kopfhörer koppeln","s5T":"Aktualisieren oder beenden","s5D":"Das Schließen der Seite lässt HearBridge weiterlaufen. Erneutes Senden der ELF ersetzt die laufende Kopie. **HearBridge beenden** beendet es.","copy":"Kopieren","copied":"Kopiert","shotsTitle":"Screenshots","shotPhone":"Auf dem Handy","helpTitle":"Fehlerbehebung","q1":"Kein HearBridge-Symbol auf dem Startbildschirm","a1":"Das Symbol wird bei jedem Start neu angelegt, starte die ELF also noch einmal. Die Seite funktioniert auch ohne Symbol unter `http://<console-ip>:8090`.","q2":"Die Seite öffnet sich nicht","a2":"Nutze die IP-Adresse der Konsole und Port 8090, von einem Gerät im selben Netzwerk.","q3":"Kopfhörer werden beim Suchen nicht gefunden","a3":"Halte die Kopplungstaste gedrückt, bis das Licht schnell blinkt, und drücke dann erneut **Nach Geräten suchen**.","q4":"Kein Ton, obwohl die Kopfhörer verbunden sind","a4":"Prüfe, dass **Stumm** aus ist, und probiere **Testton** unter **Klang und Spiele**. Wenn immer noch nichts zu hören ist, hol dir das Log und eröffne ein Issue.","q5":"Beim Senden der ELF passiert nichts","a5":"Du solltest die Benachrichtigung **\"HearBridge 1.3.0: starting\"** sehen. Wenn nicht, hat der Loader sie nicht gestartet.","logTitle":"Log holen","reportTitle":"Problem melden","reportIntro":"Eröffne ein GitHub-Issue mit:","footRel":"Releases","footIss":"Issues","footLic":"Lizenz","footSrc":"Quellcode","chipNote":"Eine Datei funktioniert mit beiden Bluetooth-Chips. HearBridge erkennt den Chip selbst und zeigt ihn unter **Details**. [Welchen Chip habe ich?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Öffne **Einstellungen**, dann **Kopfhörer**. Versetze die Kopfhörer in den Kopplungsmodus, drücke **Nach Geräten suchen** (etwa 12 s) und dann **Verbinden**.","setTitle":"Einstellungsmenü","shotSet":"Einstellungen: Klang und Spiele","fHs":"**Kopfhörer:** Akkustand in Prozent (über die Freisprechverbindung), Signal und Verbindungsqualität. **Kopfhörer wechseln** wechselt mit einem Tipp zu anderen gespeicherten Kopfhörern.","fSnd":"**Klang:** 5-Band-Equalizer mit Presets, Verstärkung bis 500 %, Kopfhörer-Lautstärke, die den Tasten der Kopfhörer folgt, **Stumm** und **Nachtmodus** (leisere Explosionen, klarere Stimmen).","fCon":"**Verbindung:** Codec und ein Latenzregler von 40 bis 200 ms mit Live-Schätzung der Verzögerung.","fCodec":"**Codecs:** **Auto** ist normales SBC und funktioniert mit allem. **SBC HQ** und **SBC-XQ** lassen sich von Hand wählen, wenn die Kopfhörer sie unterstützen.","fLog":"**Protokoll:** jeder Schritt in Farbe: grün hat geklappt, rot fehlgeschlagen, blau für deine Eingaben.","fGame":"**Spielprofile:** Starte ein Spiel, stell den Klang ein und speichere ihn. Profile gelten pro Spiel und pro Kopfhörer, schalten sich beim Spielstart von selbst ein und geben beim Beenden deinen normalen Klang zurück. **Spielprofil aktualisieren** im Bereich Klang speichert Änderungen.","fAuto":"**Automatisch verbinden und Ruhemodus:** Gespeicherte Kopfhörer verbinden sich von selbst, wenn du sie einschaltest oder aus dem Etui nimmst. Vor dem Ruhemodus trennt HearBridge die Kopfhörer sauber und verbindet sie nach dem Aufwachen wieder.","setHome":"**Startseite:** zurück zur Hauptseite.","setHs":"**Kopfhörer:** suchen, verbinden, trennen und vergessen.","setSnd":"**Klang und Spiele:** Testton, Klarer Klang, **Weiter/Zurück am Ohrhörer ändert die Lautstärke** (für Ohrhörer ohne Lautstärketasten) und deine gespeicherten Spiele.","setDet":"**Details:** Format, Akku, AVRCP, Aufschlüsselung der Latenz und der Bluetooth-Chip.","setBk":"**Sichern & wiederherstellen:** gespeicherte Kopfhörer samt Kopplung, Einstellungen und Spielprofile in einer Datei, auf einem USB-Stick, der Konsole oder dem Gerät, mit dem du surfst."},"pt":{"intro":"O HearBridge PS5 é um payload (ELF) que envia o áudio do console pelo Bluetooth do próprio PS5 para fones ou caixas de som Bluetooth comuns. Você controla tudo por uma página web servida pelo console. Ele não mexe nos jogos, no firmware nem no jailbreak.","limHp":"Testado com Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Um PS5 desbloqueado com um carregador de ELF escutando na porta **9021** (elfldr).","req2":"Fones ou uma caixa de som Bluetooth com **A2DP** (SBC).","testedNote":"Testado no PS5 CFI-10xx (Marvell/NXP) e no PS5 Slim CFI-2008 (MediaTek). Relatos de outros modelos são bem-vindos.","log1":"Envie um payload de servidor FTP (por exemplo [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) pelo mesmo carregador que você usa para o HearBridge.","log2":"Conecte-se com o FileZilla ao IP do console, na porta que o servidor mostra (o ftpsrv normalmente usa a **2121**).","log3":"Baixe `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` também está em `http://<console-ip>:8090/api/diag`.","notesData":"As configurações, os dispositivos salvos e o log ficam em `/data/hearbridge/` (`hearbridge.log` registra cada etapa).","r1":"o modelo do console (número CFI, ex.: CFI-1016A)","r2":"a versão do firmware","r3":"o carregador que você usou","r4":"se a notificação de início apareceu","r5":"se a página abre e o que **Chip** mostra em **Detalhes**","r6":"os arquivos de log (`hearbridge.log`, `diag.txt`)","language":"Idioma","navFeatures":"Recursos","navCompat":"Compatibilidade","navInstall":"Instalação","navHelp":"Solução de problemas","btnDownload":"Baixar a versão mais recente","btnDownloadShort":"Baixar","btnGithub":"Ver no GitHub","btnReport":"Relatar um problema","btnHowto":"Como instalar","beta":"Beta","h1a":"Fones Bluetooth para um PS5 desbloqueado","h1b":"Áudio dos jogos e do sistema, sem adaptador.","heroCap":"A página de controle numa TV.","featTitle":"Recursos","limTitle":"Limitações","lim1":"Só SBC (sem AAC, aptX ou LDAC), um fone por vez, sem microfone.","lim2":"A TV também continua tocando o som.","lim3":"Execute apenas um payload que use Bluetooth por vez. O DualSense continua funcionando.","compatTitle":"Compatibilidade","reqTitle":"Requisitos","installTitle":"Instalação e execução","s1T":"Baixe o ELF","s1D":"Baixe **HearBridge-PS5-1.3.0.elf** da [versão mais recente](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Envie-o ao carregador na porta 9021","s2D":"Envie o arquivo ao carregador do console, por exemplo:","s3T":"Abra a página de controle","s3D":"Abra este endereço no navegador do PS5, no celular ou no PC, ou abra o bloco **HearBridge** adicionado à tela inicial na primeira execução:","s4T":"Pareie os fones","s5T":"Atualizar ou parar","s5D":"Fechar a página deixa o HearBridge rodando. Enviar o ELF de novo substitui a cópia em execução. **Parar o HearBridge** encerra.","copy":"Copiar","copied":"Copiado","shotsTitle":"Capturas de tela","shotPhone":"No celular","helpTitle":"Solução de problemas","q1":"O ícone do HearBridge não aparece na tela inicial","a1":"O ícone é adicionado de novo a cada execução, então rode o ELF mais uma vez. A página também funciona sem ele em `http://<console-ip>:8090`.","q2":"A página não abre","a2":"Use o IP do console e a porta 8090, de um aparelho na mesma rede.","q3":"Os fones não são encontrados ao tocar em Procurar","a3":"Segure o botão de pareamento até a luz piscar rápido e toque em **Procurar dispositivos** de novo.","q4":"Não há som mesmo com os fones conectados","a4":"Confira se **Silenciar** está desligado e teste o **Tom de teste** em **Som e jogos**. Se ainda não houver som, pegue o log e abra uma issue.","q5":"Nada acontece quando envio o ELF","a5":"Deve aparecer a notificação **\"HearBridge 1.3.0: starting\"**. Se não, o carregador não o executou.","logTitle":"Como obter o log","reportTitle":"Relatar um problema","reportIntro":"Abra uma issue no GitHub e inclua:","footRel":"Versões","footIss":"Issues","footLic":"Licença","footSrc":"Código-fonte","chipNote":"Um só arquivo funciona com os dois chips Bluetooth. O HearBridge detecta o chip sozinho e mostra em **Detalhes**. [Qual chip eu tenho?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Abra **Definições** e depois **Fones**. Coloque os fones em modo de pareamento, toque em **Procurar dispositivos** (cerca de 12 s) e depois em **Conectar**.","setTitle":"Menu de definições","shotSet":"Definições: Som e jogos","fHs":"**Fone:** bateria em porcentagem (lida pela ligação mãos livres), sinal e qualidade da ligação. **Trocar de fone** troca para outro fone salvo com um toque.","fSnd":"**Som:** equalizador de 5 bandas com predefinições, reforço até 500 %, volume do fone que acompanha os botões dele, **Silenciar** e **Modo noturno** (explosões mais baixas, vozes mais claras).","fCon":"**Conexão:** codec e um controle de latência de 40 a 200 ms com estimativa do atraso ao vivo.","fCodec":"**Codecs:** **Auto** é SBC comum e funciona com tudo. **SBC HQ** e **SBC-XQ** podem ser escolhidos à mão quando o fone suporta.","fLog":"**Registo:** cada passo em cores: verde deu certo, vermelho falhou, azul para o que você tocou.","fGame":"**Perfis de jogo:** Abra um jogo, ajuste o som do seu jeito e salve. Os perfis ficam por jogo e por fone, ligam sozinhos quando o jogo começa e devolvem seu som de sempre quando ele fecha. **Atualizar perfil do jogo** no painel Som salva as mudanças.","fAuto":"**Conexão automática e modo de repouso:** Fones salvos conectam sozinhos quando você liga ou tira do estojo. Antes do modo de repouso o HearBridge desliga o fone de forma limpa e reconecta depois que o console acorda.","setHome":"**Início:** volta para a página principal.","setHs":"**Fones:** procurar, conectar, desconectar e esquecer.","setSnd":"**Som e jogos:** Tom de teste, Som limpo, **Próxima/anterior no fone muda o volume** (para fones sem botões de volume) e seus jogos salvos.","setDet":"**Detalhes:** formato, bateria, AVRCP, detalhamento da latência e o chip Bluetooth.","setBk":"**Cópia e restauro:** fones salvos com o pareamento, ajustes e perfis de jogo num só arquivo, num pendrive, no console ou no aparelho em que você está navegando."},"ru":{"intro":"HearBridge PS5 это payload (ELF), который передаёт звук консоли через собственный Bluetooth PS5 на обычные Bluetooth-наушники или колонки. Управление идёт через веб-страницу, которую отдаёт консоль. Игры, прошивку и джейлбрейк он не трогает.","limHp":"Проверено с Sony WF-1000XM6, OnePlus Buds Ace 2 и Xbox Wireless Headset.","req1":"Взломанная PS5 с загрузчиком ELF на порту **9021** (elfldr).","req2":"Bluetooth-наушники или колонка с поддержкой **A2DP** (SBC).","testedNote":"Проверено на PS5 CFI-10xx (Marvell/NXP) и PS5 Slim CFI-2008 (MediaTek). Отчёты о других моделях приветствуются.","log1":"Отправьте payload FTP-сервера (например, [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) тем же загрузчиком, что и HearBridge.","log2":"Подключитесь через FileZilla к IP консоли на порт, который показывает сервер (ftpsrv обычно использует **2121**).","log3":"Скачайте `/data/hearbridge/hearbridge.log` и `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` также доступен по адресу `http://<console-ip>:8090/api/diag`.","notesData":"Настройки, сохранённые устройства и журнал находятся в `/data/hearbridge/` (`hearbridge.log` записывает каждый шаг).","r1":"модель консоли (номер CFI, например CFI-1016A)","r2":"версию прошивки","r3":"какой загрузчик вы использовали","r4":"появилось ли уведомление о запуске","r5":"открывается ли страница и что показывает **Чип** в разделе **Подробности**","r6":"файлы журнала (`hearbridge.log`, `diag.txt`)","language":"Язык","navFeatures":"Возможности","navCompat":"Совместимость","navInstall":"Установка","navHelp":"Решение проблем","btnDownload":"Скачать последний релиз","btnDownloadShort":"Скачать","btnGithub":"Открыть на GitHub","btnReport":"Сообщить о проблеме","btnHowto":"Как установить","beta":"Бета","h1a":"Bluetooth-наушники для взломанной PS5","h1b":"Звук игр и системы без адаптера.","heroCap":"Страница управления на телевизоре.","featTitle":"Возможности","limTitle":"Ограничения","lim1":"Только SBC (без AAC, aptX и LDAC), одни наушники за раз, без микрофона.","lim2":"Телевизор тоже продолжает воспроизводить звук.","lim3":"Запускайте одновременно только один payload, использующий Bluetooth. DualSense продолжает работать.","compatTitle":"Совместимость","reqTitle":"Требования","installTitle":"Установка и запуск","s1T":"Скачайте ELF","s1D":"Скачайте **HearBridge-PS5-1.3.0.elf** из [последнего релиза](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Отправьте его загрузчику на порт 9021","s2D":"Отправьте файл загрузчику консоли, например:","s3T":"Откройте страницу управления","s3D":"Откройте этот адрес в браузере PS5, на телефоне или ПК, или откройте плитку **HearBridge**, которая добавляется на главный экран при первом запуске:","s4T":"Выполните сопряжение наушников","s5T":"Обновить или остановить","s5D":"Если закрыть страницу, HearBridge продолжит работать. Повторная отправка ELF заменяет запущенную копию. **Остановить HearBridge** завершает его.","copy":"Копировать","copied":"Скопировано","shotsTitle":"Скриншоты","shotPhone":"На телефоне","helpTitle":"Решение проблем","q1":"Нет значка HearBridge на главном экране","a1":"Значок добавляется заново при каждом запуске, поэтому просто запустите ELF ещё раз. Страница работает и без него по адресу `http://<console-ip>:8090`.","q2":"Страница не открывается","a2":"Используйте IP-адрес консоли и порт 8090 с устройства в той же сети.","q3":"Наушники не находятся при поиске","a3":"Удерживайте кнопку сопряжения, пока индикатор не начнёт быстро мигать, и снова нажмите **Искать устройства**.","q4":"Нет звука, хотя наушники подключены","a4":"Проверьте, что **Без звука** выключен, и попробуйте **Тестовый тон** в разделе **Звук и игры**. Если звука всё ещё нет, скачайте лог и откройте issue.","q5":"При отправке ELF ничего не происходит","a5":"Должно появиться уведомление **\"HearBridge 1.3.0: starting\"**. Если нет, загрузчик его не запустил.","logTitle":"Как получить журнал","reportTitle":"Сообщить о проблеме","reportIntro":"Создайте issue на GitHub и укажите:","footRel":"Релизы","footIss":"Issues","footLic":"Лицензия","footSrc":"Исходный код","chipNote":"Один файл работает с обоими Bluetooth-чипами. HearBridge сам определяет чип и показывает его в разделе **Подробности**. [Какой у меня чип?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Откройте **Настройки**, затем **Наушники**. Переведите наушники в режим сопряжения, нажмите **Искать устройства** (около 12 с), затем **Подключить**.","setTitle":"Меню настроек","shotSet":"Настройки: Звук и игры","fHs":"**Наушники:** заряд в процентах (через канал громкой связи), сигнал и качество связи. **Сменить наушники** переключает на другие сохранённые наушники одним нажатием.","fSnd":"**Звук:** 5-полосный эквалайзер с пресетами, усиление до 500 %, громкость наушников, которая следует их кнопкам, **Без звука** и **Ночной режим** (тише взрывы, чётче голоса).","fCon":"**Подключение:** кодек и ползунок задержки от 40 до 200 мс с живой оценкой задержки.","fCodec":"**Кодеки:** **Авто** это обычный SBC, работает со всем. **SBC HQ** и **SBC-XQ** можно выбрать вручную, если наушники их поддерживают.","fLog":"**Журнал:** каждый шаг в цвете: зелёный получилось, красный ошибка, синий ваши нажатия.","fGame":"**Профили игр:** Запустите игру, настройте звук и сохраните его. Профили хранятся для каждой игры и для каждых наушников, включаются сами при запуске игры и возвращают обычный звук, когда она закрывается. **Обновить профиль игры** на панели Звук сохраняет изменения.","fAuto":"**Автоподключение и режим покоя:** Сохранённые наушники подключаются сами, когда вы их включаете или достаёте из кейса. Перед режимом покоя HearBridge аккуратно отключает наушники и подключает их снова после пробуждения.","setHome":"**Главная:** назад на главную страницу.","setHs":"**Наушники:** поиск, подключение, отключение и удаление.","setSnd":"**Звук и игры:** Тестовый тон, Чистый звук, **Вперёд/назад на наушнике меняют громкость** (для наушников без кнопок громкости) и сохранённые игры.","setDet":"**Подробности:** формат, заряд, AVRCP, разбивка задержки и Bluetooth-чип.","setBk":"**Резервная копия:** сохранённые наушники вместе с сопряжением, настройки и профили игр в одном файле, на USB-накопителе, на консоли или на устройстве, с которого вы открыли страницу."},"ja":{"intro":"HearBridge PS5 は、本体の音を PS5 内蔵の Bluetooth で普通の Bluetooth ヘッドホンやスピーカーに送るペイロード（ELF）です。操作は本体が提供する Web ページから行います。ゲーム、ファームウェア、脱獄には手を加えません。","limHp":"Sony WF-1000XM6、OnePlus Buds Ace 2、Xbox Wireless Headset で動作確認済み。","req1":"ポート **9021** で待ち受ける ELF ローダー（elfldr）がある脱獄済み PS5。","req2":"**A2DP**（SBC）対応の Bluetooth ヘッドホンまたはスピーカー。","testedNote":"PS5 CFI-10xx（Marvell/NXP）と PS5 Slim CFI-2008（MediaTek）で動作確認済み。他のモデルの報告も歓迎します。","log1":"HearBridge と同じローダーで FTP サーバーのペイロード（例: [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）を送信します。","log2":"FileZilla で、サーバーが表示するポートを使って本体の IP に接続します（ftpsrv は通常 **2121**）。","log3":"`/data/hearbridge/hearbridge.log` と `/data/hearbridge/diag.txt` をダウンロードします。","logDiag":"`diag.txt` は `http://<console-ip>:8090/api/diag` でも見られます。","notesData":"設定、保存済みデバイス、ログは `/data/hearbridge/` にあります（`hearbridge.log` に各手順が記録されます）。","r1":"本体のモデル（CFI 番号、例: CFI-1016A）","r2":"ファームウェアのバージョン","r3":"使用したローダー","r4":"起動通知が出たかどうか","r5":"ページが開くか、**詳細** の **チップ** に何と表示されるか","r6":"ログファイル（`hearbridge.log`、`diag.txt`）","language":"言語","navFeatures":"機能","navCompat":"対応状況","navInstall":"インストール","navHelp":"トラブルシューティング","btnDownload":"最新リリースをダウンロード","btnDownloadShort":"ダウンロード","btnGithub":"GitHub で見る","btnReport":"問題を報告","btnHowto":"インストール方法","beta":"ベータ","h1a":"脱獄済み PS5 で Bluetooth ヘッドホン","h1b":"ゲームとシステムの音声を、ドングルなしで。","heroCap":"テレビで見たコントロールページ。","featTitle":"機能","limTitle":"制限事項","lim1":"SBC のみ（AAC、aptX、LDAC は非対応）、一度に一台、マイクなし。","lim2":"テレビからも音は出続けます。","lim3":"Bluetooth を使うペイロードは一度に一つだけ実行してください。DualSense はそのまま使えます。","compatTitle":"対応状況","reqTitle":"必要なもの","installTitle":"インストールと起動","s1T":"ELF をダウンロード","s1D":"[最新リリース](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest)から **HearBridge-PS5-1.3.0.elf** をダウンロードします。","s2T":"ポート 9021 のローダーに送信","s2D":"本体のローダーにファイルを送信します。例:","s3T":"操作ページを開く","s3D":"PS5 のブラウザ、スマートフォン、PC で次のアドレスを開きます。初回起動時にホーム画面に追加される **HearBridge** タイルからも開けます:","s4T":"ヘッドホンをペアリング","s5T":"更新・停止","s5D":"ページを閉じても HearBridge は動き続けます。ELF をもう一度送ると実行中のものと入れ替わります。**HearBridge を停止** で終了します。","copy":"コピー","copied":"コピーしました","shotsTitle":"スクリーンショット","shotPhone":"スマートフォン","helpTitle":"トラブルシューティング","q1":"ホーム画面に HearBridge のアイコンが出ない","a1":"アイコンは起動のたびに追加されるので、ELF をもう一度実行してください。アイコンがなくてもページは `http://<console-ip>:8090` で使えます。","q2":"ページが開かない","a2":"同じネットワーク上のデバイスから、本体の IP アドレスとポート 8090 を使ってください。","q3":"検索してもヘッドホンが見つからない","a3":"ライトが速く点滅するまでペアリングボタンを長押しし、もう一度 **デバイスを検索** を押してください。","q4":"ヘッドホンは接続されているのに音が出ない","a4":"**ミュート** がオフか確認し、**サウンドとゲーム** の **テストトーン** を試してください。それでも音が出なければ、ログを取得して issue を開いてください。","q5":"ELF を送っても何も起きない","a5":"**\"HearBridge 1.3.0: starting\"** という通知が出るはずです。出なければ、ローダーが実行していません。","logTitle":"ログの取得","reportTitle":"問題を報告","reportIntro":"GitHub の Issue を作成し、次の情報を含めてください:","footRel":"リリース","footIss":"Issue","footLic":"ライセンス","footSrc":"ソースコード","chipNote":"1 つのファイルで両方の Bluetooth チップに対応します。HearBridge がチップを自動で判別し、**詳細** に表示します。 [自分のチップはどれ？](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"**設定** を開き、**ヘッドセット** を選びます。ヘッドホンをペアリングモードにして **デバイスを検索**（約 12 秒）を押し、**接続** を押します。","setTitle":"設定メニュー","shotSet":"設定: サウンドとゲーム","fHs":"**ヘッドセット**：バッテリー残量（ハンズフリー接続で取得）、電波、リンク品質。**ヘッドセットを切り替え** で保存済みの別のヘッドセットにワンタップで切り替え。","fSnd":"**サウンド**：プリセット付き 5 バンドイコライザー、最大 500 % のブースト、ヘッドセットのボタンに追従する音量、**ミュート**、**ナイトモード**（爆発音は控えめ、声ははっきり）。","fCon":"**接続**：コーデックと 40 から 200 ms のレイテンシスライダー、遅延のライブ推定。","fCodec":"**コーデック**：**自動** は通常の SBC で、どの機器でも使えます。**SBC HQ** と **SBC-XQ** はヘッドセットが対応していれば手動で選べます。","fLog":"**ログ**：すべての手順を色分け表示。緑は成功、赤は失敗、青は自分の操作。","fGame":"**ゲームプロファイル**：ゲームを起動し、好みの音にして保存します。プロファイルはゲームごと、ヘッドセットごとに保存され、ゲーム開始時に自動で有効になり、終了するといつもの音に戻ります。サウンド パネルの **ゲームプロファイルを更新** で変更を保存します。","fAuto":"**自動接続とレストモード**：保存したヘッドセットは、電源を入れたりケースから出したりすると自動で接続します。レストモードの前に HearBridge はヘッドセットをきれいに停止し、復帰後に再接続します。","setHome":"**ホーム**：メインページに戻る。","setHs":"**ヘッドセット**：検索、接続、切断、削除。","setSnd":"**サウンドとゲーム**：テストトーン、クリアな音、**イヤホンの次へ/前へで音量を変える**（音量ボタンのないイヤホン向け）、保存したゲーム。","setDet":"**詳細**：フォーマット、バッテリー、AVRCP、レイテンシの内訳、Bluetooth チップ。","setBk":"**バックアップと復元**：保存したヘッドセット（ペアリング情報込み）、設定、ゲームプロファイルを 1 つのファイルに。USB ドライブ、本体、閲覧中のデバイスに保存できます。"},"zh":{"intro":"HearBridge PS5 是一个 payload（ELF），通过 PS5 自带的蓝牙把主机声音传到普通蓝牙耳机或音箱。你可以在主机提供的网页上控制它。它不会改动游戏、固件或越狱。","limHp":"已在 Sony WF-1000XM6、OnePlus Buds Ace 2 和 Xbox Wireless Headset 上测试。","req1":"已破解的 PS5，并有在端口 **9021** 监听的 ELF 加载器（elfldr）。","req2":"支持 **A2DP**（SBC）的蓝牙耳机或音箱。","testedNote":"已在 PS5 CFI-10xx（Marvell/NXP）和 PS5 Slim CFI-2008（MediaTek）上测试。欢迎反馈其他型号的情况。","log1":"用运行 HearBridge 的同一个加载器发送 FTP 服务器载荷（例如 [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)）。","log2":"用 FileZilla 连接主机的 IP，端口使用服务器显示的端口（ftpsrv 通常为 **2121**）。","log3":"下载 `/data/hearbridge/hearbridge.log` 和 `/data/hearbridge/diag.txt`。","logDiag":"`diag.txt` 也可以在 `http://<console-ip>:8090/api/diag` 查看。","notesData":"设置、已保存的设备和日志位于 `/data/hearbridge/`（`hearbridge.log` 记录每一步）。","r1":"主机型号（CFI 编号，例如 CFI-1016A）","r2":"固件版本","r3":"使用的加载器","r4":"是否出现了启动通知","r5":"网页能否打开，以及 **详细信息** 中 **芯片** 显示什么","r6":"日志文件（`hearbridge.log`、`diag.txt`）","language":"语言","navFeatures":"功能","navCompat":"兼容性","navInstall":"安装","navHelp":"故障排除","btnDownload":"下载最新版本","btnDownloadShort":"下载","btnGithub":"在 GitHub 上查看","btnReport":"报告问题","btnHowto":"安装方法","beta":"测试版","h1a":"为破解的 PS5 连接蓝牙耳机","h1b":"游戏和系统声音，无需适配器。","heroCap":"电视上的控制页面。","featTitle":"功能","limTitle":"限制","lim1":"仅支持 SBC（不支持 AAC、aptX 或 LDAC），一次一副耳机，没有麦克风。","lim2":"电视也会继续播放声音。","lim3":"同一时间只运行一个使用蓝牙的载荷。DualSense 照常工作。","compatTitle":"兼容性","reqTitle":"要求","installTitle":"安装与运行","s1T":"下载 ELF","s1D":"从[最新版本](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest)下载 **HearBridge-PS5-1.3.0.elf**。","s2T":"发送到端口 9021 的加载器","s2D":"将文件发送到主机的加载器，例如：","s3T":"打开控制网页","s3D":"在 PS5 浏览器、手机或电脑上打开以下地址，或打开首次运行时添加到主屏幕的 **HearBridge** 图块：","s4T":"配对耳机","s5T":"更新或停止","s5D":"关闭页面后 HearBridge 仍在运行。再次发送 ELF 会替换正在运行的副本。**停止 HearBridge** 可结束它。","copy":"复制","copied":"已复制","shotsTitle":"截图","shotPhone":"手机","helpTitle":"故障排除","q1":"主屏幕上没有 HearBridge 图标","a1":"每次运行都会重新添加图标，所以再运行一次 ELF 即可。没有图标时页面也可以在 `http://<console-ip>:8090` 打开。","q2":"网页打不开","a2":"在同一网络的设备上，使用主机的 IP 地址和端口 8090。","q3":"搜索时找不到耳机","a3":"按住配对键直到指示灯快速闪烁，然后再按一次 **搜索设备**。","q4":"耳机已连接但没有声音","a4":"确认 **静音** 已关闭，并在 **声音与游戏** 中试试 **测试音**。如果仍然没有声音，获取日志并提交 issue。","q5":"发送 ELF 后没有任何反应","a5":"应该会看到 **\"HearBridge 1.3.0: starting\"** 通知。如果没有，说明加载器没有运行它。","logTitle":"获取日志","reportTitle":"报告问题","reportIntro":"在 GitHub 上提交 issue，并附上：","footRel":"版本发布","footIss":"Issues","footLic":"许可证","footSrc":"源代码","chipNote":"同一个文件支持两种蓝牙芯片。HearBridge 会自动识别芯片，并显示在 **详细信息** 中。 [我的是哪种芯片？](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"打开 **设置**，再进入 **耳机**。让耳机进入配对模式，按 **搜索设备**（约 12 秒），然后按 **连接**。","setTitle":"设置菜单","shotSet":"设置: 声音与游戏","fHs":"**耳机**：电量百分比（通过免提链路读取）、信号和链路质量。**切换耳机** 一键切换到另一副已保存的耳机。","fSnd":"**声音**：带预设的 5 段均衡器、最高 500 % 增益、跟随耳机按键的耳机音量、**静音** 和 **夜间模式**（爆炸声更小，人声更清楚）。","fCon":"**连接**：编解码器，以及 40 到 200 ms 的延迟滑块和实时延迟估算。","fCodec":"**编解码器**：**自动** 就是普通 SBC，什么设备都能用。耳机支持时可以手动选择 **SBC HQ** 和 **SBC-XQ**。","fLog":"**日志**：每一步都有颜色：绿色成功，红色失败，蓝色是你的操作。","fGame":"**游戏配置**：启动游戏，调好你喜欢的声音并保存。配置按游戏、按耳机分别保存，游戏启动时自动生效，关闭后恢复你平时的声音。声音 面板上的 **更新游戏配置** 会保存你的修改。","fAuto":"**自动连接和休息模式**：已保存的耳机在开机或从充电盒取出时会自动连接。进入休息模式前 HearBridge 会干净地停止耳机，唤醒后重新连接。","setHome":"**主页**：回到主页面。","setHs":"**耳机**：搜索、连接、断开和忘记。","setSnd":"**声音与游戏**：测试音、纯净声音、**耳机的下一首/上一首调节音量**（适合没有音量键的耳机）以及已保存的游戏。","setDet":"**详细信息**：格式、电量、AVRCP、延迟明细和蓝牙芯片。","setBk":"**备份与恢复**：已保存的耳机（含配对信息）、设置和游戏配置都在一个文件里，可存到 U 盘、主机或你正在浏览的设备上。"},"it":{"intro":"HearBridge PS5 è un payload (ELF) che invia l'audio della console tramite il Bluetooth della PS5 a normali cuffie o altoparlanti Bluetooth. Lo controlli da una pagina web servita dalla console. Non tocca i giochi, il firmware o il jailbreak.","limHp":"Testato con Sony WF-1000XM6, OnePlus Buds Ace 2 e Xbox Wireless Headset.","req1":"Una PS5 con jailbreak e un loader ELF in ascolto sulla porta **9021** (elfldr).","req2":"Cuffie o un altoparlante Bluetooth con **A2DP** (SBC).","testedNote":"Testato su PS5 CFI-10xx (Marvell/NXP) e PS5 Slim CFI-2008 (MediaTek). Le segnalazioni su altri modelli sono benvenute.","log1":"Invia un payload server FTP (ad esempio [ftpsrv](https://github.com/ps5-payload-dev/ftpsrv)) con lo stesso loader che usi per HearBridge.","log2":"Collegati con FileZilla all'IP della console sulla porta indicata dal server (ftpsrv di solito usa la **2121**).","log3":"Scarica `/data/hearbridge/hearbridge.log` e `/data/hearbridge/diag.txt`.","logDiag":"`diag.txt` è anche su `http://<console-ip>:8090/api/diag`.","notesData":"Impostazioni, dispositivi salvati e log si trovano in `/data/hearbridge/` (`hearbridge.log` registra ogni passaggio).","r1":"il modello della console (numero CFI, ad es. CFI-1016A)","r2":"la versione del firmware","r3":"il loader usato","r4":"se è comparsa la notifica di avvio","r5":"se la pagina si apre e cosa mostra **Chip** in **Dettagli**","r6":"i file di log (`hearbridge.log`, `diag.txt`)","language":"Lingua","navFeatures":"Funzioni","navCompat":"Compatibilità","navInstall":"Installazione","navHelp":"Risoluzione dei problemi","btnDownload":"Scarica l'ultima release","btnDownloadShort":"Scarica","btnGithub":"Vedi su GitHub","btnReport":"Segnala un problema","btnHowto":"Come installarlo","beta":"Beta","h1a":"Cuffie Bluetooth per una PS5 con jailbreak","h1b":"Audio dei giochi e del sistema, senza dongle.","heroCap":"La pagina di controllo su una TV.","featTitle":"Funzioni","limTitle":"Limiti","lim1":"Solo SBC (niente AAC, aptX o LDAC), una cuffia alla volta, niente microfono.","lim2":"Anche la TV continua a riprodurre l'audio.","lim3":"Esegui un solo payload che usa il Bluetooth alla volta. Il DualSense continua a funzionare.","compatTitle":"Compatibilità","reqTitle":"Requisiti","installTitle":"Installazione e avvio","s1T":"Scarica l'ELF","s1D":"Scarica **HearBridge-PS5-1.3.0.elf** dall'[ultima release](https://github.com/X-F1REBALL-X/HearBridge-PS5/releases/latest).","s2T":"Invialo al loader sulla porta 9021","s2D":"Invia il file al loader della console, ad esempio:","s3T":"Apri la pagina di controllo","s3D":"Apri questo indirizzo nel browser della PS5, su un telefono o su un PC, oppure apri il riquadro **HearBridge** aggiunto alla schermata iniziale al primo avvio:","s4T":"Abbina le cuffie","s5T":"Aggiornare o fermare","s5D":"Chiudere la pagina lascia HearBridge in esecuzione. Inviare di nuovo l'ELF sostituisce la copia in esecuzione. **Arresta HearBridge** lo chiude.","copy":"Copia","copied":"Copiato","shotsTitle":"Screenshot","shotPhone":"Su un telefono","helpTitle":"Risoluzione dei problemi","q1":"Nessuna icona di HearBridge nella schermata iniziale","a1":"L'icona viene aggiunta a ogni avvio, quindi avvia di nuovo l'ELF. La pagina funziona anche senza icona su `http://<console-ip>:8090`.","q2":"La pagina non si apre","a2":"Usa l'indirizzo IP della console e la porta 8090, da un dispositivo sulla stessa rete.","q3":"Le cuffie non vengono trovate quando premi Cerca","a3":"Tieni premuto il tasto di associazione finché la luce lampeggia veloce, poi premi di nuovo **Cerca dispositivi**.","q4":"Nessun suono anche se le cuffie sono connesse","a4":"Controlla che **Muto** sia disattivato e prova **Tono di prova** in **Suono e giochi**. Se ancora non si sente nulla, prendi il log e apri una issue.","q5":"Non succede niente quando invio l'ELF","a5":"Dovresti vedere la notifica **\"HearBridge 1.3.0: starting\"**. Se no, il loader non l'ha avviato.","logTitle":"Ottenere il log","reportTitle":"Segnala un problema","reportIntro":"Apri una issue su GitHub indicando:","footRel":"Release","footIss":"Issue","footLic":"Licenza","footSrc":"Codice sorgente","chipNote":"Un solo file funziona con entrambi i chip Bluetooth. HearBridge riconosce il chip da solo e lo mostra in **Dettagli**. [Che chip ho?](https://github.com/X-F1REBALL-X/HearBridge-PS5#which-chip-do-i-have)","s4D":"Apri **Impostazioni**, poi **Cuffie**. Metti le cuffie in modalità di associazione, premi **Cerca dispositivi** (circa 12 s), poi **Connetti**.","setTitle":"Menu impostazioni","shotSet":"Impostazioni: Suono e giochi","fHs":"**Cuffie:** batteria in percentuale (letta tramite il collegamento vivavoce), segnale e qualità del collegamento. **Cambia cuffie** passa ad altre cuffie salvate con un tocco.","fSnd":"**Suono:** equalizzatore a 5 bande con preset, amplificazione fino al 500 %, volume delle cuffie che segue i loro tasti, **Muto** e **Modalità notte** (esplosioni più morbide, voci più chiare).","fCon":"**Connessione:** codec e un cursore di latenza da 40 a 200 ms con una stima del ritardo dal vivo.","fCodec":"**Codec:** **Auto** è SBC normale e funziona con tutto. **SBC HQ** e **SBC-XQ** si scelgono a mano quando le cuffie li supportano.","fLog":"**Registro:** ogni passo a colori: verde riuscito, rosso fallito, blu per le tue azioni.","fGame":"**Profili di gioco:** Avvia un gioco, regola il suono che ti piace e salvalo. I profili sono per gioco e per cuffie, si attivano da soli quando il gioco parte e ti restituiscono il suono di sempre quando si chiude. **Aggiorna profilo gioco** nel pannello Suono salva le modifiche.","fAuto":"**Connessione automatica e modalità riposo:** Le cuffie salvate si connettono da sole quando le accendi o le togli dalla custodia. Prima della modalità riposo HearBridge ferma le cuffie in modo pulito e le riconnette al risveglio.","setHome":"**Home:** torna alla pagina principale.","setHs":"**Cuffie:** cerca, connetti, disconnetti e dimentica.","setSnd":"**Suono e giochi:** Tono di prova, Suono pulito, **Avanti/indietro sull'auricolare cambia il volume** (per auricolari senza tasti del volume) e i tuoi giochi salvati.","setDet":"**Dettagli:** formato, batteria, AVRCP, ripartizione della latenza e chip Bluetooth.","setBk":"**Backup e ripristino:** cuffie salvate con la loro associazione, impostazioni e profili di gioco in un unico file, su una chiavetta USB, sulla console o sul dispositivo da cui navighi."}};

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,function(m,x){return /http|HearBridge \d/.test(x)?'<b class="ltr">'+x+'</b>':'<b>'+x+'</b>'});
  s=s.replace(/\[([^\]]+)\]\(((?:https:|#)[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function t(k){var d=STR[LANG]||STR.en;return d[k]!=null?d[k]:STR.en[k]}
function find(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]==c)return LANGS[i];return null}
function applyLang(c){
  var L=find(c)||LANGS[0];LANG=L[0];
  var h=document.documentElement;h.lang=LANG;h.dir=L[3]?"rtl":"ltr";
  var els=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<els.length;i++)els[i].innerHTML=fmt(t(els[i].getAttribute("data-i18n")));
  document.title="HearBridge PS5: "+t("h1a");
  document.getElementById("langflag").innerHTML=FLAGS[L[2]];
  var o=document.querySelectorAll(".langopt");for(var j=0;j<o.length;j++)o[j].classList.toggle("on",o[j].getAttribute("data-lang")==LANG);
  fitHeader();
}
function initLang(){
  var list=document.getElementById("langlist"),btn=document.getElementById("langbtn"),h="";
  for(var i=0;i<LANGS.length;i++){var L=LANGS[i];
    h+='<button type="button" class="langopt" role="menuitem" data-lang="'+L[0]+'" lang="'+L[0]+'"'+(L[3]?' dir="rtl"':'')+'><span class="flag">'+FLAGS[L[2]]+'</span><span>'+L[1]+'</span></button>'}
  list.innerHTML=h;
  function setOpen(v){list.classList.toggle("show",v);btn.setAttribute("aria-expanded",v?"true":"false");if(v){var on=list.querySelector(".on");(on||list.firstChild).focus()}}
  btn.addEventListener("click",function(e){e.stopPropagation();setOpen(!list.classList.contains("show"))});
  list.addEventListener("click",function(e){var b=e.target.closest(".langopt");if(!b)return;e.stopPropagation();applyLang(b.getAttribute("data-lang"));setOpen(false);btn.focus()});
  document.addEventListener("click",function(){setOpen(false)});
  document.addEventListener("keydown",function(e){if(e.key=="Escape"&&list.classList.contains("show")){setOpen(false);btn.focus()}});
  /* Always open in English; only ?lang= or the switcher changes it. No browser-language detection, nothing restored. */
  var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  applyLang(q&&find(q)?q:"en");
}
function fitHeader(){var top=document.querySelector(".top"),row=top.querySelector(".in");top.classList.remove("compact");
  if(row.scrollWidth>row.clientWidth+1)top.classList.add("compact")}
window.addEventListener("resize",fitHeader);
function initCopy(){
  var b=document.querySelectorAll("[data-copy]");
  for(var i=0;i<b.length;i++)b[i].addEventListener("click",function(){
    var me=this,txt=document.getElementById(me.getAttribute("data-copy")).textContent;
    function done(){me.classList.add("done");me.textContent=t("copied");setTimeout(function(){me.classList.remove("done");me.textContent=t("copy")},1600)}
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,function(){});
    else{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
  });
}
initLang();initCopy();
</script>
</body>
</html>
